# All data services are external and require separately provisioned TEST ACLs.
name: mars-uat
x-uat-app: &uat-app
  build:
    context: .
    dockerfile: Dockerfile.uat
  image: ${MARS_UAT_IMAGE:-mars-uat:${MARS_UAT_IMAGE_TAG:-candidate}}
  env_file:
    - /etc/mars/uat.env
  volumes:
    - mars_uat_storage:/var/www/html/storage
  read_only: true
  tmpfs:
    - /tmp
    - /var/www/html/bootstrap/cache
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  restart: unless-stopped

services:
  web:
    <<: *uat-app
    ports:
      - "127.0.0.1:${MARS_UAT_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  queue:
    <<: *uat-app
    profiles: ["workers"]
    command: ["php","artisan","queue:work","redis","--queue=default","--sleep=3","--tries=3","--timeout=60"]
  scheduler:
    <<: *uat-app
    profiles: ["workers"]
    command: ["php","artisan","schedule:work"]

volumes:
  mars_uat_storage:
