name: Self-Hosted Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-hosted-benchmark.yml

permissions:
  contents: read

concurrency:
  group: self-hosted-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark-${{ matrix.slot }}
    # The mars-ci custom label was probed first but did not match an online
    # runner. Use only built-in labels for the bootstrap benchmark.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]

    steps:
      - name: Runner identity and resources
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          echo "slot=${{ matrix.slot }}"
          echo "logical_cpus=$(nproc)"
          awk '/MemTotal:/ {print "mem_total_kib=" $2}' /proc/meminfo
          echo "load_average=$(cut -d ' ' -f1-3 /proc/loadavg)"
          free -h
          df -h .

      - name: Inventory preinstalled CI tools
        shell: bash
        run: |
          set -euo pipefail
          for cmd in php composer node npm docker podman psql createdb dropdb valkey-cli redis-cli; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "${cmd}=present path=$(command -v "$cmd")"
            else
              echo "${cmd}=missing"
            fi
          done

      - name: CPU checksum benchmark
        shell: bash
        run: |
          set -euo pipefail
          start_ns=$(date +%s%N)
          head -c $((256 * 1024 * 1024)) /dev/zero | sha256sum >/dev/null
          end_ns=$(date +%s%N)
          echo "sha256_256m_ms=$(((end_ns - start_ns) / 1000000))"

      - name: Temporary disk write benchmark
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/mars-ci-benchmark-${{ matrix.slot }}-$$.bin"
          trap 'rm -f "$file"' EXIT
          start_ns=$(date +%s%N)
          dd if=/dev/zero of="$file" bs=1M count=256 conv=fdatasync status=none
          end_ns=$(date +%s%N)
          echo "write_256m_ms=$(((end_ns - start_ns) / 1000000))"

      - name: Final resource snapshot
        if: always()
        shell: bash
        run: |
          echo "runner_name=${{ runner.name }}"
          echo "slot=${{ matrix.slot }}"
          echo "load_average=$(cut -d ' ' -f1-3 /proc/loadavg)"
          free -h
          df -h .
