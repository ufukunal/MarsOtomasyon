name: Mars Test SSH Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mars-test-ssh-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Runner and network layer
        shell: bash
        run: |
          set +e
          echo "RUNNER_HOSTNAME=$(hostname)"
          echo "RUNNER_USER=$(whoami)"
          tailscale status || true
          tailscale ping --timeout=5s mars-prod.taila20365.ts.net || true
          getent hosts mars-prod.taila20365.ts.net || true
          timeout 5 bash -c '</dev/tcp/mars-prod.taila20365.ts.net/22' && echo "TCP22=PASS" || echo "TCP22=FAIL"

      - name: Password SSH and remote read-only verification
        shell: bash
        run: |
          set +e

          CRED_FILE="config/test/test-server.md"
          if [ ! -f "$CRED_FILE" ]; then
            echo "SSH_AUTH=BLOCKED_CREDENTIAL_FILE_MISSING"
            exit 0
          fi

          SSH_USER="$(sed -n 's/^- Kullanıcı: `\([^`]*\)`$/\1/p' "$CRED_FILE" | head -n1)"
          SSH_PASS="$(sed -n 's/^- Şifre: `\([^`]*\)`$/\1/p' "$CRED_FILE" | head -n1)"

          if [ -z "$SSH_USER" ] || [ -z "$SSH_PASS" ]; then
            echo "SSH_AUTH=BLOCKED_CREDENTIAL_FIELDS_EMPTY"
            exit 0
          fi

          echo "::add-mask::$SSH_PASS"

          ASKPASS="$RUNNER_TEMP/mars-ssh-askpass.sh"
          cat > "$ASKPASS" <<'ASK'
          #!/bin/sh
          printf '%s\n' "$MARS_SSH_PASSWORD"
          ASK
          chmod 700 "$ASKPASS"

          export MARS_SSH_PASSWORD="$SSH_PASS"
          export SSH_ASKPASS="$ASKPASS"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:99

          setsid -w ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o PasswordAuthentication=yes             -o NumberOfPasswordPrompts=1             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=7             "$SSH_USER"@mars-prod.taila20365.ts.net             'echo SSH_AUTH=PASS;
             printf "REMOTE_USER="; whoami;
             printf "REMOTE_HOSTNAME="; hostname;
             printf "REMOTE_KERNEL="; uname -a;
             printf "REMOTE_UPTIME="; uptime -p;
             if command -v docker >/dev/null 2>&1; then
               echo DOCKER=PASS;
               docker --version;
               docker ps --format "CONTAINER={{.Names}}|IMAGE={{.Image}}|STATUS={{.Status}}" 2>/dev/null || echo DOCKER_PS=DENIED;
               PG_NAME=$(docker ps --format "{{.Names}} {{.Image}}" 2>/dev/null | awk "tolower(\$0) ~ /postgres/ {print \$1; exit}");
               if [ -n "$PG_NAME" ]; then
                 echo POSTGRES_CONTAINER=PASS;
                 docker inspect --format "PG_NAME={{.Name}}|PG_IMAGE={{.Config.Image}}|PG_STATE={{.State.Status}}|PG_HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$PG_NAME" 2>/dev/null || true;
               else
                 echo POSTGRES_CONTAINER=FAIL;
               fi;
             else
               echo DOCKER=FAIL;
               echo POSTGRES_CONTAINER=NOT_TESTED;
             fi;
             test -d /opt/marsotomasyon && echo MARS_PATH=PASS || echo MARS_PATH=FAIL'

          rc=$?
          rm -f "$ASKPASS"
          unset MARS_SSH_PASSWORD SSH_PASS SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY

          echo "SSH_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "SSH_AUTH=FAIL"
          fi
          exit 0
