name: M47 Format Debug

on:
  push:
    branches:
      - m4-7-stock-count-quick-count

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint app/Modules/Inventory/Counts/StockCountService.php database/migrations/2026_08_25_006300_create_stock_counts.php
      - run: git diff -- app/Modules/Inventory/Counts/StockCountService.php database/migrations/2026_08_25_006300_create_stock_counts.php
