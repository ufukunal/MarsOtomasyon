name: Purchase quote and dispatch regression verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/purchase-quote-recheck-20261016.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: 'false'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_HOST: 127.0.0.1
      MARS_INTEGRATION_TESTS_APPROVED: 'NO'
      MARS_VALKEY_TESTS_APPROVED: 'NO'
      MARS_PERFORMANCE_TESTS_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, gd, zip, pdo_pgsql
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan test tests/Unit/UI/PurchaseQuoteSourceContractTest.php tests/Unit/UI/PurchaseDispatchSourceContractTest.php tests/Unit/UI/V65BusinessDocumentPrintContractTest.php --stop-on-failure
      - run: vendor/bin/pint --test tests/Unit/UI/PurchaseQuoteSourceContractTest.php tests/Unit/UI/PurchaseDispatchSourceContractTest.php tests/Unit/UI/V65BusinessDocumentPrintContractTest.php
