name: Tmp M18 Format

on:
  push:
    branches: [tmp/m18-pint-diff]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: tmp/m18-pint-diff
          fetch-depth: 0
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint canonical formatting
        run: composer format
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Modules/Commerce/MarketplacePack/MarketplacePackGateway.php \
                  app/Modules/Commerce/MarketplacePack/MarketplacePackService.php \
                  app/Modules/Commerce/Providers/Amazon/AmazonSpApiClient.php \
                  tests/Integration/Commerce/M18MarketplacePackTest.php
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git commit -m "tmp: apply Pint canonical formatting"
          git push origin HEAD:tmp/m18-pint-diff
