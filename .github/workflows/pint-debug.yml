name: Pint Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pint-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint and remove temporary workflow
        run: |
          vendor/bin/pint database/migrations/2026_08_27_008800_create_supplier_invoices.php
          git rm .github/workflows/pint-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrations/2026_08_27_008800_create_supplier_invoices.php
          git commit -m "style(m9.4): normalize supplier invoice migration"
          git push origin HEAD:${{ github.head_ref }}
