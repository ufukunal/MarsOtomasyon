name: Production UI Docs Probe

on:
  push:
    branches:
      - ops/prod-ui-docs-20260913

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe current production state
        shell: bash
        run: |
          set -Eeuo pipefail
          key=/tmp/mars-prod-transport-20260913.pem
          pass=/tmp/mars-prod-pass-20260913
          cipher=/tmp/mars-prod-pass-20260913.bin
          askpass=/tmp/mars-prod-askpass-20260913
          known=/tmp/mars-prod-known-hosts-20260913
          cleanup() { rm -f "$pass" "$cipher" "$askpass" "$known"; }
          trap cleanup EXIT
          test -s "$key"
          base64 -d .ops/prod-pass.enc > "$cipher"
          openssl pkeyutl -decrypt -inkey "$key" -in "$cipher" -out "$pass" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$pass"
          secret="$(cat "$pass")"; echo "::add-mask::$secret"; unset secret
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          cat /tmp/mars-prod-pass-20260913
          EOF
          chmod 700 "$askpass"
          ssh-keyscan -T 5 -t ed25519 mars-prod.taila20365.ts.net > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:HBjgtjY+qIJiw00Cf7uzej/UIKWANYIjVe0VSz6Uh2I'
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid ssh -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 ufuk@mars-prod.taila20365.ts.net 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/marsotomasyon
          ENV="$ROOT/.env.production"
          test -d "$ROOT"
          test -f "$ENV"
          echo "HOSTNAME=$(hostname)"
          echo "ROOT_SHA=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo unavailable)"
          echo 'ROOT_STATUS_BEGIN'
          git -C "$ROOT" status --porcelain || true
          echo 'ROOT_STATUS_END'
          MARKER="$(cat "$ROOT/.mars-production-release" 2>/dev/null || true)"
          echo "PRODUCTION_MARKER=${MARKER:-missing}"
          if [ -n "$MARKER" ] && [ -f "$ROOT/.mars-releases/$MARKER/docker-compose.production.yml" ]; then
            REL="$ROOT/.mars-releases/$MARKER"
            export MARS_IMAGE_TAG="release-${MARKER:0:12}"
          else
            REL="$ROOT"
          fi
          export MARS_ENV_FILE="$ENV"
          COMPOSE=(docker compose --env-file "$ENV" -f "$REL/docker-compose.production.yml")
          echo 'SERVICES_BEGIN'
          "${COMPOSE[@]}" ps
          echo 'SERVICES_END'
          "${COMPOSE[@]}" exec -T app php artisan mars:ops-status </dev/null
          POSTGRES_CID="$(${COMPOSE[@]} ps -q postgres)"
          VALKEY_CID="$(${COMPOSE[@]} ps -q valkey)"
          test -n "$POSTGRES_CID"
          test -n "$VALKEY_CID"
          echo "POSTGRES_HEALTH=$(docker inspect "$POSTGRES_CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
          echo "VALKEY_HEALTH=$(docker inspect "$VALKEY_CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
          REMOTE
