name: TEST V4 - Approved Kickoff 2026-10-10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v4-kickoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-kickoff-r4-20261010
  cancel-in-progress: false
jobs:
  remote-readonly-preflight:
    name: R4 - live TEST database and Valkey isolation (read-only)
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 7
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_HOST: mars-prod-1.taila20365.ts.net
      DB_PORT: "55432"
      DB_MASTER_DATABASE: mars_test_master
      DB_USERNAME: mars_test
      DB_PASSWORD: ${{ secrets.MARS_V4_DB_PASSWORD }}
      REDIS_HOST: mars-prod-1.taila20365.ts.net
      REDIS_PORT: "6379"
      REDIS_USERNAME: mars_test
      REDIS_PASSWORD: ${{ secrets.MARS_V4_VALKEY_PASSWORD }}
      REDIS_PREFIX: "mars:test:"
    steps:
      - uses: actions/checkout@v4
      - name: Choose installed PHP client
        shell: bash
        run: bash scripts/ci/select-php.sh
      - name: Check remote test DB roles and Valkey ACL without modifying data
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 180s bash scripts/ci/test-v4-direct.sh preflight 2>&1 | tee artifacts/test-v4/preflight.log
      - name: Save preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-kickoff-preflight-${{ github.run_id }}
          path: artifacts/test-v4/
          retention-days: 14
          if-no-files-found: ignore
  offline-unit:
    name: R4 - V4 Unit suite (isolated offline network settings)
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 22
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Choose PHP 8.4+ with client extensions
        shell: bash
        run: bash scripts/ci/select-php.sh
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Force non-routable DB and Valkey hosts only in ephemeral checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('phpunit.xml')
          xml=path.read_text()
          for token in ('name="DB_HOST" value="mars-prod-1.taila20365.ts.net"', 'name="REDIS_HOST" value="mars-prod-1.taila20365.ts.net"'):
              assert token in xml, 'Test isolation pin missing in PHPUnit configuration'
              xml=xml.replace(token,token.replace('mars-prod-1.taila20365.ts.net','192.0.2.1'))
          xml=xml.replace('name="DB_PORT" value="55432"', 'name="DB_PORT" value="9"')
          xml=xml.replace('name="REDIS_PORT" value="6379"', 'name="REDIS_PORT" value="9"')
          path.write_text(xml)
          PY
          echo "Offline Unit: no PROD/Tailnet DB or Valkey access configured; no server installation."
      - name: Execute complete V4 Unit suite
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 1000s bash scripts/ci/test-v4.sh unit 2>&1 | tee artifacts/test-v4/unit.log
      - name: Retain complete unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-kickoff-unit-${{ github.run_id }}
          path: artifacts/test-v4/
          retention-days: 14
          if-no-files-found: ignore
