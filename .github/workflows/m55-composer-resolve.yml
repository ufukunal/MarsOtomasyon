name: M55 Composer Resolve

on:
  push:
    branches:
      - m5-5-pdf-finalized-detail
    paths:
      - .github/workflows/m55-composer-resolve.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring
          coverage: none

      - name: Resolve Dompdf dependency
        run: composer require dompdf/dompdf:^3.1.6 --no-interaction --no-scripts --no-audit

      - name: Commit resolved lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add Dompdf PDF renderer dependency"
          git push origin HEAD:${GITHUB_REF_NAME}
