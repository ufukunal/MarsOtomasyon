name: Finalize Repository

on:
  workflow_dispatch:
    inputs:
      confirm_m8_reconciled:
        description: "Confirm M8 unique work has been reconciled into main before deleting old branches"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, mars, ci]

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate PR checks and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          REQUIRED_CHECKS="quality postgres-tests browser-smoke security"

          merge_pr () {
            PR="$1"

            STATE="$(gh api "repos/$REPO/pulls/$PR" --jq '.state')"

            if [ "$STATE" = "closed" ]; then
              echo "PR #$PR already closed."
              return
            fi

            SHA="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
            echo "Checking PR #$PR ($SHA)"

            CHECKS="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                --jq '.check_runs[] | [.name,.status,.conclusion] | @tsv'
            )"

            echo "$CHECKS"

            for NAME in $REQUIRED_CHECKS; do
              ROW="$(printf '%s\n' "$CHECKS" | awk -F '\t' -v n="$NAME" '$1 == n { print; exit }')"

              if [ -z "$ROW" ]; then
                echo "Missing required check '$NAME' on PR #$PR."
                exit 1
              fi

              STATUS="$(printf '%s\n' "$ROW" | cut -f2)"
              CONCLUSION="$(printf '%s\n' "$ROW" | cut -f3)"

              if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
                echo "Required check '$NAME' is not green on PR #$PR: status=$STATUS conclusion=$CONCLUSION"
                exit 1
              fi
            done

            echo "PR #$PR is 4/4 green. Merging..."

            gh pr merge "$PR" \
              --repo "$REPO" \
              --squash \
              --delete-branch
          }

          merge_pr 68
          merge_pr 69

      - name: Wait for current main 4/4 CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          REQUIRED_CHECKS="quality postgres-tests browser-smoke security"

          echo "Current main: $MAIN_SHA"

          for attempt in $(seq 1 80); do
            CHECKS="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$REPO/commits/$MAIN_SHA/check-runs?per_page=100" \
                --jq '.check_runs[] | [.name,.status,.conclusion] | @tsv'
            )"

            READY=1
            FAILED=0

            echo "Attempt $attempt"
            printf '%s\n' "$CHECKS"

            for NAME in $REQUIRED_CHECKS; do
              ROW="$(printf '%s\n' "$CHECKS" | awk -F '\t' -v n="$NAME" '$1 == n { print; exit }')"

              if [ -z "$ROW" ]; then
                READY=0
                continue
              fi

              STATUS="$(printf '%s\n' "$ROW" | cut -f2)"
              CONCLUSION="$(printf '%s\n' "$ROW" | cut -f3)"

              if [ "$STATUS" != "completed" ]; then
                READY=0
                continue
              fi

              if [ "$CONCLUSION" != "success" ]; then
                echo "Required main check '$NAME' failed: $CONCLUSION"
                FAILED=1
              fi
            done

            if [ "$FAILED" -ne 0 ]; then
              echo "main CI FAILED. Branch cleanup will NOT run."
              exit 1
            fi

            if [ "$READY" -eq 1 ]; then
              echo "main CI is 4/4 green."
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for current main 4/4 CI. Branch cleanup will NOT run."
          exit 1

      - name: M8 reconciliation safety gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIRM_M8: ${{ inputs.confirm_m8_reconciled }}
        run: |
          set -euo pipefail

          M8_BRANCHES="$(
            gh api \
              --paginate \
              "repos/$REPO/branches?per_page=100" \
              --jq '.[] | select(.name == "m8-3-invoice-order-progress" or .name == "chore/m8-progress-hardening") | .name'
          )"

          if [ -n "$M8_BRANCHES" ] && [ "$CONFIRM_M8" != "true" ]; then
            echo "Refusing destructive cleanup because M8 branches still exist:"
            echo "$M8_BRANCHES"
            echo "Reconcile M8 into main, then re-run with confirm_m8_reconciled=true."
            exit 1
          fi

          echo "M8 reconciliation gate passed."

      - name: Delete all branches except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="$(gh api "repos/$REPO" --jq '.default_branch')"

          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "Refusing cleanup: default branch is '$DEFAULT_BRANCH', not main."
            exit 1
          fi

          BRANCHES="$(
            gh api \
              --paginate \
              "repos/$REPO/branches?per_page=100" \
              --jq '.[].name'
          )"

          while IFS= read -r BRANCH; do
            [ -z "$BRANCH" ] && continue
            [ "$BRANCH" = "main" ] && continue

            echo "Deleting branch: $BRANCH"

            ENCODED="$(
              python3 -c \
                'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
                "$BRANCH"
            )"

            gh api \
              --method DELETE \
              "repos/$REPO/git/refs/heads/$ENCODED"
          done <<< "$BRANCHES"

      - name: Final repository verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCHES="$(
            gh api \
              --paginate \
              "repos/$REPO/branches?per_page=100" \
              --jq '.[].name'
          )"

          echo "Branches:"
          echo "$BRANCHES"

          BRANCH_COUNT="$(printf '%s\n' "$BRANCHES" | grep -c . || true)"

          if [ "$BRANCH_COUNT" -ne 1 ] || [ "$BRANCHES" != "main" ]; then
            echo "Expected exactly one branch: main"
            exit 1
          fi

          OPEN_PRS="$(
            gh api \
              "repos/$REPO/pulls?state=open&per_page=100" \
              --jq 'length'
          )"

          echo "Open PRs: $OPEN_PRS"

          if [ "$OPEN_PRS" -ne 0 ]; then
            echo "There are still open pull requests."
            exit 1
          fi

          MAIN_SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          CHECKS="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/commits/$MAIN_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name,.status,.conclusion] | @tsv'
          )"

          for NAME in quality postgres-tests browser-smoke security; do
            ROW="$(printf '%s\n' "$CHECKS" | awk -F '\t' -v n="$NAME" '$1 == n { print; exit }')"
            STATUS="$(printf '%s\n' "$ROW" | cut -f2)"
            CONCLUSION="$(printf '%s\n' "$ROW" | cut -f3)"

            if [ -z "$ROW" ] || [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
              echo "Final verification failed for check '$NAME'."
              exit 1
            fi
          done

          echo "FINAL RESULT"
          echo "Only branch: main"
          echo "Open PRs: 0"
          echo "main CI: quality/postgres-tests/browser-smoke/security = green"
          echo "Repository cleanup: OK"
