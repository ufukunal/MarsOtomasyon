name: Production Encrypted Inspect

on:
  push:
    branches:
      - ops/prod-probe-f8e1f2f1
    paths:
      - .github/workflows/prod-encrypted-inspect.yml

permissions:
  contents: read

concurrency:
  group: prod-encrypted-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 5
    env:
      PASSWORD_CIPHERTEXT_B64: 
    steps:
      - name: Verify Tailnet path
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping -c 3 mars-prod

      - name: Decrypt credential in memory and inspect host
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir=/var/tmp/mars-prod-ferry-f8e1f2f1
          test -s "$key_dir/private.pem"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset MARS_DEPLOY_PASSWORD' EXIT
          printf '%s' "$PASSWORD_CIPHERTEXT_B64" | base64 -d > "$tmp/password.bin"
          MARS_DEPLOY_PASSWORD="$(openssl pkeyutl -decrypt -inkey "$key_dir/private.pem" -in "$tmp/password.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)"
          test -n "$MARS_DEPLOY_PASSWORD"
          export MARS_DEPLOY_PASSWORD
          cat > "$tmp/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$MARS_DEPLOY_PASSWORD"
          ASKPASS
          chmod 0700 "$tmp/askpass"
          ssh-keyscan -T 5 -t ed25519 mars-prod.taila20365.ts.net > "$tmp/known_hosts" 2>/dev/null
          chmod 0600 "$tmp/known_hosts"
          export DISPLAY=:0 SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force
          setsid -w ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$tmp/known_hosts" \
            ufuk@mars-prod.taila20365.ts.net 'bash -s' <<'REMOTE'
          set -eu
          echo "PROD_HOST=$(hostname)"
          echo "PROD_USER=$(id -un)"
          echo "PROD_UID=$(id -u)"
          printf 'OS='; . /etc/os-release; printf '%s %s\n' "$NAME" "$VERSION_ID"
          printf 'KERNEL='; uname -sr
          printf 'TAILSCALE_IP='; tailscale ip -4 2>/dev/null || true
          printf 'DOCKER='; docker --version 2>/dev/null || echo unavailable
          printf 'COMPOSE='; docker compose version 2>/dev/null || echo unavailable
          if sudo -n true >/dev/null 2>&1; then echo 'SUDO_NOPASSWD=yes'; else echo 'SUDO_NOPASSWD=no'; fi
          echo '--- APP_ROOTS ---'
          find /opt /srv /var/www /home/ufuk -maxdepth 5 -type f -name docker-compose.production.yml -print 2>/dev/null | head -20 || true
          echo '--- BLOCK_DEVICES ---'
          lsblk -o NAME,PATH,SIZE,TYPE,FSTYPE,FSVER,LABEL,UUID,MOUNTPOINTS 2>/dev/null || true
          echo '--- FILESYSTEMS ---'
          df -hT 2>/dev/null || true
          echo '--- MOUNTS ---'
          findmnt -o TARGET,SOURCE,FSTYPE,OPTIONS 2>/dev/null || true
          echo '--- STORAGE_DIRS ---'
          find /mnt /srv /opt -maxdepth 2 -mindepth 1 -type d -printf '%p\n' 2>/dev/null | head -100 || true
          echo '--- BACKUP_PATH ---'
          if [ -e /mnt/mars-backup ]; then
            ls -ld /mnt/mars-backup
            findmnt -T /mnt/mars-backup 2>/dev/null || true
            mountpoint /mnt/mars-backup 2>/dev/null || true
            df -hT /mnt/mars-backup 2>/dev/null || true
            test -w /mnt/mars-backup && echo 'BACKUP_WRITABLE=yes' || echo 'BACKUP_WRITABLE=no'
          else
            echo 'BACKUP_PATH=absent'
          fi
          echo '--- CONTAINERS ---'
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' 2>/dev/null || echo 'DOCKER_PS=unavailable'
          echo '--- LISTENERS ---'
          ss -ltn 2>/dev/null | grep -E '(:22|:80|:443|:8080)[[:space:]]' || true
          echo '--- TAILSCALE_SERVE ---'
          tailscale serve status 2>/dev/null || true
          echo '--- ENV_CONTRACT ---'
          for root in /opt/marsotomasyon /srv/marsotomasyon /var/www/marsotomasyon /home/ufuk/MarsOtomasyon /home/ufuk/marsotomasyon; do
            [ -f "$root/.env.production" ] || continue
            echo "ENV_FILE=$root/.env.production"
            grep -E '^(APP_ENV|APP_URL|DB_HOST|DB_DATABASE|DB_USERNAME|MARS_BACKUP_DISK|MARS_BACKUP_LOCAL_PATH|MARS_BACKUP_OFFSITE_REQUIRED|MARS_BACKUP_OFFSITE_TARGET|MARS_HTTP_PORT)=' "$root/.env.production" || true
            for key in APP_KEY DB_PASSWORD MARS_BACKUP_RECOVERY_KEY; do
              if grep -Eq "^${key}=.+" "$root/.env.production"; then echo "$key=set"; else echo "$key=missing"; fi
            done
            if [ -d "$root/.git" ]; then printf 'GIT_SHA='; git -C "$root" rev-parse HEAD 2>/dev/null || true; fi
          done
          REMOTE
