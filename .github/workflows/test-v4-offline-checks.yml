name: TEST V4 - Approved Contracts and Feature Kickoff
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-v4-offline-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-offline-contracts-feature-kickoff
  cancel-in-progress: true
jobs:
  offline-contracts:
    name: R4 - V4 Contracts suite (source contracts, no DB mutations)
    runs-on: [self-hosted, Linux, mars-ubuntu]
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP
        run: bash scripts/ci/select-php.sh
      - name: Create runner-only Laravel .env from example
        shell: bash
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Execute source-only contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 600s bash scripts/ci/test-v4.sh contracts 2>&1 | tee artifacts/test-v4/contracts.log
      - name: Save contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-contracts-${{ github.run_id }}
          path: artifacts/test-v4
          retention-days: 14
          if-no-files-found: ignore
  offline-feature:
    name: R4 - V4 Feature suite (anonymous, DB endpoints disabled)
    runs-on: [self-hosted, Linux, mars-ubuntu]
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP
        run: bash scripts/ci/select-php.sh
      - name: Create runner-only Laravel .env from example
        shell: bash
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Disable all remote database endpoints in ephemeral PHPUnit config
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("phpunit.xml")
          v=p.read_text()
          assert v.count('value="mars-prod-1.taila20365.ts.net"') == 2
          v=v.replace('value="mars-prod-1.taila20365.ts.net"', 'value="192.0.2.1"')
          v=v.replace('name="DB_PORT" value="55432"', 'name="DB_PORT" value="9"')
          v=v.replace('name="REDIS_PORT" value="6379"', 'name="REDIS_PORT" value="9"')
          p.write_text(v)
          PY
      - name: Execute anonymous Feature security suite
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 600s bash scripts/ci/test-v4.sh feature 2>&1 | tee artifacts/test-v4/feature.log
      - name: Save feature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-feature-${{ github.run_id }}
          path: artifacts/test-v4
          retention-days: 14
          if-no-files-found: ignore
