name: Temporary stale branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reconciled stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'chore/m8-progress-hardening'
            'chore/m8-progress-hardening-v2'
            'feat/m12-returns-rma'
            'feat/m13-reports-core'
            'm8-3-invoice-order-progress'
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == 'main' ]]; then
              echo 'Refusing to delete main' >&2
              exit 1
            fi

            encoded="${branch//\//%2F}"
            echo "Deleting ${branch}"
            curl --silent --show-error --fail-with-body \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done
