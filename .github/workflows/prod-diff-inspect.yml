name: Production State Inspect

on:
  push:
    branches: [ops/prod-probe-f8e1f2f1]
    paths: [.github/workflows/prod-diff-inspect.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 5
    env:
      PASSWORD_CIPHERTEXT_B64: 
    steps:
      - name: Read deployed state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_dir=/var/tmp/mars-prod-ferry-f8e1f2f1
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset MARS_DEPLOY_PASSWORD' EXIT
          printf '%s' "$PASSWORD_CIPHERTEXT_B64" | base64 -d > "$tmp/password.bin"
          MARS_DEPLOY_PASSWORD="$(openssl pkeyutl -decrypt -inkey "$key_dir/private.pem" -in "$tmp/password.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256)"
          export MARS_DEPLOY_PASSWORD
          cat > "$tmp/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$MARS_DEPLOY_PASSWORD"
          ASKPASS
          chmod 0700 "$tmp/askpass"
          ssh-keyscan -T 5 -t ed25519 mars-prod.taila20365.ts.net > "$tmp/known_hosts" 2>/dev/null
          export DISPLAY=:0 SSH_ASKPASS="$tmp/askpass" SSH_ASKPASS_REQUIRE=force
          setsid -w ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" ufuk@mars-prod.taila20365.ts.net 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/marsotomasyon
          echo "GIT_SHA=$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo GIT_DIRTY=yes; else echo GIT_DIRTY=no; fi
          echo "RECORDED_SHA=$(cat "$HOME/.mars/deployed-sha" 2>/dev/null || true)"
          echo "WEB_BIND=$(docker compose --env-file .env.production -f docker-compose.production.yml port web 80 | tail -n1)"
          echo "PHP_VERSION=$(docker exec marsotomasyon-app-1 php -r 'echo PHP_VERSION;')"
          docker exec marsotomasyon-web-1 nginx -v 2>&1 | sed 's/^/NGINX_/'
          docker exec marsotomasyon-postgres-1 postgres --version | sed 's/^/POSTGRES_/'
          docker exec marsotomasyon-valkey-1 valkey-server --version | sed 's/^/VALKEY_/'
          echo "WORKER=$(docker inspect -f '{{.State.Status}}' marsotomasyon-worker-1)"
          echo "SCHEDULER=$(docker inspect -f '{{.State.Status}}' marsotomasyon-scheduler-1)"
          echo "UPDATE_TIMER_ENABLED=$(systemctl is-enabled mars-update-executor.timer 2>/dev/null || true)"
          echo "UPDATE_TIMER_ACTIVE=$(systemctl is-active mars-update-executor.timer 2>/dev/null || true)"
          echo "USER_LINGER=$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null || true)"
          echo '--- OPS_STATUS ---'
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T app php artisan mars:ops-status || true
          echo '--- TAILSCALE ---'
          tailscale serve status 2>/dev/null || true
          REMOTE
