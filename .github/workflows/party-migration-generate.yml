name: PARTY-IMP-003 Migration Generate
# PARTY-IMP-003 clean regeneration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/party-migration-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    name: generate-party-tax-identity-migration
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore

      - name: Generate PARTY-IMP-003 migration
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations add PartyImp003TurkishTaxIdentity \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build \
            --output-dir Persistence/Migrations/Parties
          test -d src/Mars.Infrastructure/Persistence/Migrations/Parties

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: party-imp-003-migration
          if-no-files-found: error
          path: |
            src/Mars.Infrastructure/Persistence/Migrations/Parties/
            src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs

      - name: Commit generated migration to main
        shell: bash
        run: |
          set -euo pipefail

          git add \
            src/Mars.Infrastructure/Persistence/Migrations/Parties/ \
            src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs

          if git diff --cached --quiet; then
            echo "No generated migration changes were produced."
            exit 1
          fi

          git config user.name "mars-ci"
          git config user.email "mars-ci@users.noreply.github.com"
          git commit -m "db: add PARTY-IMP-003 tax identity migration"
          git push origin HEAD:main
