name: PARTY-IMP-001 Migration Generate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/party-migration-generate.yml"

permissions:
  contents: write

jobs:
  generate:
    name: generate-party-migration
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore

      - name: Generate PARTY-IMP-001 migration
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations add PartyImp001CoreIdentity \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build \
            --output-dir Persistence/Migrations/Parties
          test -d src/Mars.Infrastructure/Persistence/Migrations/Parties

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: party-imp-001-migration
          if-no-files-found: error
          path: |
            src/Mars.Infrastructure/Persistence/Migrations/Parties/
            src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs

      - name: Commit generated migration to main and disable helper
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/party-migration-generate.yml")
          text = path.read_text(encoding="utf-8")
          old = '''on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/party-migration-generate.yml"
'''
          new = '''on:
  workflow_dispatch:
'''
          if old not in text:
              raise SystemExit("Expected one-shot push trigger not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git add \
            .github/workflows/party-migration-generate.yml \
            src/Mars.Infrastructure/Persistence/Migrations/Parties/ \
            src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs

          if git diff --cached --quiet; then
            echo "No generated migration changes were produced."
            exit 1
          fi

          git config user.name "mars-ci"
          git config user.email "mars-ci@users.noreply.github.com"
          git commit -m "db: add PARTY-IMP-001 migration"
          git push origin HEAD:main
