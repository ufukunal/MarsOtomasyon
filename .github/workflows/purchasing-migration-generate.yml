name: PURCHASING-IMP-001 Migration Generate
# PURCHASING-IMP-001 migration is committed; retained as manual/read-only evidence tooling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-purchasing-authority-migration
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore -m:1

      - name: Verify committed PURCHASING-IMP-001 migration/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_DIR="src/Mars.Infrastructure/Persistence/Migrations/Purchasing"
          MIG_FILE="$MIG_DIR/20260924201517_PurchasingImp001CommercialReceiptInvoiceAuthority.cs"

          test -f "$MIG_FILE"
          test -f "$MIG_DIR/20260924201517_PurchasingImp001CommercialReceiptInvoiceAuthority.Designer.cs"

          grep -F 'name: "purchase_orders"' "$MIG_FILE"
          grep -F 'name: "purchase_order_versions"' "$MIG_FILE"
          grep -F 'name: "purchase_order_lines"' "$MIG_FILE"
          grep -F 'name: "purchase_order_amendments"' "$MIG_FILE"
          grep -F 'name: "purchase_order_amendment_deltas"' "$MIG_FILE"
          grep -F 'name: "goods_receipts"' "$MIG_FILE"
          grep -F 'name: "goods_receipt_lines"' "$MIG_FILE"
          grep -F 'name: "goods_receipt_inventory_effect_links"' "$MIG_FILE"
          grep -F 'name: "supplier_invoices"' "$MIG_FILE"
          grep -F 'name: "supplier_invoice_lines"' "$MIG_FILE"
          grep -F 'name: "supplier_invoice_source_links"' "$MIG_FILE"
          grep -F 'name: "purchase_match_results"' "$MIG_FILE"
          grep -F 'name: "purchase_match_exceptions"' "$MIG_FILE"

          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
