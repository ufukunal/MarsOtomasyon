name: M17 Reservation Seam

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-reservation-seam.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Wire reservation allocation and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/Modules/Operations/ChannelDomainSync.php')
          s = p.read_text()
          old = """        $basis = strtolower((string) ($credentials['price_basis'] ?? 'net')) === 'gross'\n            ? PriceBasis::Gross\n            : PriceBasis::Net;\n        $lines = [];\n"""
          new = """        $basis = strtolower((string) ($credentials['price_basis'] ?? 'net')) === 'gross'\n            ? PriceBasis::Gross\n            : PriceBasis::Net;\n        [$warehouseId, $locationId] = $this->reservationAllocation($credentials);\n        $lines = [];\n"""
          if old not in s:
              raise SystemExit('basis pattern not found')
          s = s.replace(old, new, 1)
          old = """                logicalLineKey: Uuid::uuid5(Uuid::NAMESPACE_URL, 'mars:channel:'.$provider.':'.$externalId.':'.$index.':'.$mappingKey)->toString(),\n                taxIsZeroed: false,\n"""
          new = """                logicalLineKey: Uuid::uuid5(Uuid::NAMESPACE_URL, 'mars:channel:'.$provider.':'.$externalId.':'.$index.':'.$mappingKey)->toString(),\n                warehouseId: $warehouseId,\n                locationId: $locationId,\n                taxIsZeroed: false,\n"""
          if old not in s:
              raise SystemExit('line allocation pattern not found')
          s = s.replace(old, new, 1)
          marker = """    private function mappedProduct(\n"""
          method = """    /**\n     * @param  array<string,mixed>  $credentials\n     * @return array{0:?int,1:?int}\n     */\n    private function reservationAllocation(array $credentials): array\n    {\n        $warehouseId = (int) ($credentials['default_warehouse_id'] ?? 0);\n        $locationId = (int) ($credentials['default_location_id'] ?? 0);\n        if (($warehouseId > 0) !== ($locationId > 0)) {\n            throw new DomainException('Channel reservation requires warehouse and location together.');\n        }\n        if ($warehouseId < 1) {\n            return [null, null];\n        }\n\n        return [$warehouseId, $locationId];\n    }\n\n"""
          if marker not in s:
              raise SystemExit('mappedProduct marker not found')
          p.write_text(s.replace(marker, method + marker, 1))

          p = Path('app/Modules/Commerce/Http/CommerceController.php')
          s = p.read_text()
          old = """            'products' => DB::table('products')->where('company_id', $companyId)->where('status', 'active')->orderBy('code')->limit(500)->get(['id', 'code', 'name']),\n            'mappings' => DB::table('channel_product_mappings as m')\n"""
          new = """            'products' => DB::table('products')->where('company_id', $companyId)->where('status', 'active')->orderBy('code')->limit(500)->get(['id', 'code', 'name']),\n            'warehouses' => DB::table('warehouses')->where('company_id', $companyId)->where('is_active', true)->orderBy('code')->get(['id', 'code', 'name']),\n            'locations' => DB::table('warehouse_locations as l')\n                ->join('warehouses as w', 'w.id', '=', 'l.warehouse_id')\n                ->where('l.company_id', $companyId)->where('l.is_active', true)->where('w.is_active', true)\n                ->orderBy('w.code')->orderBy('l.code')\n                ->get(['l.id', 'l.warehouse_id', 'l.code', 'l.name', 'w.code as warehouse_code']),\n            'mappings' => DB::table('channel_product_mappings as m')\n"""
          if old not in s:
              raise SystemExit('controller index pattern not found')
          s = s.replace(old, new, 1)
          old = """            'clearing_account_id' => ['nullable', 'integer', 'min:1'],\n        ]);\n"""
          new = """            'clearing_account_id' => ['nullable', 'integer', 'min:1'],\n            'default_warehouse_id' => ['nullable', 'integer', 'min:1', 'required_with:default_location_id'],\n            'default_location_id' => ['nullable', 'integer', 'min:1', 'required_with:default_warehouse_id'],\n        ]);\n"""
          if old not in s:
              raise SystemExit('controller validation pattern not found')
          s = s.replace(old, new, 1)
          old = """                'price_basis' => (string) $validated['price_basis'],\n                'order_series' => (string) $validated['order_series'],\n            ],\n"""
          new = """                'price_basis' => (string) $validated['price_basis'],\n                'order_series' => (string) $validated['order_series'],\n                'default_warehouse_id' => isset($validated['default_warehouse_id']) ? (int) $validated['default_warehouse_id'] : null,\n                'default_location_id' => isset($validated['default_location_id']) ? (int) $validated['default_location_id'] : null,\n            ],\n"""
          if old not in s:
              raise SystemExit('controller credentials pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('resources/views/commerce/index.blade.php')
          s = p.read_text()
          old = """            <label>Clearing Cari<select name=\"clearing_account_id\"><option value=\"\">—</option>@foreach($accounts as $account)<option value=\"{{ $account->id }}\">{{ $account->code }} — {{ $account->legal_name }} ({{ $account->type }})</option>@endforeach</select></label>\n        </div>\n"""
          new = """            <label>Clearing Cari<select name=\"clearing_account_id\"><option value=\"\">—</option>@foreach($accounts as $account)<option value=\"{{ $account->id }}\">{{ $account->code }} — {{ $account->legal_name }} ({{ $account->type }})</option>@endforeach</select></label>\n            <label>Rezervasyon Deposu<select name=\"default_warehouse_id\"><option value=\"\">Rezervasyonsuz</option>@foreach($warehouses as $warehouse)<option value=\"{{ $warehouse->id }}\">{{ $warehouse->code }} — {{ $warehouse->name }}</option>@endforeach</select></label>\n            <label>Rezervasyon Lokasyonu<select name=\"default_location_id\"><option value=\"\">Rezervasyonsuz</option>@foreach($locations as $location)<option value=\"{{ $location->id }}\">{{ $location->warehouse_code }} / {{ $location->code }} — {{ $location->name }}</option>@endforeach</select></label>\n        </div>\n"""
          if old not in s:
              raise SystemExit('view connection pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          vendor/bin/pint app/Modules/Operations/ChannelDomainSync.php app/Modules/Commerce/Http/CommerceController.php
          vendor/bin/phpstan analyse app/Modules/Commerce app/Modules/Operations/ChannelDomainSync.php app/Modules/Operations/ChannelService.php --no-progress
          rm -f .github/workflows/m17-reservation-seam.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(m17): route channel orders through stock reservation"
          git push origin HEAD:feat/m17-commerce
