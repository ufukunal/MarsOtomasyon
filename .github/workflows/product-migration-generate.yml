name: PRODUCT-IMP-001 Migration Generate
# PRODUCT-IMP-001 migration is committed; generator retained as manual/read-only evidence tool.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate-product-master-completion-migration
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore

      - name: Verify committed PRODUCT-IMP-001 migration/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          test -f src/Mars.Infrastructure/Persistence/Migrations/Products/20260924085617_ProductImp001ProductMasterCompletion.cs
          test -f src/Mars.Infrastructure/Persistence/Migrations/Products/20260924085617_ProductImp001ProductMasterCompletion.Designer.cs
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
