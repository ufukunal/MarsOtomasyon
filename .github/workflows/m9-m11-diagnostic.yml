name: M9 M11 Diagnostic

# Temporary release diagnostic; removed before merge. Purchase return + M11 verification.
on:
  push:
    branches: [fix/m9-m11-finalize]

permissions:
  contents: read

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Fresh schema
        run: php artisan migrate:fresh --force
      - name: M9 purchase order completion
        run: php artisan test tests/Integration/PurchaseOrders/M9CompletionGuardTest.php --stop-on-failure
      - name: M9 purchase orders suite
        run: php artisan test tests/Integration/PurchaseOrders --stop-on-failure
      - name: M9 goods receipts
        run: php artisan test tests/Integration/GoodsReceipts --stop-on-failure
      - name: M9 supplier invoices
        run: php artisan test tests/Integration/SupplierInvoices --stop-on-failure
      - name: M9 purchase returns
        run: php artisan test tests/Integration/PurchaseReturns --stop-on-failure
      - name: M11 finalization regression
        run: php artisan test tests/Integration/Operations/M11FinalizationRegressionTest.php --stop-on-failure
      - name: M11 Trendyol domain sync
        run: php artisan test tests/Integration/Operations/M11TrendyolDomainSyncTest.php --stop-on-failure
      - name: M11 operations suite
        run: php artisan test tests/Integration/Operations --stop-on-failure
