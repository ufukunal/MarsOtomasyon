name: M17 Postgres Diagnostic

on:
  push:
    branches: [feat/m17-commerce]

permissions:
  contents: write

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan migrate:fresh --force
      - name: Run and capture full suite
        id: tests
        shell: bash
        run: |
          mkdir -p ci
          set +e
          composer test > ci/m17-postgres-full.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            {
              echo "exit_code=$code"
              echo "=== failure markers ==="
              grep -nEi -C 8 'FAIL|FAILED|ERROR|Exception|Tests:' ci/m17-postgres-full.log | tail -n 500 || true
              echo "=== tail ==="
              tail -n 500 ci/m17-postgres-full.log
            } > ci/m17-postgres-failure.txt
          else
            echo "exit_code=0" > ci/m17-postgres-failure.txt
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Persist diagnostic result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/m17-postgres-failure.txt
          git commit -m 'ci(m17): persist postgres diagnostic result'
          git push origin HEAD:feat/m17-commerce
      - name: Fail when suite failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
