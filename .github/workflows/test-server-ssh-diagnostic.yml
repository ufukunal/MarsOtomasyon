name: Test Server SSH Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-server-ssh-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Runner and network
        shell: bash
        run: |
          set +e
          echo "RUNNER_HOSTNAME=$(hostname)"
          echo "RUNNER_USER=$(whoami)"
          tailscale status || true
          tailscale ping --timeout=5s mars-prod.taila20365.ts.net || true
          getent hosts mars-prod.taila20365.ts.net || true
          timeout 5 bash -c '</dev/tcp/mars-prod.taila20365.ts.net/22' && echo "TCP22=PASS" || echo "TCP22=FAIL"

      - name: Tailscale SSH authentication via node IP
        shell: bash
        run: |
          set +e
          TARGET_IP="$(getent hosts mars-prod.taila20365.ts.net | awk 'NR==1 {print $1}')"
          echo "TARGET_IP=$TARGET_IP"
          timeout 15 tailscale ssh ufuk@"$TARGET_IP"             'echo TS_SSH_AUTH=PASS; printf "REMOTE_USER="; whoami; printf "REMOTE_HOSTNAME="; hostname; printf "REMOTE_KERNEL="; uname -a; printf "REMOTE_UPTIME="; uptime -p; if command -v docker >/dev/null 2>&1; then echo DOCKER=PASS; docker --version; docker ps --format "CONTAINER={{.Names}}|IMAGE={{.Image}}|STATUS={{.Status}}" 2>/dev/null || echo DOCKER_PS=DENIED; else echo DOCKER=FAIL; fi; test -d /opt/marsotomasyon && echo MARS_PATH=PASS || echo MARS_PATH=FAIL'
          rc=$?
          echo "TS_SSH_RC=$rc"
          if [ "$rc" -ne 0 ]; then echo "TS_SSH_AUTH=FAIL"; fi
          exit 0
