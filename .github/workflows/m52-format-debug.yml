name: M52 Format Debug

on:
  push:
    branches:
      - m5-2-quote-schema-crud

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint and print exact diff
        run: |
          vendor/bin/pint app/Modules/Quotes/Actions/CreateQuote.php app/Modules/Quotes/Actions/QuoteDraftResolver.php app/Modules/Quotes/QuoteController.php database/migrations/2026_08_25_006400_create_quotes.php tests/Integration/Quotes/QuoteCrudTest.php
          git diff -- app/Modules/Quotes/Actions/CreateQuote.php app/Modules/Quotes/Actions/QuoteDraftResolver.php app/Modules/Quotes/QuoteController.php database/migrations/2026_08_25_006400_create_quotes.php tests/Integration/Quotes/QuoteCrudTest.php
