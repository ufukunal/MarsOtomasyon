name: Remove M12 Diagnostics

on:
  push:
    branches: [feat/m12-returns-rma]
    paths:
      - '.github/workflows/diagnose-postgres.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary diagnostic files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/diagnose-postgres.yml ci-postgres-failure.txt
          git commit -m 'chore(m12): drop temporary postgres diagnostics'
          git push
