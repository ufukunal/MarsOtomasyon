name: M0 Fresh Clone Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-fresh-clone.yml

permissions:
  contents: write

concurrency:
  group: m0-fresh-clone
  cancel-in-progress: true

jobs:
  fresh-clone-acceptance:
    name: fresh-clone-acceptance
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 45

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mars_fresh_${{ github.run_id }}_${{ github.run_attempt }}
      DB_USERNAME: mars
      DB_PASSWORD: mars
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: session
      MAIL_MAILER: array
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      REDIS_PREFIX: 'mars-fresh-clone:${{ github.run_id }}:'
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      REDIS_QUEUE_DB: 2
      REDIS_SESSION_DB: 3
      REDIS_QUEUE: mars-fresh-clone-${{ github.run_id }}
      REDIS_QUEUE_RETRY_AFTER: 90
      COMPOSER_PROCESS_TIMEOUT: 1800

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local toolchain and shared services
        run: |
          php -v
          composer --version
          node --version
          npm --version
          PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"
          redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping | grep -qx PONG

      - name: Prepare isolated PostgreSQL database
        run: |
          PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: npm ci
        run: npm ci

      - name: Copy example environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Run non-browser tests
        run: composer test

      - name: Run browser tests
        run: composer test:browser

      - name: Cleanup isolated PostgreSQL database
        if: always()
        run: PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

      - name: Record fresh-clone result
        if: always()
        shell: bash
        env:
          ACCEPTANCE_STATUS: ${{ job.status }}
          ACCEPTANCE_RUN_ID: ${{ github.run_id }}
          ACCEPTANCE_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci
          printf 'conclusion=%s\nrun_id=%s\nhead_sha=%s\n' "$ACCEPTANCE_STATUS" "$ACCEPTANCE_RUN_ID" "$ACCEPTANCE_HEAD_SHA" > .ci/m0-fresh-clone-result

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/m0-fresh-clone-result

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: record M0 fresh-clone result [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
