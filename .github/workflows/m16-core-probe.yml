name: M16 Core Probe

on:
  push:
    branches: [feat/m16-import-container]
    paths: [.github/workflows/m16-core-probe.yml]

permissions:
  contents: write

jobs:
  m16-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_NAME: MarsOtomasyon
      APP_ENV: testing
      APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mars_test
      DB_USERNAME: mars
      DB_PASSWORD: mars
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Modules/Imports/Actions/ImportOperations.php')
          s = p.read_text()
          s = s.replace('use Illuminate\\Support\\Collection;', 'use Illuminate\\Database\\Eloquent\\Collection;')
          s = s.replace("$this->clock->now()->toDateString()", "$this->clock->now()->format('Y-m-d')")
          needle = '    private function transition(int $fileId, array $from, string $to): ImportFile'
          replacement = '    /** @param list<string> $from */\n    private function transition(int $fileId, array $from, string $to): ImportFile'
          s = s.replace(needle, replacement)
          p.write_text(s)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format M16 source
        run: vendor/bin/pint --parallel app/Modules/Imports database/migrations/2026_08_30_050000_create_m16_imports.php
      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force
      - name: Static analyse Imports
        run: vendor/bin/phpstan analyse app/Modules/Imports --no-progress
      - name: Commit verified fixes and remove probe
        if: success()
        run: |
          git rm .github/workflows/m16-core-probe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Modules/Imports database/migrations/2026_08_30_050000_create_m16_imports.php
          git commit -m "style(m16): verify import core on PostgreSQL"
          git push origin HEAD:feat/m16-import-container
