name: SSH Direct Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssh-direct-check.yml"

permissions:
  contents: read

jobs:
  ssh-direct-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: bash
        run: |
          echo "RUNNER_HOST=$(hostname)"
          echo "RUNNER_USER=$(whoami)"
          echo "TAILSCALE_BIN=$(command -v tailscale || true)"
          echo "SSH_BIN=$(command -v ssh || true)"

      - name: Tailscale and network check
        shell: bash
        run: |
          set +e
          if command -v tailscale >/dev/null 2>&1; then
            tailscale status
            tailscale ping --timeout=5s mars-prod.taila20365.ts.net
          fi
          getent hosts mars-prod.taila20365.ts.net || true
          timeout 5 bash -c '</dev/tcp/mars-prod.taila20365.ts.net/22' && echo "TCP22=PASS" || echo "TCP22=FAIL"

      - name: SSH key authentication check
        shell: bash
        run: |
          set +e
          if ! command -v ssh >/dev/null 2>&1; then
            echo "SSH_AUTH=NOT_TESTED_NO_CLIENT"
            exit 0
          fi
          ssh -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new             ufuk@mars-prod.taila20365.ts.net             'echo SSH_AUTH=PASS; printf "REMOTE_USER="; whoami; printf "REMOTE_HOST="; hostname; printf "REMOTE_KERNEL="; uname -a; test -d /opt/marsotomasyon && echo REPO_PATH=PASS || echo REPO_PATH=FAIL'
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "SSH_AUTH=FAIL_KEY_OR_CONNECTIVITY"
          fi
          exit 0
