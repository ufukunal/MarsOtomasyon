name: TEST V4 - Complete Offline Unit Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v4-full-unit-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-complete-unit-offline
  cancel-in-progress: false
jobs:
  all-unit:
    name: All V4 Unit - isolated no DB/Valkey
    runs-on: [self-hosted, Linux, mars-ubuntu]
    timeout-minutes: 18
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP
        run: bash scripts/ci/select-php.sh
      - name: Prepare test checkout
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
      - name: Disconnect all DB and Valkey endpoints in ephemeral config
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phpunit.xml')
          xml=p.read_text()
          for key in ('DB_HOST', 'REDIS_HOST'):
              old=f'name="{key}" value="mars-prod-1.taila20365.ts.net"'
              assert xml.count(old)==1, f'Expected isolated {key} declaration'
              xml=xml.replace(old, f'name="{key}" value="192.0.2.1"')
          for name,old,new in [('DB_PORT','55432','9'),('REDIS_PORT','6379','9')]:
              token=f'name="{name}" value="{old}"'
              assert token in xml
              xml=xml.replace(token,f'name="{name}" value="{new}"')
          p.write_text(xml)
          PY
      - name: Run all offline Unit tests (fail fast, no production network)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 900s vendor/bin/pest --testsuite=Unit --stop-on-failure 2>&1 | tee artifacts/test-v4/full-unit.log
      - name: Preserve complete Unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-full-unit-${{ github.run_id }}
          path: artifacts/test-v4
          retention-days: 14
          if-no-files-found: ignore
