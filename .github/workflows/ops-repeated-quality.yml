name: OPS - Three Full Local Runner Quality Passes
on:
  workflow_dispatch:
  push:
    branches: [ops/maintenance-5-11, ci/ssh-free-quality-20261009]
    paths:
      - '.github/workflows/ops-repeated-quality.yml'
      - '.github/workflows/quality.yml'
      - 'scripts/ci/remote-test-services.sh'
permissions:
  contents: read
jobs:
  pass-1:
    name: "Quality pass 1 of 3"
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  pass-2:
    name: "Quality pass 2 of 3"
    needs: pass-1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/quality.yml
    secrets: inherit
  pass-3:
    name: "Quality pass 3 of 3"
    needs: pass-2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/quality.yml
    secrets: inherit
