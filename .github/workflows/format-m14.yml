name: Format M14

on:
  push:
    branches: [feat/m14-production]
    paths:
      - '.github/workflows/format-m14.yml'
      - 'app/Modules/Production/**'
      - 'app/Modules/Inventory/Enums/StockMovementType.php'
      - 'database/migrations/2026_08_30_030000_create_m14_production.php'
      - 'tests/Integration/Production/**'

permissions:
  contents: write

concurrency:
  group: format-m14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m14-production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --parallel
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Modules/Production app/Modules/Inventory/Enums/StockMovementType.php database/migrations/2026_08_30_030000_create_m14_production.php tests/Integration/Production
          git commit -m 'style(m14): apply Pint formatting'
          git push origin HEAD:feat/m14-production
