name: OPS - Retire Obsolete Diagnostics
on:
  push:
    branches: [ops/maintenance-5-11]
    paths:
      - '.github/workflows/ops-branch-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    name: "Delete exact legacy branch SHAs only"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete verified obsolete branches (no main or active ops branch)
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo="ufukunal/MarsOtomasyon"
          main="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          echo "Verified main head: $main"
          for name in infra/persistent-test-services diag/pcov-probe diag/tailscale-probe server-inspect ci/dedicated-coverage-prep; do
            case "$name" in
          "infra/persistent-test-services") expected="0503584418b232bbdb13268aecaaefafae456347" ;;
          "diag/pcov-probe") expected="dd504abf175925bba366fc7fd3d5570f6f454c92" ;;
          "diag/tailscale-probe") expected="7a67f1e8f37135286b91d005f65aafd896884efd" ;;
          "server-inspect") expected="dba4b5bfc3e4f3d2540262ee484834bab99dfe93" ;;
          "ci/dedicated-coverage-prep") expected="5298c5b303d9f1e3705a0f592df45bcc9b3c8ffa" ;;
              *) echo "Not allowlisted"; exit 2 ;;
            esac
            actual="$(gh api "repos/$repo/git/ref/heads/$name" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then echo "Branch advanced: $name; preserving"; exit 3; fi
            open_prs="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq ".[] | select(.head.ref == \"$name\") | .number")"
            if [[ -n "$open_prs" ]]; then echo "Open PR for $name; preserving"; exit 4; fi
            if [[ "$name" == infra/persistent-test-services && "$actual" != "$main" ]]; then
              echo "Main does not match completed infrastructure branch; preserving"; exit 5
            fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$name" >/dev/null
            echo "REMOVED_VERIFIED_LEGACY_BRANCH=$name"
          done
          echo "LEGACY_BRANCH_CLEANUP_COMPLETE"
