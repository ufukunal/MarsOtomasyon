name: MarsProject approved financial correction PHPStan rerun
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v65-20screens-one-shot-qa-20261016.yml'
permissions:
  contents: read
concurrency:
  group: mars-20-screen-source-qa-20261016
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      MARS_INTEGRATION_TESTS_APPROVED: 'NO'
      MARS_VALKEY_TESTS_APPROVED: 'NO'
      MARS_PERFORMANCE_TESTS_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, gd, zip, pdo_pgsql, redis
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare isolated test configuration
        run: cp .env.example .env
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 |
            xargs -0 -r -n 1 php -l > /tmp/mars-php-lint.log
          echo "PHP files parsed: $(wc -l < /tmp/mars-php-lint.log)"
      - name: Compile Blade templates
        run: php artisan view:cache
      - name: Install frontend dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Validate V65 source contracts
        run: |
          bash scripts/ci/test-ui-v65-contract.sh
          node scripts/ci/verify-v65-html.mjs
      - name: Run isolated source-level UI tests
        run: |
          php artisan test tests/Unit/UI/V65BusinessDocumentPrintContractTest.php tests/Unit/UI/V65DocumentEditorPhase2Test.php tests/Unit/UI/V65DocumentEditorDesignTest.php tests/Unit/Documents/V65DocumentDraftSafetyTest.php --stop-on-failure
      - name: Run correction and twenty-screen source regression tests
        run: |
          php artisan test tests/Unit/UI/FinancialRecordCorrectionContractTest.php tests/Unit/UI/SecurityDetailsEditContractTest.php tests/Unit/UI/V65FinanceControlAlignmentTest.php tests/Unit/UI/V65TwentyScreenRouteParityTest.php --stop-on-failure
      - name: Check code style
        id: pint
        continue-on-error: true
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=raw
      - name: Enforce code style result
        if: steps.pint.outcome == 'failure'
        run: exit 1

  prototype-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render approved V65 in real Chromium
        run: bash scripts/ci/test-v65-browser-smoke.sh
      - name: Attach read-only prototype browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v65-approved-prototype-browser
          path: artifacts/v65-browser-*.png
          if-no-files-found: warn
          retention-days: 7

  test:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 18
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: master
      DB_HOST: mars-prod-1.taila20365.ts.net
      DB_PORT: '55432'
      DB_MASTER_DATABASE: mars_test_master
      DB_USERNAME: mars_test
      DB_PASSWORD: ${{ secrets.MARS_V4_DB_PASSWORD }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: mars-prod-1.taila20365.ts.net
      REDIS_PORT: '6379'
      REDIS_USERNAME: mars_test
      REDIS_PASSWORD: ${{ secrets.MARS_V4_VALKEY_PASSWORD }}
      REDIS_PREFIX: 'mars:test:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
      MARS_INTEGRATION_TESTS_APPROVED: I_APPROVE_LOCAL_TEST_ONLY
      MARS_VALKEY_TESTS_APPROVED: I_APPROVE_LOCAL_VALKEY_ONLY
      MARS_PERFORMANCE_TESTS_APPROVED: 'NO'
      ISOLATION_CONFIRMED: 'NO'
    steps:
      - uses: actions/checkout@v4
      - name: Check correct independent TEST runner
        run: |
          test "$RUNNER_NAME" = mars-ubuntu-04
          test "$DB_USERNAME" = mars_test
          test "$DB_MASTER_DATABASE" = mars_test_master
          test "$REDIS_USERNAME" = mars_test
          test "$REDIS_PREFIX" = 'mars:test:'
      - name: Install application dependencies on test runner
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify TEST-only database roles and Valkey ACL (read-only)
        run: |
          bash scripts/ci/test-v4-direct.sh preflight
          echo ISOLATION_CONFIRMED=YES >> "$GITHUB_ENV"
      - name: Contract tests
        run: bash scripts/ci/test-v4-direct.sh contracts
      - name: Unit tests
        run: bash scripts/ci/test-v4-direct.sh unit
      - name: HTTP feature tests
        run: bash scripts/ci/test-v4-direct.sh feature
      - name: PostgreSQL integration tests
        run: bash scripts/ci/test-v4-direct.sh integration
      - name: Isolated Valkey tests
        run: bash scripts/ci/test-v4-direct.sh valkey
