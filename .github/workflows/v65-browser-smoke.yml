name: Prototype v65 - Real Browser Render
on:
  push:
    branches: [main]
    paths:
      - 'reference/marsotomasyon-PROTOTIP-ONAYLI-v65.html'
      - 'scripts/ci/test-v65-browser-smoke.sh'
      - '.github/workflows/v65-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render approved v65 in headless Chromium
        run: bash scripts/ci/test-v65-browser-smoke.sh
      - name: Preserve screenshot and DOM for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-v65-browser-render
          path: artifacts/v65-browser-*
          if-no-files-found: ignore
