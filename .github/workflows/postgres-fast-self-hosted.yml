name: PostgreSQL Fast Self-Hosted

on:
  workflow_dispatch:

permissions:
  contents: read

# One physical CI host owns Redis DB indexes 0-11. Keep only the newest run
# active so separate workflow runs cannot flush each other's Redis databases.
concurrency:
  group: postgres-fast-self-hosted
  cancel-in-progress: true

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: /var/run/postgresql
  DB_PORT: 5432
  DB_USERNAME: marsci
  DB_PASSWORD: ''
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_QUEUE_RETRY_AFTER: 90
  COMPOSER_CACHE_DIR: /home/marsci/.cache/composer
  PGOPTIONS: '-c synchronous_commit=off -c jit=off'

jobs:
  postgres-shards:
    name: postgres-shard-${{ matrix.shard }}
    runs-on: [self-hosted, linux, x64, mars-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            redis_db: 0
            redis_cache_db: 1
            redis_queue_db: 2
            redis_session_db: 3
          - shard: 2
            redis_db: 4
            redis_cache_db: 5
            redis_queue_db: 6
            redis_session_db: 7
          - shard: 3
            redis_db: 8
            redis_cache_db: 9
            redis_queue_db: 10
            redis_session_db: 11

    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 3
      DB_DATABASE: mars_ci_${{ github.run_id }}_${{ matrix.shard }}
      REDIS_PREFIX: mars-ci-${{ github.run_id }}-${{ matrix.shard }}:
      REDIS_DB: ${{ matrix.redis_db }}
      REDIS_CACHE_DB: ${{ matrix.redis_cache_db }}
      REDIS_QUEUE_DB: ${{ matrix.redis_queue_db }}
      REDIS_SESSION_DB: ${{ matrix.redis_session_db }}
      REDIS_QUEUE: mars-ci-${{ github.run_id }}-${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner prerequisites
        run: bash scripts/ci/verify-self-hosted-runner.sh

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create isolated PostgreSQL database
        run: |
          dropdb --if-exists -h "$DB_HOST" -U "$DB_USERNAME" "$DB_DATABASE"
          createdb -h "$DB_HOST" -U "$DB_USERNAME" "$DB_DATABASE"

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run test shard
        run: bash scripts/ci/run-postgres-test-shard.sh

      - name: Drop isolated PostgreSQL database
        if: always()
        run: dropdb --if-exists -h "$DB_HOST" -U "$DB_USERNAME" "$DB_DATABASE" || true

  postgres-tests-self-hosted:
    name: postgres-tests-self-hosted
    if: always()
    needs: postgres-shards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every shard to pass
        env:
          SHARD_RESULT: ${{ needs.postgres-shards.result }}
        run: |
          echo "postgres-shards result: $SHARD_RESULT"
          test "$SHARD_RESULT" = success
