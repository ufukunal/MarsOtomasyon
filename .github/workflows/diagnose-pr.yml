name: Production Transport Prepare

on:
  push:
    branches:
      - ops/prod-probe-20260913

permissions:
  contents: read

jobs:
  prepare:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 5
    steps:
      - name: Generate ephemeral transport key
        shell: bash
        run: |
          set -euo pipefail
          key=/tmp/mars-prod-transport-20260913.pem
          umask 077
          rm -f "$key"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$key" >/dev/null 2>&1
          chmod 600 "$key"
          echo 'PUBLIC_KEY_BEGIN'
          openssl pkey -in "$key" -pubout
          echo 'PUBLIC_KEY_END'
