name: Production Release Prepare Verify

on:
  push:
    branches:
      - ops/prod-probe-20260913

permissions:
  contents: read

jobs:
  verify_prepare:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify production release preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          key=/tmp/mars-prod-transport-20260913.pem
          pass=/tmp/mars-prod-pass-20260913
          cipher=/tmp/mars-prod-pass-20260913.bin
          askpass=/tmp/mars-prod-askpass-20260913
          known=/tmp/mars-prod-known-hosts-20260913
          cleanup() { rm -f "$pass" "$cipher" "$askpass" "$known"; }
          trap cleanup EXIT
          test -s "$key"
          base64 -d .ops/prod-pass.enc > "$cipher"
          openssl pkeyutl -decrypt -inkey "$key" -in "$cipher" -out "$pass" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$pass"
          secret="$(cat "$pass")"; echo "::add-mask::$secret"; unset secret
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          cat /tmp/mars-prod-pass-20260913
          EOF
          chmod 700 "$askpass"
          ssh-keyscan -T 5 -t ed25519 mars-prod.taila20365.ts.net > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:HBjgtjY+qIJiw00Cf7uzej/UIKWANYIjVe0VSz6Uh2I'
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid ssh -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 ufuk@mars-prod.taila20365.ts.net 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/marsotomasyon
          RELEASE=6e5a91b74f1bac3fede949f8479b17367e04c71c
          TAG=release-${RELEASE:0:12}
          REL="$ROOT/.mars-releases/$RELEASE"
          echo "REL_EXISTS=$(test -d "$REL" && echo yes || echo no)"
          if test -d "$REL"; then echo "REL_SHA=$(git -C "$REL" rev-parse HEAD)"; fi
          if docker image inspect "marsotomasyon-app:$TAG" >/dev/null 2>&1; then echo "APP_IMAGE_PRESENT=yes"; else echo "APP_IMAGE_PRESENT=no"; fi
          if docker image inspect "marsotomasyon-web:$TAG" >/dev/null 2>&1; then echo "WEB_IMAGE_PRESENT=yes"; else echo "WEB_IMAGE_PRESENT=no"; fi
          echo "ROOT_SHA=$(git -C "$ROOT" rev-parse HEAD)"
          echo 'OPS_BEGIN'
          docker compose --env-file "$ROOT/.env.production" -f "$ROOT/docker-compose.production.yml" exec -T app php artisan mars:ops-status
          echo 'OPS_END'
          REMOTE
