name: M22 Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint and remove helper
        run: |
          vendor/bin/pint
          rm .github/workflows/m22-format-diagnostic.yml
      - name: Commit exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(m22): apply exact Pint formatting"
          git push origin HEAD:${{ github.head_ref }}
