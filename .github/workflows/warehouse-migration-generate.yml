name: WAREHOUSE-IMP-001 Migration Generate
# WAREHOUSE-IMP-001 migration is committed; retained as manual/read-only evidence tooling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-warehouse-authority-migration
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore -m:1

      - name: Verify committed WAREHOUSE-IMP-001 migration/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_DIR="src/Mars.Infrastructure/Persistence/Migrations/Warehouse"
          MIG_FILE="$MIG_DIR/20260924220511_WarehouseImp001ExecutionInventoryControlAuthority.cs"

          test -f "$MIG_FILE"
          test -f "$MIG_DIR/20260924220511_WarehouseImp001ExecutionInventoryControlAuthority.Designer.cs"

          for table in operations disposition_effects pick_works packages package_items stage_load_works stage_load_packages transfers transfer_lines transfer_effect_links stock_count_sessions stock_count_scopes stock_count_lines stock_count_observations stock_count_effect_links scrap_requests offline_operations; do
            grep -F "name: \"$table\"" "$MIG_FILE"
          done

          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
