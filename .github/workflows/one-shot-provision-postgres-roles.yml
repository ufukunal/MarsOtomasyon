name: One-shot PostgreSQL Role Provisioning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-provision-postgres-roles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Provision PostgreSQL roles on test server
        shell: bash
        run: |
          set -euo pipefail

          SSH_HOST="$(awk -F'`' '/^- Adres:/ {print $2; exit}' config/test/test-server.md)"
          SSH_USER="$(awk -F'`' '/^- Kullanıcı:/ {print $2; exit}' config/test/test-server.md)"
          SSH_PASS="$(awk -F'`' '/^- Şifre:/ {print $2; exit}' config/test/test-server.md)"

          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PASS"

          MASTER_PW="$(openssl rand -hex 24)"
          APP_PW="$(openssl rand -hex 24)"

          ASKPASS="$(mktemp)"
          cleanup() { rm -f "$ASKPASS"; }
          trap cleanup EXIT

          cat > "$ASKPASS" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$MARS_SSH_PASSWORD"
          EOF
          chmod 700 "$ASKPASS"
          export MARS_SSH_PASSWORD="$SSH_PASS"
          export SSH_ASKPASS="$ASKPASS"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          {
            printf 'MASTER_PW=%q\n' "$MASTER_PW"
            printf 'APP_PW=%q\n' "$APP_PW"
            cat <<'REMOTE'
          set -euo pipefail

          PG_CONTAINER="marsotomasyon-postgres-1"
          docker inspect "$PG_CONTAINER" >/dev/null

          PG_USER="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$PG_CONTAINER" | sed -n 's/^POSTGRES_USER=//p' | head -1)"
          PG_DB="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$PG_CONTAINER" | sed -n 's/^POSTGRES_DB=//p' | head -1)"
          PG_USER="${PG_USER:-postgres}"
          PG_DB="${PG_DB:-$PG_USER}"

          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$PG_USER" -d "$PG_DB" <<SQL
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mars_master') THEN
              CREATE ROLE mars_master LOGIN SUPERUSER PASSWORD '$MASTER_PW';
            ELSE
              ALTER ROLE mars_master WITH LOGIN SUPERUSER PASSWORD '$MASTER_PW';
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mars_app') THEN
              CREATE ROLE mars_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$APP_PW';
            ELSE
              ALTER ROLE mars_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$APP_PW';
            END IF;
          END
          \$\$;
          SQL

          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$PG_USER" -d "$PG_DB" -v db_name="$PG_DB" <<'SQL'
          SELECT format('GRANT CONNECT ON DATABASE %I TO mars_app', :'db_name') \gexec
          GRANT USAGE ON SCHEMA public TO mars_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mars_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO mars_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE mars_master IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mars_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE mars_master IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO mars_app;
          SQL

          CREDS_DIR="$HOME/.marsotomasyon"
          CREDS_FILE="$CREDS_DIR/postgresql-roles.env"
          install -d -m 700 "$CREDS_DIR"
          umask 077
          cat > "$CREDS_FILE" <<EOF
          MARS_PG_DATABASE=$PG_DB
          MARS_PG_MASTER_USER=mars_master
          MARS_PG_MASTER_PASSWORD=$MASTER_PW
          MARS_PG_APP_USER=mars_app
          MARS_PG_APP_PASSWORD=$APP_PW
          EOF
          chmod 600 "$CREDS_FILE"

          docker exec -e PGPASSWORD="$MASTER_PW" "$PG_CONTAINER"             psql -h 127.0.0.1 -U mars_master -d "$PG_DB" -Atqc "select current_user"             | grep -qx mars_master

          docker exec -e PGPASSWORD="$APP_PW" "$PG_CONTAINER"             psql -h 127.0.0.1 -U mars_app -d "$PG_DB" -Atqc "select current_user"             | grep -qx mars_app

          docker exec -i "$PG_CONTAINER" psql -U "$PG_USER" -d "$PG_DB" -P pager=off -c             "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolreplication FROM pg_roles WHERE rolname IN ('mars_master','mars_app') ORDER BY rolname;"

          printf 'Credentials stored on test server at: %s\n' "$CREDS_FILE"
          REMOTE
          } | setsid -w ssh               -o BatchMode=no               -o StrictHostKeyChecking=accept-new               -o PreferredAuthentications=password,keyboard-interactive               -o PubkeyAuthentication=no               "$SSH_USER@$SSH_HOST" 'bash -s'
