name: Pint M95 Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pint-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/m9-5-purchase-return
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint and remove temporary workflow
        run: |
          vendor/bin/pint app/Modules/PurchaseReturns/Actions/FinalizePurchaseReturn.php app/Modules/PurchaseReturns/PurchaseReturnController.php tests/Integration/PurchaseReturns/PurchaseReturnTest.php
          rm .github/workflows/pint-m95-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Modules/PurchaseReturns/Actions/FinalizePurchaseReturn.php app/Modules/PurchaseReturns/PurchaseReturnController.php tests/Integration/PurchaseReturns/PurchaseReturnTest.php .github/workflows/pint-m95-debug.yml
          git commit -m "style(m9.5): apply Pint"
          git push origin HEAD:feat/m9-5-purchase-return
