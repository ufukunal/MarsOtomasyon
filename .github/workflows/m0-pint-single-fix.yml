name: M0 Pint Single Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-pint-single-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format RequestFingerprint
        run: ./vendor/bin/pint app/Foundation/Idempotency/RequestFingerprint.php

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Foundation/Idempotency/RequestFingerprint.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format RequestFingerprint [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
