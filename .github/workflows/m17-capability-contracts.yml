name: M17 Capability Contracts
# rerun after adapting guarded routes

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-capability-contracts.yml'

permissions:
  contents: write

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare guarded patch and milestone evidence
        run: python3 .github/scripts/m17_capability_prep.py
      - name: Apply capability patch
        run: python3 .github/scripts/m17_capability_patch.py
      - name: Format
        run: vendor/bin/pint app/Modules/Operations/ChannelService.php app/Modules/Operations/ChannelEventStore.php app/Modules/Operations/ProviderRateLimitException.php app/Modules/Operations/Jobs/ProcessIntegrationSync.php app/Modules/Commerce routes/operations.php tests/Integration/Commerce/M17CommerceTest.php
      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force
      - name: Targeted regression
        run: vendor/bin/pest tests/Integration/Commerce/M17CommerceTest.php tests/Integration/Operations/M11OperationsTest.php tests/Integration/Operations/M11TrendyolDomainSyncTest.php --colors=never
      - name: Static analysis
        run: vendor/bin/phpstan analyse app/Modules/Commerce app/Modules/Operations/ChannelService.php app/Modules/Operations/ChannelEventStore.php app/Modules/Operations/ProviderRateLimitException.php app/Modules/Operations/Jobs/ProcessIntegrationSync.php app/Modules/Operations/ChannelDomainSync.php --no-progress
      - name: Commit and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/m17-capability-contracts.yml
          rm -f .github/scripts/m17_capability_patch.py
          rm -f .github/scripts/m17_capability_prep.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(m17): complete channel capability contracts"
          git push origin HEAD:feat/m17-commerce
