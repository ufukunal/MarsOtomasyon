pany_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_error_at' => now(),\n                    'last_error' => $message,\n                    'updated_at' => now(),\n                ]);\n        } catch (\\Throwable $exception) {\n"""
