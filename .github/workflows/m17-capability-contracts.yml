          s = s.replace(old, new, 1)
          old = """            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_error_at' => now(),\n                    'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                    'updated_at' => now(),\n                ]);\n            throw $exception;\n"""
          new = """            DB::table('channel_invoice_syncs')->where('sync_effect_id', $effectId)->update([\n                'status' => 'failed',\n                'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                'updated_at' => now(),\n            ]);\n            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_error_at' => now(),\n                    'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                    'updated_at' => now(),\n                ]);\n            throw $exception;\n"""
          if old not in s:
              raise SystemExit('failure pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Job: honor rate-limit Retry-After instead of consuming framework retry immediately.
