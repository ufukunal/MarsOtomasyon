          old = """            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_sync_at' => now(),\n                    'last_success_at' => now(),\n                    'last_error' => null,\n                    'updated_at' => now(),\n                ]);\n        } catch (\\Throwable $exception) {\n"""
