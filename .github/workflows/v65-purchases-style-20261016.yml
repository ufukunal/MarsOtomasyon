name: V65 purchases one-shot Pint 20261016
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v65-purchases-style-20261016.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BACKUP_NOTIFICATION_EMAIL: ci-only@invalid.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, gd, zip, pdo_pgsql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format changed purchase workflows and tests
        run: |
          vendor/bin/pint app/Actions/Purchases/ConvertPurchaseQuoteToOrder.php app/Actions/Purchases/CreatePurchaseDispatchFromOrder.php app/Actions/Purchases/ConfirmPurchaseDispatch.php app/Actions/Purchases/PurchaseLineAvailability.php app/Actions/Purchases/CreateGoodsReceiptFromOrder.php app/Actions/Purchases/CreateGoodsReceiptFromPurchaseDispatch.php tests/Unit/UI/PurchaseQuoteSourceContractTest.php tests/Unit/UI/PurchaseDispatchSourceContractTest.php
      - name: Commit source formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.php'
          if git diff --cached --quiet; then
            echo 'PINT=UNCHANGED'
            exit 0
          fi
          git commit -m 'style(purchases): Pint format quote and dispatch fixes'
          git push origin HEAD:main
          echo 'PINT=PUSHED'
