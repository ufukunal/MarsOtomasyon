name: M18 TY Diagnostic

on:
  push:
    branches: [diag/m18-ty-postgres]

permissions:
  contents: read

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  postgres-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force
      - name: Commerce integration
        continue-on-error: true
        run: php artisan test tests/Integration/Commerce
      - name: Operations integration
        continue-on-error: true
        run: php artisan test tests/Integration/Operations
      - name: Unit and feature
        continue-on-error: true
        run: php artisan test tests/Unit tests/Feature
      - name: Remaining integration
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t paths < <(find tests/Integration -mindepth 1 -maxdepth 1 \( -type d -o -type f -name '*.php' \) ! -name Commerce ! -name Operations | sort)
          php artisan test "${paths[@]}"
