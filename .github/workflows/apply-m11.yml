name: Apply M11 payload

on:
  push:
    branches:
      - feat/m11-complete
    paths:
      - 'tools/m11-payload-*.b64'
      - '.github/workflows/apply-m11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m11-complete
          fetch-depth: 0
      - name: Expand M11 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/m11-payload-*.b64 | base64 -d > /tmp/m11-payload.tgz
          tar -xzf /tmp/m11-payload.tgz -C .
          rm -f tools/m11-payload-*.b64 .github/workflows/apply-m11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'M11: integration and advanced operations foundation'
          git push origin HEAD:feat/m11-complete
