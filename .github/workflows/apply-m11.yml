name: Apply M11 payload

on:
  push:
    branches:
      - feat/m11-complete
    paths:
      - 'tools/m11-migration.b64'
      - '.github/workflows/apply-m11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m11-complete
          fetch-depth: 0
      - name: Expand M11 migration
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/m11-migration.b64 > /tmp/m11-fix.tgz
          tar -xzf /tmp/m11-fix.tgz -C .
          rm -f tools/m11-migration.b64 .github/workflows/apply-m11.yml .github/workflows/apply-m11-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add M11 operations schema and tenant keys'
          git push origin HEAD:feat/m11-complete
