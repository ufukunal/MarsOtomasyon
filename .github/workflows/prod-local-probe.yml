name: Production SSH Probe

on:
  push:
    branches:
      - ops/prod-local-deploy-20260913

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 5
    steps:
      - name: Probe direct production SSH access
        shell: bash
        run: |
          set -Eeuo pipefail
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 5 -t ed25519 mars-prod.taila20365.ts.net > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:HBjgtjY+qIJiw00Cf7uzej/UIKWANYIjVe0VSz6Uh2I'
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes ufuk@mars-prod.taila20365.ts.net 'hostname; test -d /opt/marsotomasyon && echo PROD_ROOT=present; git -C /opt/marsotomasyon rev-parse HEAD; docker ps --format "{{.Names}}|{{.Image}}|{{.Status}}"'
