name: M17 Stale Guard

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-stale-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Enforce stale guard and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Modules/Operations/ChannelService.php')
          s = p.read_text()
          old = """            if (! in_array((string) $effect->status, ['queued', 'failed'], true)) {\n                throw new DomainException('Integration sync cannot execute from current status.');\n            }\n            DB::table('integration_sync_effects')->where('id', $effectId)->update([\n"""
          new = """            if (! in_array((string) $effect->status, ['queued', 'failed'], true)) {\n                throw new DomainException('Integration sync cannot execute from current status.');\n            }\n            if ((string) ($effect->guard_type ?? '') === 'listing_state' && $effect->guard_id !== null && $effect->guard_version !== null) {\n                $state = DB::table('channel_listing_states')->where('id', (int) $effect->guard_id)->lockForUpdate()->first(['id', 'desired_version']);\n                if ($state === null || (int) $state->desired_version !== (int) $effect->guard_version) {\n                    DB::table('integration_sync_effects')->where('id', $effectId)->update([\n                        'status' => 'ignored',\n                        'completed_at' => now(),\n                        'ignored_reason' => 'stale desired-state version',\n                        'last_error' => null,\n                        'updated_at' => now(),\n                    ]);\n\n                    return null;\n                }\n            }\n            DB::table('integration_sync_effects')->where('id', $effectId)->update([\n"""
          if old not in s:
              raise SystemExit('processSync guard insertion pattern not found')
          s = s.replace(old, new, 1)

          old = """            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_sync_at' => now(),\n                    'last_success_at' => now(),\n                    'last_error' => null,\n                    'updated_at' => now(),\n                ]);\n        } catch (\\Throwable $exception) {\n"""
          new = """            if ((string) ($effect->guard_type ?? '') === 'listing_state' && $effect->guard_id !== null && $effect->guard_version !== null) {\n                $state = DB::table('channel_listing_states')\n                    ->where('id', (int) $effect->guard_id)\n                    ->where('desired_version', (int) $effect->guard_version)\n                    ->first(['desired_stock', 'desired_price', 'desired_currency_code', 'desired_media']);\n                if ($state !== null) {\n                    DB::table('channel_listing_states')->where('id', (int) $effect->guard_id)->update([\n                        'published_version' => (int) $effect->guard_version,\n                        'published_stock' => $state->desired_stock,\n                        'published_price' => $state->desired_price,\n                        'published_currency_code' => $state->desired_currency_code,\n                        'published_media' => $state->desired_media,\n                        'status' => 'synced',\n                        'last_error' => null,\n                        'updated_at' => now(),\n                    ]);\n                }\n            }\n            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_sync_at' => now(),\n                    'last_success_at' => now(),\n                    'last_error' => null,\n                    'updated_at' => now(),\n                ]);\n        } catch (\\Throwable $exception) {\n"""
          if old not in s:
              raise SystemExit('processSync success insertion pattern not found')
          s = s.replace(old, new, 1)

          old = """            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_error_at' => now(),\n                    'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                    'updated_at' => now(),\n                ]);\n            throw $exception;\n"""
          new = """            if ((string) ($effect->guard_type ?? '') === 'listing_state' && $effect->guard_id !== null && $effect->guard_version !== null) {\n                DB::table('channel_listing_states')\n                    ->where('id', (int) $effect->guard_id)\n                    ->where('desired_version', (int) $effect->guard_version)\n                    ->update([\n                        'status' => 'failed',\n                        'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                        'updated_at' => now(),\n                    ]);\n            }\n            DB::table('integration_connections')\n                ->where('company_id', $effect->company_id)\n                ->where('id', $effect->connection_id)\n                ->update([\n                    'last_error_at' => now(),\n                    'last_error' => mb_substr($exception->getMessage(), 0, 4000),\n                    'updated_at' => now(),\n                ]);\n            throw $exception;\n"""
          if old not in s:
              raise SystemExit('processSync failure insertion pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          vendor/bin/pint app/Modules/Operations/ChannelService.php
          vendor/bin/phpstan analyse app/Modules/Operations/ChannelService.php app/Modules/Commerce --no-progress
          rm -f .github/workflows/m17-stale-guard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(m17): ignore stale listing publishes"
          git push origin HEAD:feat/m17-commerce
