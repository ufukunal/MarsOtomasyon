name: M16 Docs Lock

on:
  push:
    branches: [feat/m16-import-container]
    paths: [.github/workflows/m16-docs-lock.yml]

permissions:
  contents: write

jobs:
  docs-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock A-17 and reconcile completed milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path

          decision = Path('plan/00_KARAR_KAYDI.md')
          s = decision.read_text()
          anchor = '\n## B. YAPILMAYACAKLAR\n'
          block = '''\n### K-052 — İthalat landed-cost posting authority\nM16 ithalat landed-cost politikası mevcut stok/maliyet authority'sini yeniden kullanır.\n- `provisional` ithalat masrafı analiz/evidence kaydıdır; carrying value'yu değiştirmez.\n- Carrying value etkisi yalnız ilgili ithalat kalemi kesinleşmiş `GoodsReceiptLine` ile reconcile edildikten ve masraf `final` olduktan sonra post edilir.\n- Geç gelen kesin masraf önceki kayıtları UPDATE etmez; yeni append-only landed-cost batch / Goods Receipt cost adjustment olarak eklenir.\n- Maliyet farkının elde kalan miktara düşen payı `stock_balances.inventory_value` ve moving weighted average maliyete gider; tüketilmiş miktara düşen pay `consumed_cost_delta` olarak ayrılır.\n- Varsayılan dağıtım temeli `line_value`; explicit ihtiyaçta `quantity` kullanılabilir. Son satır deterministik rounding residual'ını taşır.\n- M16 V1 cost posting aynı para birimindedir; FX landed-cost politikası ayrıca kilitlenmeden tahmin edilmez.\n- Landed-cost ikinci fiziksel `stock_movement` üretmez ve ayrı stok/maliyet motoru kurmaz; authority `ApplyGoodsReceiptCostAdjustment` üzerinden devam eder.\n\n'''
          if '### K-052 — İthalat landed-cost posting authority' not in s:
              if anchor not in s:
                  raise SystemExit('decision anchor missing')
              s = s.replace(anchor, block + anchor, 1)
          decision.write_text(s)

          open_decisions = Path('plan/19_ACIK_KARARLAR.md')
          s = open_decisions.read_text()
          locked_anchor = '- M0 execution order: `29_M0_ALTYAPI_UYGULAMA_SIRASI.md` içindeki M0.0→M0.10 gate zinciri.\n'
          locked_line = '- İthalat landed-cost: K-052; provisional masraf carrying value üretmez, final/late cost Goods Receipt cost-adjustment authority ile on-hand/consumed ayrılır; default `line_value`.\n'
          if locked_line not in s:
              if locked_anchor not in s:
                  raise SystemExit('locked anchor missing')
              s = s.replace(locked_anchor, locked_anchor + locked_line, 1)
          section = '''### A-17 — İthalat landed-cost posting policy\nM16 İthalat **cost posting slice** başlamadan:\n- landed cost'un carrying value'ya hangi anda geçtiği\n- provisional vs late cost\n- consumed/on-hand ayrımı\n- allocation basis default'u\nkilitlenecek.\n\n'''
          if section in s:
              s = s.replace(section, '', 1)
          old_row = '| M16 | A-17 cost posting slice öncesi zorunlu |'
          new_row = '| M16 | K-052 landed-cost posting policy locked; açık blocker yok |'
          if old_row in s:
              s = s.replace(old_row, new_row, 1)
          elif new_row not in s:
              raise SystemExit('M16 gate row missing')
          open_decisions.write_text(s)

          matrix = Path('plan/21_MILESTONE_DURUM_MATRISI.md')
          s = matrix.read_text()
          replacements = {
              "| M11 | Çek / Senet | **PENDING** | K-025/K-026 business contract ve treasury payment-method seam'i mevcut | Instrument custody/lifecycle, ciro, settlement/reversal, files/UI/RBAC/DB invariants/tests tamamlanmalı |": "| M11 | Çek / Senet | **DONE** | PR #72; received/issued cheque/senet, custody/ciro, delivery-time cari effect, bank settlement, reversal, files/UI/RBAC/PostgreSQL acceptance; merge `b3d71e0665f76028a6ccb36b5ef0551415427fd1` | V1 milestone gap yok |",
              "| M14 | Basit Üretim | **PENDING** | K-019 contract ve mevcut stock/cost authority yeniden kullanılabilir | Reçete → üretim emri → material issue → mamul receipt → complete vertical slice + raporlar |": "| M14 | Basit Üretim | **DONE** | PR #73; reçete → üretim emri → material issue/fire → mamul receipt → complete, technical file + report; merge `f3b30c059e2294ba2f542ff479cde142725e04b4`; main Foundation run `33287261767` 4/4 | V1 milestone gap yok |",
              "| M15 | Fason | **PENDING** | K-020/K-048 custody contract mevcut | Sent material/subcontract custody/finished goods/fire/remaining/complete vertical slice + raporlar |": "| M15 | Fason | **DONE** | PR #74; physical OUT → subcontract custody quantity/carrying value → fire/partial finished-goods IN → reconcile/complete + files/report; merge `57173a2678c8a44ae38fd7df7c73e062f9caba41`; main Foundation run `33288273051` 4/4 | V1 milestone gap yok |",
              "| M16 | İthalat / Konteyner | **PENDING** | M9 landed-cost primitives yeniden kullanılabilir | A-17 kapanışı + import file/shipment/container/mapping/handoff/cost analysis/reports |": "| M16 | İthalat / Konteyner | **PENDING** | K-052 locked; feature branch PostgreSQL acceptance: file/container/package/component/location, finalized GoodsReceipt handoff, landed-cost allocation/posting, reports/lists/simulator | PR merge + exact final `main` Foundation 4/4 doğrulaması |",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit('matrix row missing: ' + old[:30])
          start = s.index('## Bir sonraki uygulama sırası')
          end = s.index('## Reconciliation kuralı')
          order = '''## Bir sonraki uygulama sırası\n\n1. **M16 İthalat/Konteyner** — K-052 kilitli; vertical slice merge + exact main gate kapatılır.\n2. **M17 E-Ticaret Core + WooCommerce** — A-04 public ID strategy önce kilitlenir.\n3. **M18 adapter pack** — yalnız gerçek provider contract/fixture doğrulanan adapterlar.\n4. **M19 B2B**.\n5. **M20 Communication / API**.\n6. **M21 Product Image Operations**.\n7. **M22 Installation PDF Builder**.\n8. **M23 Production Candidate hardening**.\n9. **M24 Migration / Go-Live**.\n\n'''
          s = s[:start] + order + s[end:]
          matrix.write_text(s)
          PY
      - name: Commit documentation and remove workflow
        run: |
          git rm .github/workflows/m16-docs-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plan/00_KARAR_KAYDI.md plan/19_ACIK_KARARLAR.md plan/21_MILESTONE_DURUM_MATRISI.md
          git commit -m "docs(m16): lock landed-cost policy and reconcile milestones"
          git push origin HEAD:feat/m16-import-container
