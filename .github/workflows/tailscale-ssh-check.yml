name: Tailscale SSH Direct Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tailscale-ssh-check.yml"

permissions:
  contents: read

jobs:
  tailscale-ssh-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Direct Tailscale SSH check with ephemeral known_hosts
        shell: bash
        run: |
          set +e
          echo "RUNNER_HOST=$(hostname)"
          tailscale ping --timeout=5s mars-prod.taila20365.ts.net
          TMPHOME="$RUNNER_TEMP/ts-ssh-home"
          mkdir -p "$TMPHOME/.ssh"
          chmod 700 "$TMPHOME/.ssh"
          ssh-keyscan -T 5 -H mars-prod.taila20365.ts.net > "$TMPHOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$TMPHOME/.ssh/known_hosts"
          if [ -s "$TMPHOME/.ssh/known_hosts" ]; then
            echo "HOST_KEY_SCAN=PASS"
          else
            echo "HOST_KEY_SCAN=FAIL"
          fi
          HOME="$TMPHOME" tailscale ssh ufuk@mars-prod 'echo TS_SSH_AUTH=PASS; printf "REMOTE_USER="; whoami; printf "REMOTE_HOST="; hostname; printf "REMOTE_KERNEL="; uname -a; test -d /opt/marsotomasyon && echo REPO_PATH=PASS || echo REPO_PATH=FAIL'
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "TS_SSH_AUTH=FAIL"
          fi
          rm -rf "$TMPHOME"
          exit 0
