name: M16 Acceptance Probe

on:
  push:
    branches: [feat/m16-import-container]
    paths: [.github/workflows/m16-acceptance-probe.yml]

permissions:
  contents: write

jobs:
  m16-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_NAME: MarsOtomasyon
      APP_ENV: testing
      APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mars_test
      DB_USERNAME: mars
      DB_PASSWORD: mars
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: session
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PREFIX: 'mars-m16:'
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      REDIS_QUEUE_DB: 2
      REDIS_SESSION_DB: 3
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Apply acceptance hardening fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ['routes/imports.php', 'routes/subcontract.php']:
              p = Path(name)
              s = p.read_text()
              s = s.replace("middleware(['auth', 'company.context'])", "middleware(['web', 'auth', 'company.context'])")
              p.write_text(s)

          p = Path('routes/production.php')
          s = p.read_text().replace("->middleware(['auth', 'company.context'])", "->middleware(['web', 'auth', 'company.context'])")
          p.write_text(s)

          p = Path('tests/Integration/Imports/M16ImportLifecycleTest.php')
          s = p.read_text()
          if 'use App\\Foundation\\Correlation\\CorrelationContext;' not in s:
              s = s.replace('<?php\n\n', '<?php\n\nuse App\\Foundation\\Correlation\\CorrelationContext;\n')
          s = s.replace("beforeEach(function (): void {\n    $this->withoutVite();\n});", "beforeEach(function (): void {\n    $this->withoutVite();\n    app(CorrelationContext::class)->set('m16-acceptance');\n});")
          p.write_text(s)

          p = Path('database/migrations/2026_08_30_050000_create_m16_imports.php')
          s = p.read_text()
          old = "        DB::table('permissions')->whereIn('key', ['imports.view', 'imports.manage'])->delete();"
          new = "        $permissionIds = DB::table('permissions')->whereIn('key', ['imports.view', 'imports.manage'])->pluck('id');\n        DB::table('role_permissions')->whereIn('permission_id', $permissionIds)->delete();\n        DB::table('permissions')->whereIn('id', $permissionIds)->delete();"
          if old not in s:
              raise SystemExit('permission rollback anchor not found')
          p.write_text(s.replace(old, new))
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format M16 vertical slice
        run: vendor/bin/pint --parallel app/Modules/Imports app/Modules/Core/Enums/PermissionKey.php app/Modules/Core/Shell/AppNavigation.php bootstrap/app.php config/mars.php routes/imports.php routes/production.php routes/subcontract.php database/migrations/2026_08_30_050000_create_m16_imports.php tests/Integration/Imports/M16ImportLifecycleTest.php
      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force
      - name: M16 acceptance tests
        run: php artisan test tests/Integration/Imports/M16ImportLifecycleTest.php
      - name: Static analysis
        run: vendor/bin/phpstan analyse app/Modules/Imports tests/Integration/Imports/M16ImportLifecycleTest.php --no-progress
      - name: Commit verified formatting and remove probe
        if: success()
        run: |
          git rm .github/workflows/m16-acceptance-probe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Modules/Imports app/Modules/Core/Enums/PermissionKey.php app/Modules/Core/Shell/AppNavigation.php bootstrap/app.php config/mars.php routes/imports.php routes/production.php routes/subcontract.php database/migrations/2026_08_30_050000_create_m16_imports.php tests/Integration/Imports/M16ImportLifecycleTest.php
          git commit -m "test(m16): verify import vertical slice"
          git push origin HEAD:feat/m16-import-container
