name: M17 Commerce Acceptance Fix 2

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-acceptance-fix-2.yml'

permissions:
  contents: write

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Add audit actor and correlation to acceptance harness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/Integration/Commerce/M17CommerceTest.php')
          s = p.read_text()
          old = "use App\\Modules\\Accounts\\Enums\\AccountStatus;"
          new = "use App\\Foundation\\Correlation\\CorrelationContext;\nuse App\\Foundation\\Correlation\\CorrelationIdFactory;\nuse App\\Modules\\Accounts\\Enums\\AccountStatus;"
          if old not in s:
              raise SystemExit('foundation import pattern not found')
          s = s.replace(old, new, 1)
          old = "use Illuminate\\Support\\Facades\\Crypt;\nuse Illuminate\\Support\\Facades\\DB;"
          new = "use Illuminate\\Support\\Facades\\Auth;\nuse Illuminate\\Support\\Facades\\Crypt;\nuse Illuminate\\Support\\Facades\\DB;"
          if old not in s:
              raise SystemExit('facade import pattern not found')
          s = s.replace(old, new, 1)
          old = """    [$company, $customer, $clearing, $product, $warehouse, $location] = m17Fixture();\n    app(ActiveCompanyContext::class)->set($company);\n\n    $commerce = app(ChannelCenterService::class);\n"""
          new = """    [$company, $customer, $clearing, $product, $warehouse, $location] = m17Fixture();\n    app(ActiveCompanyContext::class)->set($company);\n    $actorId = (int) DB::table('users')->insertGetId([\n        'name' => 'M17 Acceptance Actor',\n        'email' => 'm17-acceptance@example.test',\n        'password' => 'not-used',\n        'status' => 'active',\n        'created_at' => now(),\n        'updated_at' => now(),\n    ]);\n    Auth::loginUsingId($actorId);\n    app(CorrelationContext::class)->set(app(CorrelationIdFactory::class)->resolve(null));\n\n    $commerce = app(ChannelCenterService::class);\n"""
          if old not in s:
              raise SystemExit('acceptance setup pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          vendor/bin/pint tests/Integration/Commerce/M17CommerceTest.php
      - run: php artisan migrate:fresh --force
      - name: Run vertical acceptance
        run: vendor/bin/pest tests/Integration/Commerce/M17CommerceTest.php --colors=never
      - name: Static analysis
        run: vendor/bin/phpstan analyse app/Modules/Commerce app/Modules/Operations/ChannelDomainSync.php app/Modules/Operations/ChannelService.php --no-progress
      - name: Commit harness fix and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/m17-acceptance.yml .github/workflows/m17-acceptance-fix.yml .github/workflows/m17-acceptance-fix-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(m17): initialize acceptance audit context"
          git push origin HEAD:feat/m17-commerce
