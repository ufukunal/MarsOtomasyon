name: Pint Fix M9 M11

on:
  push:
    branches:
      - fix/m9-m11-finalize

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m9-m11-finalize
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint
      - name: Commit formatted files and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pint-fix-m9-m11.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Pint to M9 M11 finalization"
          git push origin HEAD:fix/m9-m11-finalize
