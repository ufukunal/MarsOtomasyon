name: Quality - 4 Self Hosted Runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-local-v11
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: "false"
  DB_CONNECTION: master
  DB_HOST: 127.0.0.1
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  XDEBUG_MODE: coverage

jobs:
  prepare-host:
    name: "Prepare local Ubuntu host"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare portable PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh ensure

      - name: Host toolchain summary
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.5 -v 2>/dev/null || php8.4 -v 2>/dev/null || php -v
          composer --version
          node --version
          npm --version
          psql --version
          echo "=== Coverage/build toolchain ==="
          for candidate in php8.5 php8.4 php; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "--- $candidate ---"
              "$candidate" -m 2>/dev/null | grep -E '^(pcov|xdebug)$' || true
            fi
          done
          command -v phpize8.5 || command -v phpize8.4 || command -v phpize || true
          command -v php-config8.5 || command -v php-config8.4 || command -v php-config || true
          command -v pecl || true
          command -v gcc || command -v cc || true
          command -v make || true

  foundation:
    needs: prepare-host
    name: "R1 - Unit + Foundation Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
      MARS_PG_PORT: "55431"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Unit tests
        run: vendor/bin/pest tests/Unit --display-warnings

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55431 "$DB_MASTER_DATABASE"

      - name: Foundation feature tests
        run: |
          vendor/bin/pest \
            tests/Feature/Attachments \
            tests/Feature/Companies \
            tests/Feature/Concurrency \
            tests/Feature/Contacts \
            tests/Feature/Contracts \
            tests/Feature/Import \
            tests/Feature/Locations \
            tests/Feature/Period \
            tests/Feature/Pricing \
            --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55431

  domain:
    needs: prepare-host
    name: "R2 - Domain Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r2]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R2
      MARS_PG_PORT: "55432"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55432 "$DB_MASTER_DATABASE"

      - name: Domain feature tests
        run: |
          vendor/bin/pest \
            tests/Feature/Channels \
            tests/Feature/Printing \
            tests/Feature/Products \
            tests/Feature/Sales \
            tests/Feature/Security \
            tests/Feature/Stock \
            tests/Feature/Units \
            --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55432

  manual-audit:
    needs: prepare-host
    name: "R3 - ManualAudit 273"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R3
      MARS_PG_PORT: "55433"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55433 "$DB_MASTER_DATABASE"

      - name: Manual integrity quality security suite
        run: vendor/bin/pest tests/ManualAudit --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55433

  quality:
    needs: prepare-host
    name: "R4 - Pint + Larastan + Build + Stock Coverage"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R4
      MARS_PG_PORT: "55444"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Verify Node toolchain
        shell: bash
        run: |
          node --version
          npm --version

      - name: Node install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Prepare local Xdebug coverage driver
        shell: bash
        run: |
          set -Eeuo pipefail

          if php -m | grep -Eqi '^(pcov|xdebug)$'; then
            echo "Coverage driver already available."
            exit 0
          fi

          PHP_MM="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
          PHPIZE="$(command -v "phpize$PHP_MM" || command -v phpize)"
          PHP_CONFIG="$(command -v "php-config$PHP_MM" || command -v php-config)"

          BUILD_DIR="$RUNNER_TEMP/mars-xdebug-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          pecl download xdebug
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'xdebug-*.tgz' -print -quit)"
          test -n "$ARCHIVE"

          tar -xzf "$ARCHIVE" --strip-components=1
          "$PHPIZE"
          ./configure --with-php-config="$PHP_CONFIG"
          make -j"$(nproc)"

          XDEBUG_SO="$(find "$BUILD_DIR" -type f -path '*/modules/xdebug.so' -print -quit)"
          test -f "$XDEBUG_SO"

          echo "XDEBUG_EXTENSION=$XDEBUG_SO" >> "$GITHUB_ENV"
          php -d "zend_extension=$XDEBUG_SO" -d xdebug.mode=coverage -m | grep -qi '^xdebug$'

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55444 "$DB_MASTER_DATABASE"

      - name: Phase 2 stock coverage
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail

          STOCK_COVERAGE_TESTS=(
            tests/Feature/Stock/Faz2BranchCoverageTest.php
          )

          # R2 already executes the complete Stock feature suite, including
          # concurrency, integrity, schema isolation and stock-flow tests.
          # R4 only runs the dedicated branch-coverage suite under Xdebug.
          if php -m | grep -Eqi '^(pcov|xdebug)$'; then
            vendor/bin/pest -c phpunit.stock.xml "${STOCK_COVERAGE_TESTS[@]}" --coverage --min=90
          elif [[ -n "${XDEBUG_EXTENSION:-}" && -f "$XDEBUG_EXTENSION" ]]; then
            php -d "zend_extension=$XDEBUG_EXTENSION" -d xdebug.mode=coverage vendor/bin/pest -c phpunit.stock.xml "${STOCK_COVERAGE_TESTS[@]}" --coverage --min=90
          else
            echo "Coverage driver unavailable." >&2
            exit 1
          fi

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55444
