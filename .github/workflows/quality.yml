          "$PG_BINDIR/createdb" -h 127.0.0.1 -p "$MARS_PG_PORT" -U postgres "$DB_MASTER_DATABASE"
          echo "DB_PORT=$MARS_PG_PORT" >> "$GITHUB_ENV"
          echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=" >> "$GITHUB_ENV"
          echo "MARS_PG_BINDIR=$PG_BINDIR" >> "$GITHUB_ENV"
          echo "MARS_PGDATA=$PGDATA" >> "$GITHUB_ENV"

      - name: Phase 2 stock tests
        shell: bash
        run: |
          if php -m | grep -Eqi '^(pcov|xdebug)$'; then
            vendor/bin/pest -c phpunit.stock.xml --coverage --min=90
          else
            echo "Coverage driver unavailable; running the complete stock suite without coverage gate."
            vendor/bin/pest -c phpunit.stock.xml
          fi

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -n "${MARS_PG_BINDIR:-}" && -x "${MARS_PG_BINDIR}/pg_ctl" && -n "${MARS_PGDATA:-}" ]]; then
            "${MARS_PG_BINDIR}/pg_ctl" -D "${MARS_PGDATA}" -m fast stop >/dev/null 2>&1 || true
          fi
