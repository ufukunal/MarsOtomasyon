name: Quality - 4 Self Hosted Runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-main
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: "false"
  DB_CONNECTION: master
  DB_HOST: 127.0.0.1
  DB_USERNAME: ${{ secrets.MARS_TEST_DB_USERNAME || 'postgres' }}
  DB_PASSWORD: ${{ secrets.MARS_TEST_DB_PASSWORD || 'postgres' }}
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

jobs:
  foundation:
    name: "R1 - Unit + Foundation Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
      MARS_PG_CONTAINER: mars-pg-${{ github.run_id }}-r1
      MARS_PG_PORT: "55431"
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v php
          command -v composer
          php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);'
          php -m | grep -qi '^bcmath$'
          php -m | grep -qi '^pdo_pgsql$'
          php -v
          composer --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$MARS_PG_CONTAINER" -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p "127.0.0.1:${MARS_PG_PORT}:5432" postgres:16 >/dev/null
            echo "DB_PORT=$MARS_PG_PORT" >> "$GITHUB_ENV"
            echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV"
            for i in $(seq 1 60); do
              docker exec "$MARS_PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1 && exit 0
              sleep 1
            done
            docker logs "$MARS_PG_CONTAINER" || true
            exit 1
          fi

          command -v pg_isready
          command -v dropdb
          command -v createdb
          echo "DB_PORT=5432" >> "$GITHUB_ENV"
          PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p 5432 -U "$DB_USERNAME"
          PGPASSWORD="$DB_PASSWORD" dropdb --if-exists -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"

      - name: Unit tests
        run: vendor/bin/pest tests/Unit --display-warnings

      - name: Foundation feature tests
        run: |
          vendor/bin/pest             tests/Feature/Attachments             tests/Feature/Companies             tests/Feature/Concurrency             tests/Feature/Contacts             tests/Feature/Contracts             tests/Feature/Import             tests/Feature/Locations             tests/Feature/Period             tests/Feature/Pricing             --display-warnings

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
          fi

  domain:
    name: "R2 - Domain Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r2]
