name: Quality - Static Analysis and Frontend Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-quality:
    name: R4 - Static checks and frontend build
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 30
    env:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP 8.4+
        shell: bash
        run: bash scripts/ci/select-php.sh
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend build
        run: npm run build
      - name: Compile all Blade templates
        run: php artisan view:cache
      - name: Approved v65 UI contract checks
        run: bash scripts/ci/test-ui-v65-contract.sh
      - name: Approved v65 standalone HTML JavaScript syntax checks
        run: node scripts/ci/verify-v65-html.mjs
      - name: Pint style validation
        run: vendor/bin/pint --test
      - name: Larastan static analysis
        run: vendor/bin/phpstan analyse --no-progress
      - name: Release activation safety Unit tests
        run: vendor/bin/pest tests/Unit/Operations/ReleaseActivationGateTest.php
      - name: Approved v65 UI and authorized screen regression tests
        run: vendor/bin/pest tests/Unit/UI/ApprovedPrototypeV65ContractTest.php tests/Unit/UI/ApprovedV65StockIntegrationTest.php tests/Unit/UI/ProductDetailV65ScreenTest.php
      - name: Production release shell syntax checks
        run: bash -n ops/build-release-artifact.sh ops/deploy-release.sh scripts/ci/test-release-guards.sh
      - name: Production release tamper-rejection tests
        run: bash scripts/ci/test-release-guards.sh
      - name: UAT operator preview script syntax
        run: bash -n ops/uat-preview-start.sh
      - name: UAT shell syntax and isolation policy regressions
        run: |
          bash -n ops/uat-preflight.sh scripts/ci/test-uat-isolation-guards.sh
          bash scripts/ci/test-uat-isolation-guards.sh
