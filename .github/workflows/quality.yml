name: Quality

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: master
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_MASTER_DATABASE: MarsProject_Master_Test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, pdo_pgsql, mbstring, intl, fileinfo
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Normalize PHP and lock files
        id: normalize
        shell: bash
        run: |
          vendor/bin/pint

          if git diff --quiet -- composer.lock package-lock.json app bootstrap config database routes tests; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json app bootstrap config database routes tests
          git commit -m "style: Pint ve dependency lock dosyalarini sabitle"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop after normalization commit
        if: steps.normalize.outputs.changed == 'true'
        run: echo "Normalized source committed; the pushed commit will run the full quality gate."

      - name: Pint check
        if: steps.normalize.outputs.changed != 'true'
        run: vendor/bin/pint --test

      - name: Larastan
        if: steps.normalize.outputs.changed != 'true'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest
        if: steps.normalize.outputs.changed != 'true'
        run: php artisan test
