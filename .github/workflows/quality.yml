          command -v createdb
          echo "DB_PORT=5432" >> "$GITHUB_ENV"
          PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p 5432 -U "$DB_USERNAME"
          PGPASSWORD="$DB_PASSWORD" dropdb --if-exists -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"

      - name: Manual integrity quality security suite
        run: vendor/bin/pest tests/ManualAudit --display-warnings

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
          fi

  quality:
    name: "R4 - Pint + Larastan + Build + Coverage"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R4
      MARS_PG_CONTAINER: mars-pg-${{ github.run_id }}-r4
      MARS_PG_PORT: "55434"
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v php
          command -v composer
          command -v node
          command -v npm
          php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);'
          php -m | grep -qi '^bcmath$'
          php -m | grep -qi '^pdo_pgsql$'
          php -m | grep -Eqi '^(pcov|xdebug)$'
          php -v
          composer --version
          node --version
          npm --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Node install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$MARS_PG_CONTAINER" -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p "127.0.0.1:${MARS_PG_PORT}:5432" postgres:16 >/dev/null
            echo "DB_PORT=$MARS_PG_PORT" >> "$GITHUB_ENV"
            echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV"
            for i in $(seq 1 60); do
