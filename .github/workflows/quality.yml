      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$MARS_PG_CONTAINER" -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p "127.0.0.1:${MARS_PG_PORT}:5432" postgres:16 >/dev/null
            echo "DB_PORT=$MARS_PG_PORT" >> "$GITHUB_ENV"
            echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
            echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV"
            for i in $(seq 1 60); do
              docker exec "$MARS_PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1 && exit 0
              sleep 1
            done
            docker logs "$MARS_PG_CONTAINER" || true
