name: Quality - 4 Self Hosted Runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-main
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: "false"
  DB_CONNECTION: master
  DB_HOST: 127.0.0.1
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  XDEBUG_MODE: coverage

jobs:
  prepare-host:
    name: "Prepare local Ubuntu host"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare portable PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh ensure

      - name: Host toolchain summary
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.5 -v 2>/dev/null || php8.4 -v 2>/dev/null || php -v
          composer --version
          node --version
          npm --version
          psql --version

  foundation:
    needs: prepare-host
    name: "R1 - Unit + Foundation Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
      MARS_PG_PORT: "55431"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-bin"
          PHP_BIN=""
          for candidate in /usr/bin/php8.5 /usr/bin/php8.4 /usr/local/bin/php /usr/bin/php; do
            if [[ -x "$candidate" ]] && "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [[ -n "$PHP_BIN" ]] || { echo "No working PHP >= 8.4 binary found." >&2; exit 1; }
          ln -sf "$PHP_BIN" "$RUNNER_TEMP/mars-bin/php"
          echo "$RUNNER_TEMP/mars-bin" >> "$GITHUB_PATH"
          "$PHP_BIN" -m | grep -qi '^bcmath$'
          "$PHP_BIN" -m | grep -qi '^pdo_pgsql$'
          "$PHP_BIN" -v
          PATH="$RUNNER_TEMP/mars-bin:$PATH" composer --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Unit tests
        run: vendor/bin/pest tests/Unit --display-warnings

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55431 "$DB_MASTER_DATABASE"

      - name: Foundation feature tests
        run: |
          vendor/bin/pest \
            tests/Feature/Attachments \
            tests/Feature/Companies \
            tests/Feature/Concurrency \
            tests/Feature/Contacts \
            tests/Feature/Contracts \
            tests/Feature/Import \
            tests/Feature/Locations \
            tests/Feature/Period \
            tests/Feature/Pricing \
            --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55431

  domain:
    needs: prepare-host
    name: "R2 - Domain Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r2]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R2
      MARS_PG_PORT: "55432"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-bin"
          PHP_BIN=""
          for candidate in /usr/bin/php8.5 /usr/bin/php8.4 /usr/local/bin/php /usr/bin/php; do
            if [[ -x "$candidate" ]] && "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [[ -n "$PHP_BIN" ]] || { echo "No working PHP >= 8.4 binary found." >&2; exit 1; }
          ln -sf "$PHP_BIN" "$RUNNER_TEMP/mars-bin/php"
          echo "$RUNNER_TEMP/mars-bin" >> "$GITHUB_PATH"
          "$PHP_BIN" -m | grep -qi '^bcmath$'
          "$PHP_BIN" -m | grep -qi '^pdo_pgsql$'
          "$PHP_BIN" -v
          PATH="$RUNNER_TEMP/mars-bin:$PATH" composer --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55432 "$DB_MASTER_DATABASE"

      - name: Domain feature tests
        run: |
          vendor/bin/pest \
            tests/Feature/Channels \
            tests/Feature/Printing \
            tests/Feature/Products \
            tests/Feature/Sales \
            tests/Feature/Security \
            tests/Feature/Stock \
            tests/Feature/Units \
            --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55432

  manual-audit:
    needs: prepare-host
    name: "R3 - ManualAudit 273"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R3
      MARS_PG_PORT: "55433"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-bin"
          PHP_BIN=""
          for candidate in /usr/bin/php8.5 /usr/bin/php8.4 /usr/local/bin/php /usr/bin/php; do
            if [[ -x "$candidate" ]] && "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [[ -n "$PHP_BIN" ]] || { echo "No working PHP >= 8.4 binary found." >&2; exit 1; }
          ln -sf "$PHP_BIN" "$RUNNER_TEMP/mars-bin/php"
          echo "$RUNNER_TEMP/mars-bin" >> "$GITHUB_PATH"
          "$PHP_BIN" -m | grep -qi '^bcmath$'
          "$PHP_BIN" -m | grep -qi '^pdo_pgsql$'
          "$PHP_BIN" -v
          PATH="$RUNNER_TEMP/mars-bin:$PATH" composer --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55433 "$DB_MASTER_DATABASE"

      - name: Manual integrity quality security suite
        run: vendor/bin/pest tests/ManualAudit --display-warnings

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55433

  quality:
    needs: prepare-host
    name: "R4 - Pint + Larastan + Build + Stock Tests"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R4
      MARS_PG_PORT: "55434"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-bin"
          PHP_BIN=""
          for candidate in /usr/bin/php8.5 /usr/bin/php8.4 /usr/local/bin/php /usr/bin/php; do
            if [[ -x "$candidate" ]] && "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [[ -n "$PHP_BIN" ]] || { echo "No working PHP >= 8.4 binary found." >&2; exit 1; }
          ln -sf "$PHP_BIN" "$RUNNER_TEMP/mars-bin/php"
          echo "$RUNNER_TEMP/mars-bin" >> "$GITHUB_PATH"
          "$PHP_BIN" -m | grep -qi '^bcmath$'
          "$PHP_BIN" -m | grep -qi '^pdo_pgsql$'
          "$PHP_BIN" -v
          PATH="$RUNNER_TEMP/mars-bin:$PATH" composer --version
          node --version
          npm --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Node install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Pint diff
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          vendor/bin/pint
          if ! git diff --quiet; then
            echo "=== PINT PATCH START ==="
            git diff --no-color
            echo "=== PINT PATCH END ==="
            exit 1
          fi

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Start isolated PostgreSQL
        shell: bash
        run: bash scripts/ci/postgres.sh start 55434 "$DB_MASTER_DATABASE"

      - name: Phase 2 stock tests
        shell: bash
        run: |
          if php -m | grep -Eqi '^(pcov|xdebug); then
            vendor/bin/pest -c phpunit.stock.xml --coverage --min=90
          else
            echo "Coverage driver unavailable; running the complete stock suite without coverage gate."
            vendor/bin/pest -c phpunit.stock.xml
          fi

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: bash scripts/ci/postgres.sh stop 55434
