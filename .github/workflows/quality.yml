          if PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" >/dev/null 2>&1; then
            PGPASSWORD="$DB_PASSWORD" dropdb --if-exists -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"
            PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p 5432 -U "$DB_USERNAME" "$DB_MASTER_DATABASE"
            exit 0
          fi

          echo "No usable Docker or PostgreSQL service is available to the runner." >&2
          exit 1

      - name: Domain feature tests
        run: |
          vendor/bin/pest             tests/Feature/Channels             tests/Feature/Printing             tests/Feature/Products             tests/Feature/Sales             tests/Feature/Security             tests/Feature/Stock             tests/Feature/Units             --display-warnings

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm -f "$MARS_PG_CONTAINER" >/dev/null 2>&1 || true
          fi

  manual-audit:
    name: "R3 - ManualAudit 273"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R3
