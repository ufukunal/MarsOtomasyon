name: Quality - 4 Self Hosted Runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-main
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: "false"
  DB_CONNECTION: master
  DB_HOST: 127.0.0.1
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  XDEBUG_MODE: coverage

jobs:
  foundation:
    name: "R1 - Unit + Foundation Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
      MARS_PG_PORT: "55431"
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-bin"
          PHP_BIN=""
          for candidate in /usr/bin/php8.5 /usr/bin/php8.4 /usr/local/bin/php /usr/bin/php; do
            if [[ -x "$candidate" ]] && "$candidate" -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' >/dev/null 2>&1; then
              PHP_BIN="$candidate"
              break
            fi
          done
          [[ -n "$PHP_BIN" ]] || { echo "No working PHP >= 8.4 binary found." >&2; exit 1; }
          ln -sf "$PHP_BIN" "$RUNNER_TEMP/mars-bin/php"
          echo "$RUNNER_TEMP/mars-bin" >> "$GITHUB_PATH"
          "$PHP_BIN" -m | grep -qi '^bcmath$'
          "$PHP_BIN" -m | grep -qi '^pdo_pgsql$'
          "$PHP_BIN" -v
          PATH="$RUNNER_TEMP/mars-bin:$PATH" composer --version

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env

      - name: Unit tests
        run: vendor/bin/pest tests/Unit --display-warnings

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          PG_BINDIR="$(pg_config --bindir 2>/dev/null || true)"
          if [[ -z "$PG_BINDIR" || ! -x "$PG_BINDIR/initdb" ]]; then
            PG_BINDIR="$(find /usr/lib/postgresql -maxdepth 2 -type f -name initdb -printf '%h\n' 2>/dev/null | sort -V | tail -1)"
          fi
          [[ -n "$PG_BINDIR" && -x "$PG_BINDIR/initdb" && -x "$PG_BINDIR/pg_ctl" ]] || {
            echo "PostgreSQL server binaries (initdb/pg_ctl) not found." >&2
            exit 1
          }
          PGDATA="$RUNNER_TEMP/mars-pg-r1"
          rm -rf "$PGDATA"
          "$PG_BINDIR/initdb" -D "$PGDATA" -U postgres --auth=trust --no-locale >/dev/null
          {
            echo "listen_addresses = '127.0.0.1'"
            echo "port = $MARS_PG_PORT"
            echo "unix_socket_directories = '$RUNNER_TEMP'"
          } >> "$PGDATA/postgresql.conf"
          "$PG_BINDIR/pg_ctl" -D "$PGDATA" -l "$PGDATA/postgres.log" start
          for i in $(seq 1 30); do
            "$PG_BINDIR/pg_isready" -h 127.0.0.1 -p "$MARS_PG_PORT" -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          "$PG_BINDIR/pg_isready" -h 127.0.0.1 -p "$MARS_PG_PORT" -U postgres
          "$PG_BINDIR/createdb" -h 127.0.0.1 -p "$MARS_PG_PORT" -U postgres "$DB_MASTER_DATABASE"
          echo "DB_PORT=$MARS_PG_PORT" >> "$GITHUB_ENV"
          echo "DB_USERNAME=postgres" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=" >> "$GITHUB_ENV"
          echo "MARS_PG_BINDIR=$PG_BINDIR" >> "$GITHUB_ENV"
          echo "MARS_PGDATA=$PGDATA" >> "$GITHUB_ENV"

      - name: Foundation feature tests
        run: |
          vendor/bin/pest             tests/Feature/Attachments             tests/Feature/Companies             tests/Feature/Concurrency             tests/Feature/Contacts             tests/Feature/Contracts             tests/Feature/Import             tests/Feature/Locations             tests/Feature/Period             tests/Feature/Pricing             --display-warnings

      - name: Cleanup PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -n "${MARS_PG_BINDIR:-}" && -x "${MARS_PG_BINDIR}/pg_ctl" && -n "${MARS_PGDATA:-}" ]]; then
            "${MARS_PG_BINDIR}/pg_ctl" -D "${MARS_PGDATA}" -m fast stop >/dev/null 2>&1 || true
          fi

