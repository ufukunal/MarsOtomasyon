name: Mars Full Test v2 - Sequential R1-R4

on:
  workflow_call:
  push:
    branches: [main, test/v2-full-audit-20261009]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: "false"
  DB_CONNECTION: master
  DB_HOST: 100.127.235.30
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  XDEBUG_MODE: off

jobs:
  prepare-host:
    name: "Prepare local Ubuntu host"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    steps:
      - uses: actions/checkout@v4

      - name: Host toolchain summary
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.5 -v 2>/dev/null || php8.4 -v 2>/dev/null || php -v
          composer --version
          node --version
          npm --version
          psql --version
          echo "=== Coverage/build toolchain ==="
          for candidate in php8.5 php8.4 php; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "--- $candidate ---"
              "$candidate" -m 2>/dev/null | grep -E '^(pcov|xdebug)$' || true
            fi
          done
          command -v phpize8.5 || command -v phpize8.4 || command -v phpize || true
          command -v php-config8.5 || command -v php-config8.4 || command -v php-config || true
          command -v pecl || true
          command -v gcc || command -v cc || true
          command -v make || true

      - name: Generate reproducible Pint formatting patch
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in paths:
              if path.endswith('.php') and Path(path).is_file():
                  print('@@MARS_FMT ' + json.dumps({'path': path, 'content': Path(path).read_text(encoding='utf-8')}, ensure_ascii=False))
          print('@@MARS_FMT_COUNT ' + str(len([p for p in paths if p.endswith('.php')])))
          PY


  foundation:
    if: ${{ !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    needs: prepare-host
    name: "R1 - Unit + Foundation Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/test-v2-artifacts

      - name: Verify exact test database identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_ENV" == "testing" && "$DB_CONNECTION" == "master" ]] || exit 41
          case "$DB_MASTER_DATABASE" in
            MarsProject_Master_Test_R1|MarsProject_Master_Test_R2|MarsProject_Master_Test_R3|MarsProject_Coverage_Test) ;;
            *) echo "PRODUCTION GUARD: unknown database" >&2; exit 42 ;;
          esac

      - name: Test v2.0 PHP syntax
        shell: bash
        run: |
          find tests/Unit/TestV2 tests/Feature/TestV2 -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: vendor/bin/pest tests/Unit --display-warnings --log-junit storage/app/test-v2-artifacts/unit.xml

      - name: Verify permanent PostgreSQL and Valkey
        shell: bash
        env:
          MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
          MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
        run: bash scripts/ci/remote-test-services.sh "$DB_MASTER_DATABASE"

      - name: Foundation feature tests
        id: foundation_feature
        continue-on-error: true
        run: |
          vendor/bin/pest \
            tests/Feature/Attachments \
            tests/Feature/Companies \
            tests/Feature/Concurrency \
            tests/Feature/Contacts \
            tests/Feature/Contracts \
            tests/Feature/Import \
            tests/Feature/Locations \
            tests/Feature/Period \
            tests/Feature/Pricing \
            tests/Feature/TestV2 \
            --display-warnings --log-junit storage/app/test-v2-artifacts/foundation.xml

      - name: Enforce R1 unit and feature gates
        if: always()
        shell: bash
        env:
          UNIT: ${{ steps.unit.outcome }}
          FEATURE: ${{ steps.foundation_feature.outcome }}
        run: |
          set -Eeuo pipefail
          echo "Unit: $UNIT"
          echo "Foundation feature: $FEATURE"
          [[ "$UNIT" == "success" && "$FEATURE" == "success" ]]

      - name: Upload R1 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-v2-r1-${{ github.run_id }}
          path: storage/app/test-v2-artifacts/*.xml
          if-no-files-found: warn

  domain:
    if: ${{ always() && needs.prepare-host.result == 'success' && !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    needs: [prepare-host, foundation]
    name: "R2 - Domain Feature"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r2]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R2
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/test-v2-artifacts

      - name: Verify exact test database identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_ENV" == "testing" && "$DB_CONNECTION" == "master" ]] || exit 41
          case "$DB_MASTER_DATABASE" in
            MarsProject_Master_Test_R1|MarsProject_Master_Test_R2|MarsProject_Master_Test_R3|MarsProject_Coverage_Test) ;;
            *) echo "PRODUCTION GUARD: unknown database" >&2; exit 42 ;;
          esac

      - name: Verify permanent PostgreSQL and Valkey
        shell: bash
        env:
          MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
          MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
        run: bash scripts/ci/remote-test-services.sh "$DB_MASTER_DATABASE"

      - name: Domain feature tests
        run: |
          vendor/bin/pest \
            tests/Feature/Channels \
            tests/Feature/Printing \
            tests/Feature/Products \
            tests/Feature/Sales \
            tests/Feature/Security \
            tests/Feature/Stock \
            tests/Feature/Units \
            --display-warnings --log-junit storage/app/test-v2-artifacts/domain.xml


      - name: Upload R2 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-v2-r2-${{ github.run_id }}
          path: storage/app/test-v2-artifacts/*.xml
          if-no-files-found: warn

  manual-audit:
    if: ${{ always() && needs.prepare-host.result == 'success' && !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    needs: [prepare-host, domain]
    name: "R3 - ManualAudit 273"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R3
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/test-v2-artifacts

      - name: Verify exact test database identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_ENV" == "testing" && "$DB_CONNECTION" == "master" ]] || exit 41
          case "$DB_MASTER_DATABASE" in
            MarsProject_Master_Test_R1|MarsProject_Master_Test_R2|MarsProject_Master_Test_R3|MarsProject_Coverage_Test) ;;
            *) echo "PRODUCTION GUARD: unknown database" >&2; exit 42 ;;
          esac

      - name: Verify permanent PostgreSQL and Valkey
        shell: bash
        env:
          MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
          MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
        run: bash scripts/ci/remote-test-services.sh "$DB_MASTER_DATABASE"

      - name: Manual integrity quality security suite
        run: vendor/bin/pest tests/ManualAudit --display-warnings --log-junit storage/app/test-v2-artifacts/manual-audit.xml


      - name: Upload R3 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-v2-r3-${{ github.run_id }}
          path: storage/app/test-v2-artifacts/*.xml
          if-no-files-found: warn

  quality:
    if: ${{ always() && needs.prepare-host.result == 'success' && !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    needs: [prepare-host, manual-audit]
    name: "R4 - Pint + Larastan + Build + Stock Coverage"
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    env:
      DB_MASTER_DATABASE: MarsProject_Coverage_Test
    steps:
      - uses: actions/checkout@v4

      - name: Select stable PHP
        shell: bash
        run: bash scripts/ci/select-php.sh

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/app/test-v2-artifacts

      - name: Verify exact test database identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_ENV" == "testing" && "$DB_CONNECTION" == "master" ]] || exit 41
          case "$DB_MASTER_DATABASE" in
            MarsProject_Master_Test_R1|MarsProject_Master_Test_R2|MarsProject_Master_Test_R3|MarsProject_Coverage_Test) ;;
            *) echo "PRODUCTION GUARD: unknown database" >&2; exit 42 ;;
          esac

      - name: Verify Node toolchain
        shell: bash
        run: |
          node --version
          npm --version

      - name: Node install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Pint
        id: pint
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Larastan
        id: larastan
        if: always()
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress

      - name: Verify reusable PCOV coverage driver
        shell: bash
        run: |
          set -Eeuo pipefail
          # PCOV's fast line coverage is compatible with the --min=90 gate.
          # Build it at most once per PHP version in the runner's persistent home.
          if php -m | grep -Eqi '^pcov$'; then
            php -d pcov.enabled=1 -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'
            echo 'PCOV_EXTENSION=' >> "$GITHUB_ENV"
            echo 'System PCOV available.'
          else
            PHP_MM="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
            CACHE="$HOME/.cache/mars-pcov/php-$PHP_MM"
            SO="$CACHE/pcov.so"
            if ! php -d "extension=$SO" -d pcov.enabled=1 -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);' >/dev/null 2>&1; then
              mkdir -p "$CACHE"
              BUILD_DIR="$RUNNER_TEMP/mars-pcov-build"
              mkdir -p "$BUILD_DIR"
              cd "$BUILD_DIR"
              PHPIZE="$(command -v "phpize$PHP_MM" || command -v phpize)"
              PHP_CONFIG="$(command -v "php-config$PHP_MM" || command -v php-config)"
              pecl download pcov
              ARCHIVE="$(find . -maxdepth 1 -name 'pcov-*.tgz' -type f -print -quit)"
              test -f "$ARCHIVE"
              tar xzf "$ARCHIVE" --strip-components=1
              "$PHPIZE"
              ./configure --with-php-config="$PHP_CONFIG"
              make -j"$(nproc)"
              BUILT_SO="$(find "$BUILD_DIR" -type f -path '*/modules/pcov.so' -print -quit)"
              test -f "$BUILT_SO"
              install -m 0644 "$BUILT_SO" "$SO"
            fi
            php -d "extension=$SO" -d pcov.enabled=1 -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'
            echo "PCOV_EXTENSION=$SO" >> "$GITHUB_ENV"
            echo 'Cached PCOV verified.'
          fi

      - name: Verify permanent PostgreSQL and Valkey
        shell: bash
        env:
          MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
          MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
        run: bash scripts/ci/remote-test-services.sh "$DB_MASTER_DATABASE"

      - name: Phase 2 stock coverage
        id: coverage
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -Eeuo pipefail

          STOCK_COVERAGE_TESTS=(
            tests/Feature/Stock/Faz2BranchCoverageTest.php
            tests/Feature/Stock/Faz2IntegrityTest.php
            tests/Feature/Stock/Faz2SchemaIsolationTest.php
            tests/Feature/Stock/Faz2StockFlowTest.php
          )

          # R2 runs all Stock tests including the pcntl_fork concurrency suite.
          # R4 measures the complete non-fork Stock suite with genuine line coverage.
          FLAGS=()
          if [[ -n "${PCOV_EXTENSION:-}" ]]; then
            test -s "$PCOV_EXTENSION"
            FLAGS=(-d "extension=$PCOV_EXTENSION")
          fi
          XDEBUG_MODE=off php "${FLAGS[@]}" -d pcov.enabled=1 -d "pcov.directory=$GITHUB_WORKSPACE/app/Actions/Stock" vendor/bin/pest -c phpunit.stock.xml "${STOCK_COVERAGE_TESTS[@]}" --coverage --min=90 --log-junit storage/app/test-v2-artifacts/stock-coverage.xml


      - name: Enforce R4 quality gates
        if: always()
        shell: bash
        env:
          PINT: ${{ steps.pint.outcome }}
          LARASTAN: ${{ steps.larastan.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          set -Eeuo pipefail
          echo "Pint: $PINT"
          echo "Larastan: $LARASTAN"
          echo "Stock coverage: $COVERAGE"
          [[ "$PINT" == "success" && "$LARASTAN" == "success" && "$COVERAGE" == "success" ]]

      - name: Upload stock-coverage test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars-v2-r4-${{ github.run_id }}
          path: storage/app/test-v2-artifacts/*.xml
          if-no-files-found: warn

  http-smoke:
    name: "R5 - Isolated HTTP smoke and anonymous authorization"
    needs: [prepare-host, quality]
    if: ${{ always() && needs.prepare-host.result == 'success' && !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r1]
    env:
      DB_MASTER_DATABASE: MarsProject_Master_Test_R1
    steps:
      - uses: actions/checkout@v4
      - name: Select stable PHP
        run: bash scripts/ci/select-php.sh
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated HTTP environment
        run: cp .env.example .env
      - name: Authenticate test-only PostgreSQL and Valkey
        env:
          MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
          MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
        run: bash scripts/ci/remote-test-services.sh "$DB_MASTER_DATABASE"
      - name: Verify only localhost health and anonymous auth redirects
        shell: bash
        timeout-minutes: 5
        run: bash scripts/ci/test-v2-http-smoke.sh

  final-summary:
    name: "All stages - final gate and summary"
    if: ${{ always() && !contains(github.event.head_commit.message, 'preview Pint formatting only') }}
    needs: [prepare-host, foundation, domain, manual-audit, quality, http-smoke]
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    steps:
      - name: Consolidate sequential pipeline results
        shell: bash
        env:
          PREPARE: ${{ needs.prepare-host.result }}
          R1: ${{ needs.foundation.result }}
          R2: ${{ needs.domain.result }}
          R3: ${{ needs.manual-audit.result }}
          R4: ${{ needs.quality.result }}
          R5: ${{ needs.http-smoke.result }}
        run: |
          set -Eeuo pipefail
          {
            echo '## Mars sequential test pipeline'
            echo '| Aşama | Sonuç |'
            echo '| --- | --- |'
            echo "| Runner hazırlığı | $PREPARE |"
            echo "| R1 Unit / Foundation / V2 | $R1 |"
            echo "| R2 Domain | $R2 |"
            echo "| R3 ManualAudit | $R3 |"
            echo "| R4 Pint / Larastan / Build / Coverage | $R4 |"
            echo "| R5 Local HTTP / authorization | $R5 |"
            echo
            echo 'Bu run yalnız GitHub dalına commit edilmiş testleri kapsamaktadır.'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$PREPARE" == "success" && "$R1" == "success" && "$R2" == "success" && "$R3" == "success" && "$R4" == "success" && "$R5" == "success" ]]
