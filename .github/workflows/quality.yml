name: Quality - Static Analysis and Frontend Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-quality:
    name: R4 - Static checks and frontend build
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 30
    env:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP 8.4+
        shell: bash
        run: bash scripts/ci/select-php.sh
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend build
        run: npm run build
      - name: Pint style validation
        run: vendor/bin/pint --test
      - name: Larastan static analysis
        run: vendor/bin/phpstan analyse --no-progress
