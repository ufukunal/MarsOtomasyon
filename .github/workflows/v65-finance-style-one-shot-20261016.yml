name: V65 approved finance formatter
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v65-finance-style-one-shot-20261016.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BACKUP_NOTIFICATION_EMAIL: ci-only@invalid.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, gd, zip, pdo_pgsql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint
      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.php'
          if git diff --cached --quiet; then echo 'NO_FORMAT_CHANGES'; exit 0; fi
          git commit -m 'style(finance): standardize finance edit flows with Pint'
          git push origin HEAD:main
