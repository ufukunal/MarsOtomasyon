name: M0 Foundation Observer

on:
  workflow_run:
    workflows: [Foundation]
    types: [completed]

permissions:
  contents: write

jobs:
  record-gate-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record foundation gate conclusion
        shell: bash
        env:
          FOUNDATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          FOUNDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .ci
          printf 'conclusion=%s\nrun_id=%s\n' "$FOUNDATION_CONCLUSION" "$FOUNDATION_RUN_ID" > .ci/m0-foundation-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/m0-foundation-result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record M0 foundation result [skip ci]"
          git push origin HEAD:main
