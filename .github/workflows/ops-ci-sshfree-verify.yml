name: CI - SSH-free credential contract and static validation
on:
  push:
    branches: [ci/ssh-free-quality-20261009]
    paths:
      - '.github/workflows/ops-ci-sshfree-verify.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/ops-repeated-quality.yml'
      - '.github/workflows/ops-health.yml'
      - 'scripts/ci/remote-test-services.sh'
      - 'scripts/ci/health-test-infra.sh'
      - 'scripts/ci/health-host-infra.sh'
permissions:
  contents: read
jobs:
  static:
    name: R4 - Static CI contract and secret presence
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 5
    env:
      MARS_PG_PASSWORD: ${{ secrets.MARS_PG_PASSWORD }}
      MARS_VALKEY_PASSWORD: ${{ secrets.MARS_VALKEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify scripts and workflow with no leaked credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in scripts/ci/*.sh; do bash -n "$f"; done
          python3 - <<'PY'
          import pathlib, yaml
          jobs = yaml.safe_load(pathlib.Path(".github/workflows/quality.yml").read_text())["jobs"]
          assert [jobs[j].get("needs") for j in ("foundation", "domain", "manual-audit", "quality")] == ["prepare-host", "foundation", "domain", "manual-audit"]
          for job in ("foundation", "domain", "manual-audit", "quality"):
              verify = [s for s in jobs[job]["steps"] if s.get("name") == "Verify permanent PostgreSQL and Valkey"]
              assert len(verify) == 1, job
              assert set(verify[0]["env"]) == {"MARS_PG_PASSWORD", "MARS_VALKEY_PASSWORD"}
          helper = pathlib.Path("scripts/ci/remote-test-services.sh").read_text()
          assert "ssh " not in helper and "ssh_options" not in helper
          assert "CI_SECRET_MISSING_OR_INVALID" in helper
          assert "--min=90" in pathlib.Path(".github/workflows/quality.yml").read_text()
          for name in ("quality.yml", "ops-health.yml", "ops-repeated-quality.yml"):
              assert isinstance(yaml.safe_load(pathlib.Path(".github/workflows",name).read_text()),dict)
          print("STATIC_CI_SSH_FREE_CONTRACT_PASS")
          PY
          failed=0
          if [[ ! "${MARS_PG_PASSWORD:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "MARS_PG_PASSWORD_ACTIONS_SECRET_MISSING_OR_INVALID" >&2
            failed=1
          else
            echo "MARS_PG_PASSWORD_ACTIONS_SECRET_PRESENT"
          fi
          if [[ ! "${MARS_VALKEY_PASSWORD:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "MARS_VALKEY_PASSWORD_ACTIONS_SECRET_MISSING_OR_INVALID" >&2
            failed=1
          else
            echo "MARS_VALKEY_PASSWORD_ACTIONS_SECRET_PRESENT"
          fi
          if (( failed != 0 )); then exit 23; fi
          echo "GITHUB_ACTIONS_TEST_SECRETS_PRESENT"
