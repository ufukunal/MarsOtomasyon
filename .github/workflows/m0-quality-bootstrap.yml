name: M0 Quality Bootstrap

on:
  push:
    branches: [main]
    paths:
      - composer.json
      - package.json
      - .github/workflows/m0-quality-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets
          coverage: none
          tools: composer:v2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Resolve PHP dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Resolve frontend dependencies
        run: npm install --ignore-scripts

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock M0 quality dependencies [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record bootstrap result
        if: always()
        env:
          BOOTSTRAP_STATUS: ${{ job.status }}
          BOOTSTRAP_RUN_ID: ${{ github.run_id }}
          BOOTSTRAP_HEAD_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .ci
          printf 'conclusion=%s\nrun_id=%s\nhead_sha=%s\n' "$BOOTSTRAP_STATUS" "$BOOTSTRAP_RUN_ID" "$BOOTSTRAP_HEAD_SHA" > .ci/m0-quality-bootstrap-result
          git add .ci/m0-quality-bootstrap-result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record M0 quality bootstrap result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
