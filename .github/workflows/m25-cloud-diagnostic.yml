name: M25 Cloud Diagnostic

on:
  push:
    branches: [feat/m25-product-family-variant-v3]

permissions:
  contents: read

concurrency:
  group: m25-cloud-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-m25-cloud:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-m25-cloud

jobs:
  focused-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run focused M25 tests
        run: vendor/bin/pest tests/Integration/Products/ProductFamilyHttpTest.php tests/Integration/Products/ProductFamilyMediaManagerTest.php
