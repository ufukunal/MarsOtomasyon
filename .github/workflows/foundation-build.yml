name: Foundation Build

on:
  push:
    branches: [main]
    paths:
      - "Mars.slnx"
      - "Directory.Build.props"
      - ".gitignore"
      - ".config/dotnet-tools.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/foundation-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: dotnet-10-foundation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Mars.slnx

      - name: Build
        run: dotnet build Mars.slnx --configuration Release --no-restore

      - name: Foundation targeted tests
        run: dotnet run --project tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj --configuration Release --no-build

      - name: FW-IMP-004 generate and inspect migration
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          OUT_DIR="src/Mars.Infrastructure/Persistence/Migrations/FwImp004Generated"
          rm -rf "$OUT_DIR"

          dotnet tool run dotnet-ef migrations add FwImp004FoundationPrimitives             --project src/Mars.Infrastructure/Mars.Infrastructure.csproj             --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj             --output-dir Persistence/Migrations/FwImp004Generated             --configuration Release             --no-build

          grep -R 'name: "audit_events"' "$OUT_DIR"
          grep -R 'name: "idempotency_operations"' "$OUT_DIR"
          grep -R 'name: "outbox_messages"' "$OUT_DIR"

          if grep -RE 'name: "(party|product|variant|reservation|inventory|sales|purchase|warehouse|finance|return|quality)' "$OUT_DIR"; then
            echo "FW-IMP-004 migration contains prohibited domain table creation."
            exit 1
          fi

          for file in "$OUT_DIR"/*.cs; do
            echo "===FWIMP004_FILE_BEGIN:$file==="
            cat "$file"
            echo "===FWIMP004_FILE_END:$file==="
          done

      - name: Project references
        shell: bash
        run: |
          set -euo pipefail
          dotnet list src/Mars.Application/Mars.Application.csproj reference
          dotnet list src/Mars.Infrastructure/Mars.Infrastructure.csproj reference
          dotnet list src/Mars.Api/Mars.Api.csproj reference
          dotnet list src/Mars.Worker/Mars.Worker.csproj reference
          dotnet list tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj reference
