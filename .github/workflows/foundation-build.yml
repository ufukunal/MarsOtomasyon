name: Foundation Build

on:
  push:
    branches: [main]
    paths:
      - "Mars.slnx"
      - "Directory.Build.props"
      - ".gitignore"
      - ".config/dotnet-tools.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/foundation-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: dotnet-10-foundation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Mars.slnx

      - name: Build
        run: dotnet build Mars.slnx --configuration Release --no-restore

      - name: Foundation targeted tests
        run: dotnet run --project tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj --configuration Release --no-build

      - name: FW-IMP-003 migration mechanism probe
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          PROBE_DIR="src/Mars.Infrastructure/Persistence/Migrations/FwImp003Probe"
          rm -rf "$PROBE_DIR"
          dotnet tool run dotnet-ef migrations add FwImp003Probe --project src/Mars.Infrastructure/Mars.Infrastructure.csproj --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj --output-dir Persistence/Migrations/FwImp003Probe --configuration Release --no-build

          if grep -R "CreateTable" "$PROBE_DIR"; then
            echo "FW-IMP-003 probe unexpectedly generated a table."
            exit 1
          fi

          rm -rf "$PROBE_DIR"

      - name: Project references
        shell: bash
        run: |
          set -euo pipefail
          dotnet list src/Mars.Application/Mars.Application.csproj reference
          dotnet list src/Mars.Infrastructure/Mars.Infrastructure.csproj reference
          dotnet list src/Mars.Api/Mars.Api.csproj reference
          dotnet list src/Mars.Worker/Mars.Worker.csproj reference
          dotnet list tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj reference
