name: Foundation Build

on:
  push:
    branches: [main]
    paths:
      - "Mars.slnx"
      - "Directory.Build.props"
      - ".gitignore"
      - ".config/dotnet-tools.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/foundation-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: foundation
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Verify Node
        run: node --version && npm --version

      - name: FW-IMP-006 frontend verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/Mars.Web
          npm run verify --prefix src/Mars.Web

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Mars.slnx

      - name: Build
        run: dotnet build Mars.slnx --configuration Release --no-restore

      - name: Foundation targeted tests
        run: dotnet run --project tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj --configuration Release --no-build

      - name: FW-IMP-005 committed Identity/OpenIddict migration verification
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_DIR="src/Mars.Infrastructure/Persistence/Migrations/Identity"
          MIG_FILE="$MIG_DIR/20260922113226_FwImp005IdentityProtocol.cs"

          test -f "$MIG_FILE"
          test -f "$MIG_DIR/20260922113226_FwImp005IdentityProtocol.Designer.cs"
          test -f "src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs"

          grep -F 'name: "users"' "$MIG_FILE"
          grep -F 'name: "OpenIddictApplications"' "$MIG_FILE"
          grep -F 'name: "OpenIddictAuthorizations"' "$MIG_FILE"
          grep -F 'name: "OpenIddictScopes"' "$MIG_FILE"
          grep -F 'name: "OpenIddictTokens"' "$MIG_FILE"

          if grep -E 'name: "(party|product|variant|reservation|inventory|sales|purchase|warehouse|finance|return|quality)' "$MIG_FILE"; then
            echo "FW-IMP-005 migration contains prohibited ERP domain table creation."
            exit 1
          fi

          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project src/Mars.Infrastructure/Mars.Infrastructure.csproj             --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj             --configuration Release             --no-build

      - name: FW-IMP-005 API smoke
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ASPNETCORE_URLS: "http://127.0.0.1:5085"
          PostgreSql__RuntimeConnectionString: "Host=127.0.0.1;Port=1;Database=mars_fwimp005;Username=mars;Timeout=1;Command Timeout=1"
        run: |
          set -euo pipefail
          LOG=/tmp/mars-fwimp005-api.log
          dotnet run --project src/Mars.Api/Mars.Api.csproj --configuration Release --no-build >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          STARTED=false
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5085/health/live >/tmp/live.json; then
              STARTED=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$STARTED" != "true" ]; then
            cat "$LOG"
            exit 1
          fi

          READY_STATUS=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:5085/health/ready)
          test "$READY_STATUS" = "503"

          PROTECTED_STATUS=$(curl --silent --output /tmp/protected.json --write-out '%{http_code}' http://127.0.0.1:5085/api/v1/foundation/context)
          test "$PROTECTED_STATUS" = "401"

          curl --silent --fail http://127.0.0.1:5085/openapi/v1.json >/tmp/openapi.json
          grep -F '/api/v1/foundation/context' /tmp/openapi.json

          SWAGGER_STATUS=$(curl --silent --output /tmp/swagger.txt --write-out '%{http_code}' http://127.0.0.1:5085/swagger)
          test "$SWAGGER_STATUS" = "404"

      - name: Project references
        shell: bash
        run: |
          set -euo pipefail
          dotnet list src/Mars.Application/Mars.Application.csproj reference
          dotnet list src/Mars.Infrastructure/Mars.Infrastructure.csproj reference
          dotnet list src/Mars.Api/Mars.Api.csproj reference
          dotnet list src/Mars.Worker/Mars.Worker.csproj reference
          dotnet list tests/Mars.Foundation.Tests/Mars.Foundation.Tests.csproj reference
