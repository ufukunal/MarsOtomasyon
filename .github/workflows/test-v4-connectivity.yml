name: TEST V4 - Read Only CI to PROD Connectivity
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-v4-connectivity.yml"
      - "scripts/ci/v4-connectivity-diagnostic.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-connectivity-readonly-r4
  cancel-in-progress: false
jobs:
  network-diagnostic:
    name: R4 - SSH and DB service reachability (read-only)
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 4
    env:
      MARS_V4_SSH_PRIVATE_KEY: ${{ secrets.MARS_V4_SSH_PRIVATE_KEY }}
      MARS_V4_SSH_PASSWORD: ${{ secrets.MARS_V4_SSH_PASSWORD }}
      MARS_V4_SSH_KNOWN_HOSTS: ${{ secrets.MARS_V4_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe real CI VM and PROD host without changes
        shell: bash
        run: bash scripts/ci/v4-connectivity-diagnostic.sh
