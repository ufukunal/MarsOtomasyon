name: V65 purchases two-file Pint correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v65-purchases-two-style-20261016.yml']
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BACKUP_NOTIFICATION_EMAIL: ci-only@invalid.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, intl, gd, zip, pdo_pgsql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint app/Livewire/Purchases/PurchaseDispatchEditor.php routes/web.php
      - name: Commit and publish exact styling changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/Livewire/Purchases/PurchaseDispatchEditor.php routes/web.php
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'style(purchases): finalize supplier dispatch and route Pint formatting'
          git push origin HEAD:main
