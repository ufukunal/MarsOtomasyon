name: M18 TY Contract

on:
  push:
    branches: [feat/m18-trendyol]

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m18-trendyol
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Normalize PHPDocs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Modules/Commerce/Providers/Trendyol/TrendyolClient.php')
          text = path.read_text()
          text = text.replace(
              '/** @param array<string,mixed> $credentials @param array<string,mixed> $payload */',
              '/**\n     * @param  array<string,mixed>  $credentials\n     * @param  array<string,mixed>  $payload\n     */'
          )
          text = text.replace(
              '/** @param array<string,mixed> $credentials @param array<string,mixed> $query */',
              '/**\n     * @param  array<string,mixed>  $credentials\n     * @param  array<string,mixed>  $query\n     */'
          )
          text = text.replace(
              '/** @param array<string,mixed> $credentials @return array{0:string,1:string,2:PendingRequest} */',
              '/**\n     * @param  array<string,mixed>  $credentials\n     * @return array{0:string,1:string,2:PendingRequest}\n     */'
          )
          path.write_text(text)
          PY
      - name: Format
        run: vendor/bin/pint app/Modules/Commerce/Providers/Trendyol/TrendyolClient.php app/Modules/Commerce/ProviderRegistry.php config/commerce.php tests/Unit/TrendyolContractTest.php
      - name: Contract fixture
        run: vendor/bin/pest tests/Unit/TrendyolContractTest.php --colors=never
      - name: Static analysis
        run: vendor/bin/phpstan analyse app/Modules/Commerce/Providers/Trendyol/TrendyolClient.php app/Modules/Commerce/ProviderRegistry.php --no-progress
      - name: Commit formatting and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Modules/Commerce/Providers/Trendyol/TrendyolClient.php app/Modules/Commerce/ProviderRegistry.php config/commerce.php tests/Unit/TrendyolContractTest.php
          git rm .github/workflows/m18-ty-contract.yml
          git commit -m 'test(m18-ty): verify Trendyol V2 contract fixture'
          git push origin HEAD:feat/m18-trendyol
