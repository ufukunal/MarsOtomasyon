name: M0 Quality Bootstrap Observer

on:
  workflow_run:
    workflows: [M0 Quality Bootstrap]
    types: [completed]

permissions:
  contents: write

jobs:
  record-bootstrap-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record bootstrap conclusion
        shell: bash
        env:
          BOOTSTRAP_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BOOTSTRAP_RUN_ID: ${{ github.event.workflow_run.id }}
          BOOTSTRAP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p .ci
          printf 'conclusion=%s\nrun_id=%s\nhead_sha=%s\n' "$BOOTSTRAP_CONCLUSION" "$BOOTSTRAP_RUN_ID" "$BOOTSTRAP_HEAD_SHA" > .ci/m0-quality-bootstrap-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/m0-quality-bootstrap-result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record M0 quality bootstrap result [skip ci]"
          git push origin HEAD:main
