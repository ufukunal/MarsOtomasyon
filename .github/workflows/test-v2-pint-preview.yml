name: Temporary V2 Pint formatter preview

on:
  push:
    branches: [test/v2-full-audit-20261009]
    paths:
      - '.github/workflows/test-v2-pint-preview.yml'

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: 'false'

jobs:
  formatter:
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    steps:
      - uses: actions/checkout@v4
      - name: Select PHP
        run: bash scripts/ci/select-php.sh
      - name: Install Pint
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format isolated checkout and emit exact changes
        shell: bash
        run: |
          set -Eeuo pipefail
          vendor/bin/pint
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in files:
              if path.endswith('.php') and Path(path).is_file():
                  print('@@MARS_FMT ' + json.dumps({'path': path, 'content': Path(path).read_text(encoding='utf-8')}, ensure_ascii=False))
          print('@@MARS_FMT_COUNT ' + str(len([p for p in files if p.endswith('.php')])))
          PY
