name: Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Build frontend assets
        run: npm run build

  postgres-tests:
    name: postgres-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run unit tests
        run: vendor/bin/pest tests/Unit --colors=always

      - name: Run feature tests
        run: vendor/bin/pest tests/Feature --colors=always

      - name: Integration - Accounts
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Accounts --colors=always

      - name: Integration - B2B
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/B2B --colors=always

      - name: Integration - Commerce
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Commerce --colors=always

      - name: Integration - Communication core
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Communication/M20CommunicationCoreTest.php --colors=always

      - name: Integration - M20 exit gate
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Communication/M20ExitGateTest.php --colors=always

      - name: Integration - Core
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Core --colors=always

      - name: Integration - Dispatches
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Dispatches --colors=always

      - name: Integration - GoodsReceipts
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/GoodsReceipts --colors=always

      - name: Integration - Imports
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Imports --colors=always

      - name: Integration - Instruments
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Instruments --colors=always

      - name: Integration - Inventory
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Inventory --colors=always

      - name: Integration - Operations
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Operations --colors=always

      - name: Integration - PostgreSQL foundation
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/PostgreSqlFoundationTest.php --colors=always

      - name: Integration - Production
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Production --colors=always

      - name: Integration - Products
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Products --colors=always

      - name: Integration - PurchaseOrders
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/PurchaseOrders --colors=always

      - name: Integration - PurchaseReturns
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/PurchaseReturns --colors=always

      - name: Integration - Quotes
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Quotes --colors=always

      - name: Integration - Reports
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Reports --colors=always

      - name: Integration - SalesInvoices
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/SalesInvoices --colors=always

      - name: Integration - SalesOrders
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/SalesOrders --colors=always

      - name: Integration - SalesReturns
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/SalesReturns --colors=always

      - name: Integration - Subcontract
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Subcontract --colors=always

      - name: Integration - SupplierInvoices
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/SupplierInvoices --colors=always

      - name: Integration - Treasury
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/Treasury --colors=always

      - name: Integration - Valkey foundation
        if: ${{ always() }}
        run: vendor/bin/pest tests/Integration/ValkeyFoundationTest.php --colors=always

      - name: Run architecture tests
        if: ${{ always() }}
        run: vendor/bin/pest tests/Architecture --colors=always

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify application boot
        run: php artisan route:list --path=up

      - name: Run browser smoke tests
        run: composer test:browser

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for obvious secrets
        run: bash scripts/ci/secret-scan.sh
