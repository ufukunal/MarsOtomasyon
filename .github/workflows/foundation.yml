name: Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-v3-local-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: session
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  REDIS_PREFIX: 'mars-ci:'
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  REDIS_QUEUE_DB: 2
  REDIS_SESSION_DB: 3
  REDIS_QUEUE: mars-ci
  REDIS_QUEUE_RETRY_AFTER: 90
  COMPOSER_PROCESS_TIMEOUT: 1800

jobs:
  quality:
    name: quality
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 15

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated CI toolchain
        run: bash scripts/ci/prepare-ci-toolchain.sh

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Verify local toolchain
        run: |
          php -v
          composer --version
          node --version
          npm --version
          php -m | grep -E 'pdo_pgsql|redis|sockets|intl|zip|gd'

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Build frontend assets
        run: npm run build

  postgres-tests:
    name: postgres-tests
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 35
    env:
      DB_DATABASE: mars_ci_${{ github.run_id }}_${{ github.run_attempt }}_pg
      REDIS_PREFIX: 'mars-ci:${{ github.run_id }}:pg:'
      REDIS_QUEUE: mars-ci-${{ github.run_id }}-pg

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated CI toolchain
        run: bash scripts/ci/prepare-ci-toolchain.sh

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Verify shared PostgreSQL and Valkey
        run: |
          php -m | grep -E 'pdo_pgsql|redis|sockets|intl|zip|gd'
          PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"
          redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping | grep -qx PONG

      - name: Prepare isolated PostgreSQL database
        run: |
          PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Run non-browser test suites
        run: composer test

      - name: Cleanup isolated PostgreSQL database
        if: always()
        run: PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

  browser-smoke:
    name: browser-smoke
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 25
    env:
      DB_DATABASE: mars_ci_${{ github.run_id }}_${{ github.run_attempt }}_browser
      REDIS_PREFIX: 'mars-ci:${{ github.run_id }}:browser:'
      REDIS_QUEUE: mars-ci-${{ github.run_id }}-browser

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated CI toolchain
        run: bash scripts/ci/prepare-ci-toolchain.sh

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Verify shared PostgreSQL and Valkey
        run: |
          PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"
          redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" ping | grep -qx PONG

      - name: Prepare isolated PostgreSQL database
        run: |
          PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"
          PGPASSWORD="$DB_PASSWORD" createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fresh PostgreSQL schema
        run: php artisan migrate:fresh --force

      - name: Verify application boot
        run: php artisan route:list --path=up

      - name: Run browser smoke tests
        run: composer test:browser

      - name: Cleanup isolated PostgreSQL database
        if: always()
        run: PGPASSWORD="$DB_PASSWORD" dropdb --if-exists --force -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" "$DB_DATABASE"

  security:
    name: security
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 15

    steps:
      - name: Runner identity
        run: echo "runner=${{ runner.name }} host=$(hostname)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated CI toolchain
        run: bash scripts/ci/prepare-ci-toolchain.sh

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Verify local toolchain
        run: |
          php -v
          composer --version
          node --version
          npm --version

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Scan tracked files for obvious secrets
        run: bash scripts/ci/secret-scan.sh
