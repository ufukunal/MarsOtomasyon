name: UAT - Source-Pinned Deployable Release Artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uat-release-artifact.yml'
      - 'ops/build-release-artifact.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mars-uat-release-artifact
  cancel-in-progress: true
jobs:
  prepare:
    name: R4 - Build UAT release without Docker or PROD access
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 35
    env:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_HOST: "192.0.2.1"
      DB_PORT: "9"
      REDIS_HOST: "192.0.2.1"
      REDIS_PORT: "9"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Select available PHP runtime
        run: bash scripts/ci/select-php.sh
      - name: Build immutable source-pinned application release
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mars-uat-output"
          bash ops/build-release-artifact.sh "${GITHUB_SHA}" "$RUNNER_TEMP/mars-uat-output/release"
          test -f "$RUNNER_TEMP/mars-uat-output/release/.mars-artifact-checksums"
          (cd "$RUNNER_TEMP/mars-uat-output/release" && sha256sum -c --status .mars-artifact-checksums)
      - name: Archive UAT release
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --directory "$RUNNER_TEMP/mars-uat-output" -czf "$RUNNER_TEMP/mars-uat-release.tar.gz" release
          sha256sum "$RUNNER_TEMP/mars-uat-release.tar.gz" > "$RUNNER_TEMP/mars-uat-release.sha256"
          echo "UAT release archive generated for ${GITHUB_SHA}"
      - name: Upload immutable UAT release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mars-uat-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mars-uat-release.tar.gz
            ${{ runner.temp }}/mars-uat-release.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this job's disposable release files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mars-uat-output" "$RUNNER_TEMP/mars-uat-release.tar.gz" "$RUNNER_TEMP/mars-uat-release.sha256"
