name: M17 Core Probe

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-core-probe.yml'

permissions:
  contents: write

env:
  APP_NAME: MarsOtomasyon
  APP_ENV: testing
  APP_KEY: base64:TWFyc090b21hc3lvbkZvdW5kYXRpb25UZXN0S2V5ISE=
  APP_DEBUG: 'false'
  APP_URL: http://localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: mars_test
  DB_USERNAME: mars
  DB_PASSWORD: mars
  CACHE_STORE: redis
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mars_test
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mars -d mars_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:9.1.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, sockets, intl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Probe
        shell: bash
        run: |
          set +e
          {
            echo '=== PINT ==='
            vendor/bin/pint --test app/Modules/Commerce app/Modules/Operations/ChannelDomainSync.php app/Modules/Operations/Jobs/ProcessIntegrationSync.php app/Modules/Operations/Http/ChannelWebhookController.php database/migrations/2026_08_30_060000_create_m17_commerce.php
            echo "pint_status=$?"
            echo '=== MIGRATE ==='
            php artisan migrate:fresh --force
            echo "migrate_status=$?"
            echo '=== PHPSTAN ==='
            vendor/bin/phpstan analyse app/Modules/Commerce app/Modules/Operations/ChannelDomainSync.php app/Modules/Operations/Jobs/ProcessIntegrationSync.php app/Modules/Operations/Http/ChannelWebhookController.php --no-progress --memory-limit=512M
            echo "phpstan_status=$?"
          } 2>&1 | tee /tmp/m17-probe.log
          statuses=$(grep -E '^(pint|migrate|phpstan)_status=' /tmp/m17-probe.log | cut -d= -f2 | tr '\n' ' ')
          if echo "$statuses" | grep -Eq '(^| )([1-9][0-9]*)( |$)'; then
            mkdir -p ci-diagnostics
            tail -n 1500 /tmp/m17-probe.log > ci-diagnostics/m17-core-probe.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add ci-diagnostics/m17-core-probe.txt
            git commit -m "ci(m17): record commerce core probe failure" || true
            git push origin HEAD:feat/m17-commerce
            exit 1
          fi
          rm .github/workflows/m17-core-probe.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/m17-core-probe.yml
          git commit -m "ci(m17): remove successful core probe"
          git push origin HEAD:feat/m17-commerce
