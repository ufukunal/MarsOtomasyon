name: Fix M14 Static

on:
  push:
    branches: [feat/m14-production]
    paths:
      - '.github/workflows/fix-m14-static.yml'
      - 'app/Modules/Production/Actions/ProductionOperations.php'

permissions:
  contents: write

concurrency:
  group: fix-m14-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m14-production
      - name: Apply exact PHPStan fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Modules/Production/Actions/ProductionOperations.php')
          text = path.read_text()
          replacements = {
              "(int) ($material['product_id'] ?? 0)": "(int) $material['product_id']",
              "(string) ($material['quantity'] ?? '')": "(string) $material['quantity']",
              "(string) ($row?->value ?? '0')": "(string) $row->value",
              "(string) ($row?->value ?? '')": "(string) $row->value",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Modules/Production/Actions/ProductionOperations.php
          git commit -m 'fix(m14): satisfy production static contracts'
          git push origin HEAD:feat/m14-production
