name: TEST V4 - Manual Remote Isolated Data
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose read-only preflight before any TEST V4 suite"
        required: true
        type: choice
        default: preflight
        options: [preflight, contracts, unit, feature, integration, valkey, performance]
      isolation_confirmed:
        description: "Dedicated mars_test PostgreSQL DBs and Valkey ACL were verified on PROD VM"
        required: true
        type: choice
        default: "NO"
        options: ["NO", "YES"]
permissions:
  contents: read
concurrency:
  group: mars-v4-manual-isolated-r4
  cancel-in-progress: false
jobs:
  test-v4:
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r4]
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: master
      DB_HOST: "mars-prod-1.taila20365.ts.net"
      DB_PORT: "55432"
      DB_MASTER_DATABASE: mars_test_master
      DB_USERNAME: mars_test
      DB_PASSWORD: ${{ secrets.MARS_V4_DB_PASSWORD }}
      DB_SSLMODE: prefer
      REDIS_HOST: "mars-prod-1.taila20365.ts.net"
      REDIS_PORT: "6379"
      REDIS_USERNAME: mars_test
      REDIS_PASSWORD: ${{ secrets.MARS_V4_VALKEY_PASSWORD }}
      REDIS_PREFIX: "mars:test:"
      REDIS_CLIENT: phpredis
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Select existing PHP 8.4+ and PHP client extensions
        shell: bash
        run: bash scripts/ci/select-php.sh
      - name: Install PHP test dependencies
        if: ${{ inputs.suite != 'preflight' }}
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: R0 direct Tailscale isolation preflight and selected suite
        shell: bash
        env:
          SELECTED_SUITE: ${{ inputs.suite }}
          ISOLATION_CONFIRMED: ${{ inputs.isolation_confirmed }}
          MARS_TEST_EXECUTION_APPROVED: ${{ inputs.suite != 'preflight' && 'MARS_V4_EXECUTION_APPROVED' || 'NO' }}
          MARS_INTEGRATION_TESTS_APPROVED: ${{ (inputs.suite == 'integration' || inputs.suite == 'valkey') && 'I_APPROVE_LOCAL_TEST_ONLY' || 'NO' }}
          MARS_VALKEY_TESTS_APPROVED: ${{ inputs.suite == 'valkey' && 'I_APPROVE_LOCAL_VALKEY_ONLY' || 'NO' }}
          MARS_PERFORMANCE_TESTS_APPROVED: ${{ inputs.suite == 'performance' && 'I_APPROVE_LOCAL_BENCHMARK' || 'NO' }}
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 1800s bash scripts/ci/test-v4-direct.sh "$SELECTED_SUITE" 2>&1 | tee "artifacts/test-v4/$SELECTED_SUITE.log"
      - name: Retain sanitized diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-remote-${{ inputs.suite }}-${{ github.run_id }}
          path: artifacts/test-v4/
          if-no-files-found: ignore
          retention-days: 14
