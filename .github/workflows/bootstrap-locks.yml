name: Bootstrap Lockfiles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Set test application key
        shell: bash
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Resolve Composer lockfile
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Verify Laravel boot
        run: |
          php artisan --version
          php artisan about --only=environment
          php artisan test

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Pin npm 11
        run: npm install --global npm@11.6.0

      - name: Resolve npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

      - name: Commit generated lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "chore: lock bootstrap dependencies [skip ci]"
          git push origin HEAD:main
