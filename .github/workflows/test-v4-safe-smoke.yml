name: TEST V4 - Parallel Safe Arithmetic Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-v4-safe-smoke.yml'
      - 'tests/Unit/Finance/Mt940ParserTest.php'
      - 'tests/Unit/Security/MutationGateEntryPointsTest.php'
      - 'app/Actions/Finance/ParseBankStatementFile.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-unit-smoke:
    name: V4 - pure Unit arithmetic and document contracts, no DB
    runs-on: [self-hosted, Linux, mars-ubuntu]
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Choose PHP 8.4+
        run: bash scripts/ci/select-php.sh
      - name: Create runner-only Laravel .env from example
        shell: bash
        run: cp .env.example .env
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Disconnect all database endpoints in runner-local PHPUnit config
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phpunit.xml')
          x=p.read_text()
          assert x.count('value="mars-prod-1.taila20365.ts.net"') == 2
          x=x.replace('value="mars-prod-1.taila20365.ts.net"', 'value="192.0.2.1"')
          x=x.replace('name="DB_PORT" value="55432"','name="DB_PORT" value="9"')
          x=x.replace('name="REDIS_PORT" value="6379"','name="REDIS_PORT" value="9"')
          p.write_text(x)
          PY
      - name: Run isolated finance, template, authorization, and all-action guard regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 480s vendor/bin/pest \
            tests/Unit/Money/MoneyTest.php \
            tests/Unit/Documents/DocumentTotalsTest.php \
            tests/Unit/Production/ProductionCostCalculatorTest.php \
            tests/Unit/Formatting/TrFormatterTest.php \
            tests/Unit/Units/UnitConversionTest.php \
            tests/Unit/Stock/StockBalanceTest.php \
            tests/Unit/Pricing/PriceDeviationTest.php \
            tests/Unit/Concurrency/IdempotencyCodecTest.php \
            tests/Unit/DocumentTemplates/TemplateDefinitionInputGuardTest.php \
            tests/Unit/Companies/CopiedContactPrivacySnapshotTest.php \
            tests/Unit/Security/MutationAuthorizerTest.php \
            tests/Unit/Security/CorrelationAndPeriodCleanupMiddlewareTest.php \
            tests/Unit/Security/MutationGateEntryPointsTest.php \
            tests/Unit/Finance/Mt940ParserTest.php \
            2>&1 | tee artifacts/test-v4/safe-smoke.log
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-safe-smoke-${{ github.run_id }}
          path: artifacts/test-v4/
          retention-days: 14
          if-no-files-found: ignore
