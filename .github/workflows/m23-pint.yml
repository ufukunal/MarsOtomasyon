name: M23 Pint Helper

on:
  push:
    branches:
      - feat/m23-production-candidate-hardening
    paths:
      - .github/workflows/m23-pint.yml

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m23-production-candidate-hardening
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: ./vendor/bin/pint app/Foundation/Operations/ProductionCandidateGate.php tests/Unit/ProductionCandidateGateTest.php app/Modules/Reports/OperationalReportCatalog.php
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Foundation/Operations/ProductionCandidateGate.php tests/Unit/ProductionCandidateGateTest.php app/Modules/Reports/OperationalReportCatalog.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(m23): apply pint formatting'
          git push origin HEAD:feat/m23-production-candidate-hardening
