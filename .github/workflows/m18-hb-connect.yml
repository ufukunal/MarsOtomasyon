name: M18 HB Connect

on:
  push:
    branches: [feat/m18-hepsiburada]

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m18-hepsiburada
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply guarded patch
        run: python3 scripts/ci/m18_hb_connect.py
      - name: Format
        run: vendor/bin/pint app/Modules/Commerce/ChannelCenterService.php app/Modules/Commerce/Providers/Hepsiburada/HepsiburadaClient.php config/commerce.php tests/Unit/HepsiburadaContractTest.php
      - name: Contract tests
        run: vendor/bin/phpunit tests/Unit/HepsiburadaContractTest.php --colors=never
      - name: Static analysis
        run: vendor/bin/phpstan analyse app/Modules/Commerce/ChannelCenterService.php app/Modules/Commerce/Providers/Hepsiburada/HepsiburadaClient.php --no-progress
      - name: Commit implementation and self clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Modules/Commerce/ChannelCenterService.php config/commerce.php tests/Unit/HepsiburadaContractTest.php
          git rm scripts/ci/m18_hb_connect.py .github/workflows/m18-hb-connect.yml
          git commit -m 'feat(m18-hb): wire Hepsiburada connection test'
          git push origin HEAD:feat/m18-hepsiburada
