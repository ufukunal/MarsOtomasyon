name: UAT - Build and Offline Runtime Verification
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.uat'
      - '.dockerignore'
      - 'compose.uat.yml'
      - '.github/workflows/uat-container-build.yml'
      - 'scripts/ci/uat-container-smoke.sh'
      - 'scripts/ci/v4-remote-preflight.php'
      - 'ops/uat-login-only-preview.sh'
      - 'ops/uat-lab-postgres-init.sh'
      - 'ops/uat-lab-start.sh'
      - 'compose.uat.lab.yml'
      - 'app/Actions/Periods/CreatePeriod.php'
      - 'app/Livewire/Pages/Setup/CompanyWizard.php'
      - 'config/operations.php'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mars-uat-container-build
  cancel-in-progress: true
jobs:
  build-and-verify:
    name: GitHub-hosted - UAT Docker image validation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_TAG: mars-uat-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Docker engine is available
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v docker >/dev/null || { echo "BLOCKED: Docker CLI not installed" >&2; exit 77; }
          docker info >/dev/null || { echo "BLOCKED: Docker Engine unavailable" >&2; exit 77; }
          docker compose version
      - name: Check UAT runtime scripts syntax
        run: bash -n ops/uat-preflight.sh ops/uat-login-only-preview.sh ops/uat-lab-postgres-init.sh ops/uat-lab-start.sh scripts/ci/uat-container-smoke.sh
      - name: Validate dedicated UAT Compose without starting database services
        shell: bash
        env:
          MARS_UAT_SHA: ${{ github.sha }}
          MARS_UAT_PG_OWNER_PASSWORD: ci_owner_not_real
          MARS_UAT_PG_APP_PASSWORD: ci_app_not_real
          MARS_UAT_VALKEY_PASSWORD: ci_valkey_not_real
          MARS_UAT_APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose -f compose.uat.lab.yml config --quiet
      - name: Build disposable UAT image without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file Dockerfile.uat --tag "$IMAGE_TAG" .
      - name: Verify dedicated UAT writable directories as unprivileged PHP user
        shell: bash
        env:
          MARS_UAT_SHA: ${{ github.sha }}
          MARS_UAT_PG_OWNER_PASSWORD: ci_owner_not_real
          MARS_UAT_PG_APP_PASSWORD: ci_app_not_real
          MARS_UAT_VALKEY_PASSWORD: ci_valkey_not_real
          MARS_UAT_APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -Eeuo pipefail
          # Run the real read-only Compose service; no PostgreSQL or Valkey started.
          docker tag "$IMAGE_TAG" "ghcr.io/ufukunal/marsotomasyon:uat-$GITHUB_SHA"
          docker compose -f compose.uat.lab.yml --profile application \
            run --rm -T --no-deps --entrypoint sh web -ec '
              test "$(id -u)" = 33
              test -w /var/www/html/bootstrap/cache
              test -w /var/www/html/storage/framework/cache
              touch /var/www/html/bootstrap/cache/.uat-ci-write-check
              touch /var/www/html/storage/framework/cache/.uat-ci-write-check
              php artisan --version >/dev/null
              echo "PASS: Compose Laravel writable paths and artisan bootstrap"
            '
      - name: Exercise PHP, Laravel routes and assets with network disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci/uat-container-smoke.sh "$IMAGE_TAG"
      - name: Clean up tagged CI image (never prune shared Docker state)
        if: always()
        shell: bash
        run: |
          docker image rm "${IMAGE_TAG}" >/dev/null 2>&1 || true
