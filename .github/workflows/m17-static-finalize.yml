name: M17 Static Finalize

on:
  push:
    branches: [feat/m17-commerce]
    paths:
      - '.github/workflows/m17-static-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m17-commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Patch final PHPStan contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/Modules/Commerce/ChannelCenterService.php')
          s = p.read_text()
          old = """        $connection = DB::table('integration_connections')\n            ->where('company_id', $companyId)\n            ->where('public_id', $publicId)\n            ->where('status', 'active')\n            ->first();\n        if ($connection === null) {\n"""
          new = """        $connection = DB::table('integration_connections')\n            ->where('company_id', $companyId)\n            ->where('public_id', $publicId)\n            ->where('status', 'active')\n            ->first();\n        /** @var object{id:int,provider:string,base_url:mixed,credentials_ciphertext:mixed,financial_mode:string,default_account_id:mixed,clearing_account_id:mixed}|null $connection */\n        if ($connection === null) {\n"""
          if old not in s:
              raise SystemExit('connection pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/Modules/Operations/ChannelDomainSync.php')
          s = p.read_text()
          old = """    /**\n     * @param  array<string,mixed>  $payload\n     */\n    /** @return object{id:int,company_id:int,connection_id:int,external_order_id:string,imported_at:mixed} */\n    private function upsertInbox(\n"""
          new = """    /**\n     * @param  array<string,mixed>  $payload\n     * @return object{id:int,company_id:int,connection_id:int,external_order_id:string,imported_at:mixed}\n     */\n    private function upsertInbox(\n"""
          if old not in s:
              raise SystemExit('upsertInbox docblock pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          vendor/bin/pint app/Modules/Commerce/ChannelCenterService.php app/Modules/Operations/ChannelDomainSync.php
          vendor/bin/phpstan analyse app/Modules/Commerce app/Modules/Operations/ChannelDomainSync.php app/Modules/Operations/ChannelService.php --no-progress
          rm -f ci-diagnostics/m17-core-probe-2.txt
          rm -f .github/workflows/m17-core-probe-2.yml
          rm -f .github/workflows/m17-static-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(m17): finalize commerce static contracts"
          git push origin HEAD:feat/m17-commerce
