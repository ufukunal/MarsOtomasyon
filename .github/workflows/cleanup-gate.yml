name: Cleanup Gate

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - run: echo "repository cleanup gate - quality"

  postgres-tests:
    name: postgres-tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "repository cleanup gate - postgres-tests"

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "repository cleanup gate - browser-smoke"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - run: echo "repository cleanup gate - security"
