name: TEST V4 - Isolated Performance Microbenchmarks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-v4-performance-kickoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-performance:
    name: R1-R4 - bounded offline import and money performance
    runs-on: [self-hosted, Linux, mars-ubuntu]
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MARS_TEST_EXECUTION_APPROVED: MARS_V4_EXECUTION_APPROVED
      MARS_PERFORMANCE_TESTS_APPROVED: I_APPROVE_LOCAL_BENCHMARK
    steps:
      - uses: actions/checkout@v4
      - name: Choose PHP
        run: bash scripts/ci/select-php.sh
      - name: Create runner-only Laravel .env
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Replace data-service hosts with non-routable offline test address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('phpunit.xml');s=p.read_text()
          assert s.count('value="mars-prod-1.taila20365.ts.net"') == 2
          s=s.replace('value="mars-prod-1.taila20365.ts.net"', 'value="192.0.2.1"')
          s=s.replace('name="DB_PORT" value="55432"','name="DB_PORT" value="9"')
          s=s.replace('name="REDIS_PORT" value="6379"','name="REDIS_PORT" value="9"')
          p.write_text(s)
          PY
      - name: Execute bounded V4 performance tests (no external DB access)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/test-v4
          timeout 400s bash scripts/ci/test-v4.sh performance 2>&1 | tee artifacts/test-v4/performance.log
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-performance-${{ github.run_id }}
          path: artifacts/test-v4/
          retention-days: 14
          if-no-files-found: ignore
