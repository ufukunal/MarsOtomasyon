name: M0 PostgreSQL Observer

on:
  workflow_run:
    workflows: [Foundation]
    types: [completed]

permissions:
  contents: write

jobs:
  record-green-gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record successful PostgreSQL gate
        shell: bash
        run: |
          mkdir -p .ci
          printf 'Foundation PostgreSQL 18 gate passed.\n' > .ci/m0-postgresql-green
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/m0-postgresql-green
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record M0 PostgreSQL gate [skip ci]"
          git push origin HEAD:main
