name: UAT - Publish Isolated Preview Image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uat-image-publish.yml'
      - 'Dockerfile.uat'
      - 'compose.uat.yml'
      - 'ops/uat-preview-start.sh'
      - 'docs/isletim/.env.uat.example'
      - 'scripts/ci/v4-remote-preflight.php'
      - 'ops/uat-login-only-preview.sh'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: uat-publish-immutable-image
  cancel-in-progress: false
jobs:
  publish:
    name: Build, smoke, publish private UAT Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TEMP_IMAGE: mars-uat-ci:${{ github.sha }}
      DEST_IMAGE: ghcr.io/ufukunal/marsotomasyon:uat-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build source-pinned application image without environment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f Dockerfile.uat --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$TEMP_IMAGE" .
      - name: Smoke runtime with disabled network and impossible DB endpoints
        run: bash scripts/ci/uat-container-smoke.sh "$TEMP_IMAGE"
      - name: Authenticate to private GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish immutable commit-tagged UAT image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker tag "$TEMP_IMAGE" "$DEST_IMAGE"
          docker push "$DEST_IMAGE"
          docker image inspect "$DEST_IMAGE" --format 'IMAGE_REVISION={{ index .Config.Labels "org.opencontainers.image.revision" }}'
          echo "PRIVATE_UAT_IMAGE=$DEST_IMAGE"
