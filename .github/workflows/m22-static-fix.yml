name: M22 Static Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove redundant list reindexing and helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Modules/Products/Documents/ProductInstallationDocumentService.php')
          s = p.read_text()
          s = s.replace("$imageIds = array_values(array_map(static fn (mixed $id): int => (int) $id, $guide->image_product_file_ids));", "$imageIds = array_map(static fn (mixed $id): int => (int) $id, $guide->image_product_file_ids);")
          s = s.replace("'steps' => array_values($guide->steps),", "'steps' => $guide->steps,")
          s = s.replace("'warnings' => array_values($guide->warnings),", "'warnings' => $guide->warnings,")
          s = s.replace("'tools' => array_values($guide->tools),", "'tools' => $guide->tools,")
          s = s.replace("'parts' => array_values($guide->parts),", "'parts' => $guide->parts,")
          p.write_text(s)
          PY
          rm .github/workflows/m22-static-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(m22): remove redundant list reindexing"
          git push origin HEAD:${{ github.head_ref }}
