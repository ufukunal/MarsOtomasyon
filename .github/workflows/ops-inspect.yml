name: OPS 5-11 - Inventory
on:
  push:
    branches: [ops/maintenance-5-11]
permissions:
  contents: read
jobs:
  inventory:
    name: Read-only system capacity and service inspection
    runs-on: [self-hosted, Linux, mars-ubuntu, mars-r3]
    timeout-minutes: 5
    steps:
      - name: Inspect target read-only
        shell: bash
        env:
          MARS_TEST_SUDO_PASSWORD: ${{ secrets.MARS_TEST_SUDO_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=6 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/mars-known" -o LogLevel=ERROR)
          host=ufuk@100.127.235.30
          ssh "${opts[@]}" "$host" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "=== verified host ==="; hostname
          echo "=== disk blocks ==="; lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS
          echo "=== space ==="; df -hT /
          echo "=== memory ==="; free -h
          echo "=== lvm extents (user) ==="; vgs -o vg_name,vg_size,vg_free || true
          echo "=== root source ==="; findmnt -no SOURCE,FSTYPE /
          echo "=== docker ==="; systemctl is-enabled docker; systemctl is-active docker
          echo "=== docker volumes directories ==="; ls -ld /var/lib/docker /var/lib/docker/volumes 2>/dev/null || true
          echo "=== service binaries ==="; psql --version; docker --version; docker compose version
          echo "=== current test services / TCP ==="; ss -lnt | grep -E ':55432 |:6379 ' || true
          echo "=== automation state ==="; systemctl list-timers --all --no-pager | grep -Ei 'mars|docker' || true
          REMOTE
          test -n "$MARS_TEST_SUDO_PASSWORD"
          printf '%s\n' "$MARS_TEST_SUDO_PASSWORD" | ssh "${opts[@]}" "$host" "sudo -S -p '' vgs --noheadings -o vg_name,vg_size,vg_free"
          printf '%s\n' "$MARS_TEST_SUDO_PASSWORD" | ssh "${opts[@]}" "$host" "sudo -S -p '' lvs --noheadings -o lv_path,lv_size,lv_attr"
          printf '%s\n' "$MARS_TEST_SUDO_PASSWORD" | ssh "${opts[@]}" "$host" "sudo -S -p '' docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
          printf '%s\n' "$MARS_TEST_SUDO_PASSWORD" | ssh "${opts[@]}" "$host" "sudo -S -p '' docker volume ls --format 'table {{.Name}}\t{{.Driver}}'"
          echo 'INVENTORY_COMPLETE'
