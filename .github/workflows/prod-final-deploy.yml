name: Production Final Verification

on:
  push:
    branches:
      - ops/prod-final-deploy-20260913

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, mars, ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact release and seal production marker
        shell: bash
        run: |
          set -Eeuo pipefail
          bootstrap="$(mktemp)"
          trap 'rm -f "$bootstrap"' EXIT
          awk '
            /^          set -Eeuo pipefail$/ { if (!capture) capture=1 }
            capture && /^          setsid ssh / { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/diagnose-pr.yml > "$bootstrap"
          grep -Fq 'export SSH_ASKPASS=' "$bootstrap"
          source "$bootstrap"
          setsid ssh -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 ufuk@mars-prod.taila20365.ts.net 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/marsotomasyon
          RELEASE=6e5a91b74f1bac3fede949f8479b17367e04c71c
          TAG=release-${RELEASE:0:12}
          REL="$ROOT/.mars-releases/$RELEASE"
          ENV="$ROOT/.env.production"
          export MARS_ENV_FILE="$ENV" MARS_IMAGE_TAG="$TAG"
          COMPOSE=(docker compose --env-file "$ENV" -f "$REL/docker-compose.production.yml")

          test -d "$REL"
          test "$(git -C "$REL" rev-parse HEAD)" = "$RELEASE"
          test -z "$(git -C "$REL" status --porcelain)"

          TARGET_APP_ID="$(docker image inspect "marsotomasyon-app:$TAG" --format '{{.Id}}')"
          TARGET_WEB_ID="$(docker image inspect "marsotomasyon-web:$TAG" --format '{{.Id}}')"
          APP_CID="$(${COMPOSE[@]} ps -q app)"
          WORKER_CID="$(${COMPOSE[@]} ps -q worker)"
          SCHED_CID="$(${COMPOSE[@]} ps -q scheduler)"
          WEB_CID="$(${COMPOSE[@]} ps -q web)"
          test -n "$APP_CID"
          test -n "$WORKER_CID"
          test -n "$SCHED_CID"
          test -n "$WEB_CID"
          test "$(docker inspect "$APP_CID" --format '{{.Image}}')" = "$TARGET_APP_ID"
          test "$(docker inspect "$WORKER_CID" --format '{{.Image}}')" = "$TARGET_APP_ID"
          test "$(docker inspect "$SCHED_CID" --format '{{.Image}}')" = "$TARGET_APP_ID"
          test "$(docker inspect "$WEB_CID" --format '{{.Image}}')" = "$TARGET_WEB_ID"
          test "$(docker inspect "$APP_CID" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$WORKER_CID" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$SCHED_CID" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$WEB_CID" --format '{{.State.Running}}')" = true

          "${COMPOSE[@]}" exec -T app php artisan mars:ops-status </dev/null
          WORKSPACE_ROUTES="$(${COMPOSE[@]} exec -T app php artisan route:list --path=workspace </dev/null)"
          printf '%s\n' "$WORKSPACE_ROUTES" | grep -q 'workspace'

          APP_URL_VALUE="$(${COMPOSE[@]} exec -T app sh -lc 'printf %s "$APP_URL"' </dev/null)"
          APP_HOST="$(printf '%s' "$APP_URL_VALUE" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
          test -n "$APP_HOST"

          LOGIN_IP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login)"
          LOGIN_HOST_CODE="$(curl -sS -H "Host: $APP_HOST" -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login)"
          WORKSPACE_IP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/workspace)"
          WORKSPACE_HOST_CODE="$(curl -sS -H "Host: $APP_HOST" -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/workspace)"
          test "$LOGIN_IP_CODE" = 200
          test "$LOGIN_HOST_CODE" = 200
          case "$WORKSPACE_IP_CODE" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac
          case "$WORKSPACE_HOST_CODE" in 200|301|302|303|307|308) ;; *) exit 1 ;; esac

          POSTGRES_CID="$(${COMPOSE[@]} ps -q postgres)"
          VALKEY_CID="$(${COMPOSE[@]} ps -q valkey)"
          test -n "$POSTGRES_CID"
          test -n "$VALKEY_CID"
          POSTGRES_HEALTH="$(docker inspect "$POSTGRES_CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
          VALKEY_HEALTH="$(docker inspect "$VALKEY_CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
          test "$POSTGRES_HEALTH" = healthy
          test "$VALKEY_HEALTH" = healthy

          printf '%s\n' "$RELEASE" > "$ROOT/.mars-production-release"
          test "$(cat "$ROOT/.mars-production-release")" = "$RELEASE"

          echo "PRODUCTION_RELEASE=$RELEASE"
          echo "RELEASE_WORKTREE_SHA=$(git -C "$REL" rev-parse HEAD)"
          echo "RELEASE_WORKTREE_DIRTY=no"
          echo "APP_TARGET_MATCH=yes"
          echo "WORKER_TARGET_MATCH=yes"
          echo "SCHEDULER_TARGET_MATCH=yes"
          echo "WEB_TARGET_MATCH=yes"
          echo "LOGIN_IP_HTTP=$LOGIN_IP_CODE"
          echo "LOGIN_HOST_HTTP=$LOGIN_HOST_CODE"
          echo "WORKSPACE_IP_HTTP=$WORKSPACE_IP_CODE"
          echo "WORKSPACE_HOST_HTTP=$WORKSPACE_HOST_CODE"
          echo "POSTGRES_HEALTH=$POSTGRES_HEALTH"
          echo "VALKEY_HEALTH=$VALKEY_HEALTH"
          echo "PRODUCTION_MARKER=$(cat "$ROOT/.mars-production-release")"
          echo 'ROOT_STATUS_BEGIN'
          git -C "$ROOT" status --porcelain || true
          echo 'ROOT_STATUS_END'
          echo 'SERVICES_BEGIN'
          "${COMPOSE[@]}" ps
          echo 'SERVICES_END'
          REMOTE
