name: SALES-IMP-001 Migration Generate
# SALES-IMP-001 migrations are committed; retained as manual/read-only evidence tooling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-sales-commercial-fulfillment-migrations
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore -m:1

      - name: Verify committed SALES-IMP-001 migrations/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_DIR="src/Mars.Infrastructure/Persistence/Migrations/Sales"
          CORE="$MIG_DIR/20260924152928_SalesImp001CommercialFulfillmentAuthority.cs"
          PROFORMA="$MIG_DIR/20260924161902_SalesImp001ProformaAuthority.cs"

          test -f "$CORE"
          test -f "$MIG_DIR/20260924152928_SalesImp001CommercialFulfillmentAuthority.Designer.cs"
          test -f "$PROFORMA"
          test -f "$MIG_DIR/20260924161902_SalesImp001ProformaAuthority.Designer.cs"

          grep -F 'name: "quotes"' "$CORE"
          grep -F 'name: "sales_orders"' "$CORE"
          grep -F 'name: "dispatches"' "$CORE"
          grep -F 'name: "sales_invoices"' "$CORE"
          grep -F 'name: "proformas"' "$PROFORMA"
          grep -F 'name: "proforma_lines"' "$PROFORMA"

          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
