name: SALES-IMP-001 Migration Generate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sales-migration-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: generate-sales-proforma-migration
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore

      - name: Generate additive Proforma migration
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          test -f src/Mars.Infrastructure/Persistence/Migrations/Sales/20260924152928_SalesImp001CommercialFulfillmentAuthority.cs

          dotnet tool run dotnet-ef migrations add SalesImp001ProformaAuthority \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build \
            --output-dir Persistence/Migrations/Sales

          git status --short
          git diff --check

      - name: Commit generated migration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Mars.Infrastructure/Persistence/Migrations/Sales \
            src/Mars.Infrastructure/Persistence/Migrations/Foundation/MarsDbContextModelSnapshot.cs
          git diff --cached --quiet && { echo "No migration changes generated."; exit 1; }
          git commit -m "feat: add SALES-IMP-001 Proforma migration"
          git pull --rebase origin main
          git push origin HEAD:main
