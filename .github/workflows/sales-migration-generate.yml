name: SALES-IMP-001 Migration Generate
# SALES-IMP-001 migration is committed; generator retained as manual/read-only evidence tool.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: verify-sales-commercial-fulfillment-migration
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore

      - name: Verify committed SALES-IMP-001 migration/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_DIR="src/Mars.Infrastructure/Persistence/Migrations/Sales"
          MIG_FILE="$MIG_DIR/20260924152928_SalesImp001CommercialFulfillmentAuthority.cs"

          test -f "$MIG_FILE"
          test -f "$MIG_DIR/20260924152928_SalesImp001CommercialFulfillmentAuthority.Designer.cs"
          grep -F 'name: "quotes"' "$MIG_FILE"
          grep -F 'name: "quote_revisions"' "$MIG_FILE"
          grep -F 'name: "quote_lines"' "$MIG_FILE"
          grep -F 'name: "sales_orders"' "$MIG_FILE"
          grep -F 'name: "sales_order_versions"' "$MIG_FILE"
          grep -F 'name: "sales_order_lines"' "$MIG_FILE"
          grep -F 'name: "dispatches"' "$MIG_FILE"
          grep -F 'name: "dispatch_lines"' "$MIG_FILE"
          grep -F 'name: "sales_invoices"' "$MIG_FILE"
          grep -F 'name: "sales_invoice_lines"' "$MIG_FILE"

          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
