name: Temp M18 Connection Shape

on:
  push:
    branches:
      - tmp-m18-connection-shape

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-m18-connection-shape
      - name: Assert connection object shape
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/Modules/Commerce/MarketplacePack/MarketplacePackService.php')
          text = path.read_text()
          marker = '        /** @var object{id:mixed,company_id:mixed,provider:mixed,credentials_ciphertext:mixed}|null $connection */\n'
          needle = "    private function connection(int $companyId, string $publicId): object\n    {\n        $connection = DB::table('integration_connections')\n"
          replacement = "    private function connection(int $companyId, string $publicId): object\n    {\n" + marker + "        $connection = DB::table('integration_connections')\n"
          if marker not in text:
              if needle not in text:
                  raise SystemExit('connection query marker not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name ufukunal
          git config user.email ufuk@ufukunal.com.tr
          git add app/Modules/Commerce/MarketplacePack/MarketplacePackService.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(m18): assert marketplace connection shape"
          git push origin HEAD:tmp-m18-connection-shape
