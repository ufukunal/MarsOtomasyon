name: WAREHOUSE-IMP-001 Sales Allocation Migration Verify
# Migration is committed; retained as manual/read-only evidence tooling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-sales-dispatch-source-allocation-migration
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select writable .NET install directory
        shell: bash
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore src/Mars.Infrastructure/Mars.Infrastructure.csproj
          dotnet build src/Mars.Infrastructure/Mars.Infrastructure.csproj --configuration Release --no-restore -m:1

      - name: Verify committed Sales source allocation migration/model
        shell: bash
        env:
          MARS_MIGRATION_CONNECTION_STRING: "Host=localhost;Database=mars_design_time_probe"
        run: |
          set -euo pipefail
          MIG_FILE="src/Mars.Infrastructure/Persistence/Migrations/Sales/20260924223900_WarehouseImp001SalesDispatchSourceAllocations.cs"

          test -f "$MIG_FILE"
          grep -F 'name: "dispatch_source_allocations"' "$MIG_FILE"

          python3 - "$MIG_FILE" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          up = text.split("protected override void Up", 1)[1].split("protected override void Down", 1)[0]
          forbidden = ("DropTable(","DropColumn(","DropSchema(","RenameTable(","RenameColumn(","AlterColumn(","DeleteData(","migrationBuilder.Sql(")
          hits = [token for token in forbidden if token in up]
          if hits:
              raise SystemExit(f"Non-additive Up(): {hits}")
          print("PASS_SALES_SOURCE_ALLOCATION_MIGRATION_UP=ADDITIVE")
          PY

          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --startup-project src/Mars.Infrastructure/Mars.Infrastructure.csproj \
            --configuration Release \
            --no-build
