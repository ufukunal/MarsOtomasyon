name: Diagnose M9 M11

on:
  push:
    branches: [fix/m9-m11-finalize]

permissions:
  contents: write

jobs:
  patch-final-fixture:
    if: ${{ !contains(github.event.head_commit.message, '[fixture-cost-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m9-m11-finalize
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Align purchase return receipt cost with source order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/Integration/PurchaseReturns/PurchaseReturnTest.php')
          text = path.read_text()
          old = """        'rejected_quantity' => '0.000000',
        'provisional_unit_cost' => '100.000000',
        'note' => null,
"""
          new = """        'rejected_quantity' => '0.000000',
        'provisional_unit_cost' => $changeOrderTermsBeforeFinalize ? '90.000000' : '100.000000',
        'note' => null,
"""
          if old not in text:
              raise SystemExit('purchase return goods receipt cost fixture marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          vendor/bin/pint tests/Integration/PurchaseReturns/PurchaseReturnTest.php
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name ufukunal
          git config user.email ufuk@ufukunal.com.tr
          git add tests/Integration/PurchaseReturns/PurchaseReturnTest.php
          git commit -m "test: align purchase return receipt cost with source order [fixture-cost-fixed]"
          git push origin HEAD:fix/m9-m11-finalize
