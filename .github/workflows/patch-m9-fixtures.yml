name: Patch M9 Fixtures

on:
  push:
    branches: [fix/m9-m11-finalize]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pint-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m9-m11-finalize
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format lifecycle regression fixtures
        run: |
          vendor/bin/pint \
            tests/Integration/GoodsReceipts/GoodsReceiptCostAdjustmentTest.php \
            tests/Integration/GoodsReceipts/GoodsReceiptQualityReclassificationTest.php \
            tests/Integration/GoodsReceipts/GoodsReceiptTest.php \
            tests/Integration/PurchaseOrders/M9CompletionGuardTest.php \
            tests/Integration/PurchaseReturns/PurchaseReturnTest.php \
            tests/Integration/SupplierInvoices/SupplierInvoiceTest.php
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name ufukunal
          git config user.email ufuk@ufukunal.com.tr
          git add tests/Integration/GoodsReceipts tests/Integration/PurchaseOrders/M9CompletionGuardTest.php tests/Integration/PurchaseReturns/PurchaseReturnTest.php tests/Integration/SupplierInvoices/SupplierInvoiceTest.php
          git commit -m "style: format m9 lifecycle fixtures [pint-formatted]"
          git push origin HEAD:fix/m9-m11-finalize
