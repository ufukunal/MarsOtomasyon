openapi: 3.1.0
info:
  title: Mars Reference API
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string }
            message: { type: string }
security:
  - BearerToken: []
paths:
  /reference/ping:
    get:
      summary: Validate token and API version
      responses:
        '200': { description: OK }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
  /reference/echo:
    post:
      summary: Idempotent reference write contract
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '409': { description: Idempotency conflict }
        '422': { description: Validation error }
        '429': { description: Rate limited }
  /scanner/enroll:
    post:
      security: []
      summary: Exchange one-time enrollment token for scanner agent credentials
      responses:
        '201': { description: Enrolled }
  /scanner/enrollments:
    post:
      summary: Create one-time scanner enrollment credential
      responses:
        '201': { description: Created }
  /scanner/agents/{agent}/jobs:
    post:
      summary: Queue an idempotent scanner job
      parameters:
        - in: path
          name: agent
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Queued }
