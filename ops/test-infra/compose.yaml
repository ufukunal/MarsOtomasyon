name: mars-test-services
services:
  postgres:
    image: postgres:16
    container_name: mars-test-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: mars_test
      POSTGRES_PASSWORD: ${MARS_PG_PASSWORD:?Missing PostgreSQL password}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "max_connections=200"]
    ports:
      - "${MARS_BIND_IP:?Missing Tailscale IP}:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars_test -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  valkey:
    image: valkey/valkey:8-alpine
    container_name: mars-test-valkey
    restart: unless-stopped
    environment:
      MARS_VALKEY_PASSWORD: ${MARS_VALKEY_PASSWORD:?Missing Valkey password}
    command:
      - /bin/sh
      - -ec
      - |
        exec valkey-server --appendonly yes --requirepass "$$MARS_VALKEY_PASSWORD"
    ports:
      - "${MARS_BIND_IP:?Missing Tailscale IP}:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$MARS_VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
  valkey_data:
