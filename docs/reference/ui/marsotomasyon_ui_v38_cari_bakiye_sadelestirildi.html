<script id="akinsoft-field-port-preview-js">
(function(){
  const A='AKINSOFT alan envanterinden aktarıldı';
  const banner=()=>`<div class="aki-source-banner"><span class="tag">PREVIEW</span><b>${A}</b><span>· mevcut MarsOtomasyon V16.3 görünümü korunuyor</span></div>`;
  const opt=(arr,val)=>arr.map(x=>`<option ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('');
  function f(label,type='text',value='',o={}){
    let cls='aki-field '+(o.full?'full ':o.span===2?'span2 ':o.span===3?'span3 ':'');
    let req=o.required?'<span class="req">*</span>':'';
    let control='';
    if(type==='select') control=`<select class="select">${opt(o.options||[value||'Seçiniz'],value)}</select>`;
    else if(type==='textarea') control=`<textarea class="textarea" placeholder="${esc(o.placeholder||'')}">${esc(value||'')}</textarea>`;
    else if(type==='checkbox') control=`<label class="aki-check"><input type="checkbox" ${value?'checked':''}> ${esc(o.checkText||'Evet')}</label>`;
    else if(type==='file') control=`<input class="input" type="file" ${o.accept?`accept="${esc(o.accept)}"`:''}>`;
    else control=`<input class="input" type="${type==='date'?'date':type==='time'?'time':type==='number'?'number':'text'}" value="${esc(value??'')}" placeholder="${esc(o.placeholder||'')}" ${o.readonly?'readonly':''}>`;
    return `<div class="${cls.trim()}"><label>${esc(label)} ${req}</label>${control}${o.help?`<div class="aki-help">${esc(o.help)}</div>`:''}</div>`;
  }

  function contactOther(){return banner()+`<div class="aki-sections">

  </div>`}
  function contactTab(tab){
    if(tab==='Yetkililer')return banner()+table(['İsim','Pozisyon','Dahili Numarası','Cep Telefon Numarası','E-Posta Adresi','Departman','Kayıt Durumu','Aksiyon']);
    if(tab==='Adresler')return banner()+table(['Tanımı','Unvanı/Yetkilisi','Adres','Ülke','İl','İlçe','Sabit Telefonu','Cep Telefonu','Posta Kutusu','Aksiyon']);

  function renderContact(c){let n=activeTabs[c.key]||0,tab=c.tabs[n],body=n===0?contactGeneral():contactTab(tab);if(body==null)body=renderTab(c,tab);return pageShell(c,body+formFooter())}
  if(SCREENS.contact_new)SCREENS.contact_new.tabs=['Genel Bilgiler','Diğer Bilgiler'];
  if(SCREENS.contact_detail)SCREENS.contact_detail.tabs=['Genel Bilgiler','Yetkililer','Diğer Bilgiler','Adresler','Notlar','İlişkili Görevler','Açık Kalemler','Ekstre','Dosyalar','Timeline'];

  // ---------- ÜRÜN ----------
  function productGeneral(){return banner()+`<div class="aki-sections">

      f('Ürün Adı','text','',{required:true,span:2}),f('Ürün Yurtdışı Adı','text','',{span:2}),f('Ürün Kodu'),f('Tedarikçi Ürün Kodu'),f('Marka','select','Seçiniz',{options:['Seçiniz']}),f('Model','select','Seçiniz',{options:['Seçiniz']}),f('Birim','select','Adet',{required:true,options:['Adet']}),f('Barkodu'),f('Barkod Tipi','select','Yok',{options:['Yok','EAN-13','EAN-8']}),f('Stok Tipi','select','Ürün',{required:true,options:['Ürün','Takip Edilmeyen Ürün','Hizmet']}),f('e-Ticaret','select','Pasif',{options:['Pasif','Aktif']}),f('Durumu','select','Aktif',{options:['Aktif','Pasif']})

  if(SCREENS.product_detail)SCREENS.product_detail.tabs=['Genel Bilgiler','Açıklama/Resim','Diğer Bilgiler','Tedarikçiler','Fiyatlar','Stok','Hareketler','Dosyalar','Timeline'];

  // ---------- BELGE FORMLARI: SATIŞ / SATINALMA ----------
  const SALES_DOCS=new Set(['quotation','sales_order','sales_invoice','proforma']);
  const PURCHASE_DOCS=new Set(['purchase_order','supplier_invoice']);
  function voucherInfo(c){
    const isPurchase=PURCHASE_DOCS.has(c.doc_kind);
    let extra='';
    if(c.doc_kind==='quotation')extra=sec('Teklif Bilgileri',[f('Teklif Durumu','select','Beklemede',{options:['Beklemede','Onaylandı','Sipariş Verildi','Muhasebelendi','Arşiv','İptal']}),f('Geçerlilik Süresi','number','30'),f('Teklif Onay Tarihi','date',''),f('Teslim Süresi (Gün)','number','')]);
    if(c.doc_kind==='sales_order'||c.doc_kind==='purchase_order')extra=sec('Sipariş Bilgileri',[f('Sipariş Durumu','select','Beklemede',{options:['Beklemede','Onaylandı','Muhasebelendi','Arşiv','İptal']}),f('Teslim Zamanı','date',''),f('Teklif Numarası')]);
    return banner()+`<div class="aki-sections">
      ${sec('Belge Bilgileri',[f('Şube','select','MERKEZ',{options:['MERKEZ']}),f('Seri / Evrak No'),f('Fiyat Grubu','select','Varsayılan Satış Fiyatı',{options:['Varsayılan Satış Fiyatı']}),f('Tarih','date','2026-09-13'),f('Vade','date',''),f('Not','text','',{span:2}),f('Özel Kod'),f('İptal Edildi','checkbox',false,{checkText:'İptal'}),f('İrsaliye Numarası'),f('İrsaliye Tarihi','date','')])}

      ${sec('e-Ticaret',[f('e-Ticaret Sipariş Numarası','text','',{span:2})])}
      ${extra}
    </div>`;
  }
  function voucherNotes(){return banner()+`<div class="aki-sections">${sec('Not Şablonları',[f('Not Şablonu','select','Seçiniz',{options:['Seçiniz']})])}<section class="aki-section"><div class="aki-section-head">Not Bilgileri</div><div class="aki-section-body">${rich('')}</div></section></div>`}
  function voucherOther(){return banner()+`<div class="aki-sections">
    ${sec('İndirim',[f('Kişi/Firma İndirimi Uygula','checkbox',false),f('Kişi/Firma İndirimi','text','0'),f('Ürün İndirimi Uygula','checkbox',false),f('Tutar İskontosu Uygula','checkbox',false),f('Limitli Tevkifat Kullan','checkbox',false)])}

  function voucherProcessInfo(){return banner()+sec('İşlem Bilgileri',[f('KDV','text',''),f('Ek Bilgi 1'),f('Ek Bilgi 2'),f('Ek Bilgi 3'),f('Ek Bilgi 4')])}
  function voucherLast(){return banner()+`<div class="aki-sections">${sec('En Son İşlemler',[f('Kişi/Firma Seçimi','select','Seçiniz',{options:['Seçiniz']})])}${table(['Kişi/Firma','Tarihi','Miktarı','Fiyatı'])}</div>`}
  function relatedTasks(){return banner()+table(['Görev Adı','Durumu','Etiketler','Başlangıç Tarihi','Bitiş Tarihi','Aksiyon'])}

  ['sales_invoice_new','sales_invoice_detail'].forEach(k=>{if(SCREENS[k])SCREENS[k].tabs=['Hareketler','Bilgiler','Notlar','Diğer','İşlem Bilgileri','En Son İşlemler','Satışlar','Alışlar','Ödemeler','Cari Bakiye Etkisi','E-Belge','Düzeltmeler','Dosyalar','PDF','Timeline']});
  ['supplier_invoice_new','supplier_invoice_detail'].forEach(k=>{if(SCREENS[k])SCREENS[k].tabs=['Hareketler','Bilgiler','Notlar','Diğer','İşlem Bilgileri','En Son İşlemler','Satışlar','Alışlar','3-Way Match','Ödemeler','Cari Bakiye Etkisi','Dosyalar','Timeline']});
  ['quote_new','quote_detail'].forEach(k=>{if(SCREENS[k])SCREENS[k].tabs=['Hareketler','Bilgiler','Notlar','Diğer','Revizyonlar','Onaylar','Dosyalar','PDF','Timeline']});
  ['sales_order_new','sales_order_detail','purchase_order_new','purchase_order_detail'].forEach(k=>{if(SCREENS[k])SCREENS[k].tabs=['Hareketler','Bilgiler','Notlar','Diğer','İlişkili Görevler','Dosyalar','Timeline']});

  const oldTabAki=renderTab;
  renderTab=function(c,tab){
    if(c&&c.doc_kind&&(SALES_DOCS.has(c.doc_kind)||PURCHASE_DOCS.has(c.doc_kind))){

      if(tab==='Satışlar'||tab==='Alışlar')return banner()+table(['Kişi/Firma','Tarihi','Miktarı','Fiyatı']);

    return oldTabAki(c,tab);
  };

  const oldFormAki=renderForm;
  renderForm=function(c){
    if(c.key==='contact_new'||c.key==='contact_detail')return renderContact(c);

  // Kaynakta ortak belge satırı içinde para birimi/tevkifat bilgisi bulunduğu için kolonları önizlemede genişlet.
  const oldDocAki=renderDocument;

<script id="mars-v16-5-final-fixes-script">
(function(){
  // Menüde aynı route'un iki farklı grupta tekrarlanmasını önle: raporlar kendi grubunda kalır.
  const reportKeys=new Set(['sales_report','purchase_report']);
  MENU.forEach(g=>{if(g.key!=='reports')g.items=(g.items||[]).filter(([r])=>!reportKeys.has(r))});

  // Sipariş satırı bazında sipariş / faturalanan / kalan miktar modeli.
  ['sales_order_detail','purchase_order_detail'].forEach(k=>{
    const c=SCREENS[k];if(c&&!c.tabs.includes('Faturalama'))c.tabs.splice(Math.min(4,c.tabs.length),0,'Faturalama');
  });
  const invoiceStoreKey='mars_v165_order_invoice_progress';
  function readInvoiceProgress(){try{return JSON.parse(localStorage.getItem(invoiceStoreKey)||'{}')}catch(e){return {}}}
  function writeInvoiceProgress(v){localStorage.setItem(invoiceStoreKey,JSON.stringify(v))}
  function orderProgress(c){
    const oid=idParam()||effectiveTitle(c).split('·').pop().trim(),purchase=c.key==='purchase_order_detail';
    const base=purchase?[{code:'KRST-K9-14',name:'K9 Kristal 14 mm Şeffaf',ordered:600},{code:'MET-GOV-80',name:'Ø80 Gold Kaplama Gövde',ordered:20},{code:'DUY-E14',name:'E14 Seramik Duy',ordered:80}]:[{code:'AVZ-2032',name:'Aurora 80 Gold 3 Katlı Avize',ordered:10},{code:'APL-0410',name:'Mira Gold Duvar Apliği',ordered:6}];
    const store=readInvoiceProgress(),saved=store[oid]||{};
    const rows=base.map(x=>{const invoiced=Math.min(x.ordered,Math.max(0,Number(saved[x.code]||0)));return {...x,invoiced,remaining:x.ordered-invoiced}});
    const total=rows.reduce((a,x)=>a+x.ordered,0),inv=rows.reduce((a,x)=>a+x.invoiced,0),rem=rows.reduce((a,x)=>a+x.remaining,0);
    return `<div class="v165-invoice-progress"><div><small>Sipariş Miktarı</small><strong>${total}</strong></div><div><small>Faturalanan</small><strong>${inv}</strong></div><div><small>Kalan</small><strong>${rem}</strong></div></div>
      <div class="notice"><b>Kısmi faturalama:</b> Her satırda sipariş miktarı, faturalanan miktar ve kalan miktar ayrı tutulur. Kalan 0 olduğunda satır tamamlanır.</div>
      <div class="tablecard"><div class="toolbar"><b>${purchase?'Alış':'Satış'} Siparişi Faturalama</b><div class="grow"></div><button class="btn primary" data-action="v165-partial-invoice" data-order="${esc(oid)}">Kısmi Fatura Oluştur</button></div><div class="gridwrap"><table class="v165-order-qty"><thead><tr><th>Ürün Kodu</th><th>Ürün</th><th>Sipariş</th><th>Faturalanan</th><th>Kalan</th><th>Bu Faturada</th><th>Durum</th></tr></thead><tbody>${rows.map(x=>`<tr data-v165-order-line="${esc(x.code)}" data-ordered="${x.ordered}" data-invoiced="${x.invoiced}"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${x.ordered}</td><td>${x.invoiced}</td><td><b>${x.remaining}</b></td><td><input type="number" min="0" max="${x.remaining}" step="1" value="${x.remaining?Math.min(x.remaining,1):0}" ${x.remaining?'':'disabled'}></td><td>${x.remaining?badge('Açık','warn'):badge('Tamamlandı')}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  const renderTabBeforeV165=renderTab;
  renderTab=function(c,tab){if(tab==='Faturalama'&&(c.key==='sales_order_detail'||c.key==='purchase_order_detail'))return orderProgress(c);return renderTabBeforeV165(c,tab)};
  const renderDocumentBeforeV165=renderDocument;
  renderDocument=function(c){
    const tab=(c.tabs||[])[activeTabs[c.key]||0];
    if(tab==='Faturalama'&&(c.key==='sales_order_detail'||c.key==='purchase_order_detail'))return pageShell(c,orderProgress(c));
    return renderDocumentBeforeV165(c);
  };

  // Görünür form alanlarını Save sonrası localStorage'a al; render sonrası geri yükle.
  const DRAFT='mars_v165_route_drafts';
  function drafts(){try{return JSON.parse(localStorage.getItem(DRAFT)||'{}')}catch(e){return {}}}
  function persistVisibleDraft(){
    const root=document.getElementById('main');if(!root)return;const vals=[];
    root.querySelectorAll('input,select,textarea').forEach((el,i)=>{if(el.closest('[data-wsl-mode]'))return;vals.push({i,t:el.tagName,n:el.name||'',v:el.type==='checkbox'?el.checked:el.value,ty:el.type||''})});
    if(!vals.length)return;const d=drafts();d[route]=vals;localStorage.setItem(DRAFT,JSON.stringify(d));
  }
  function restoreVisibleDraft(){const vals=drafts()[route];if(!Array.isArray(vals))return;const els=[...document.querySelectorAll('#main input,#main select,#main textarea')].filter(x=>!x.closest('[data-wsl-mode]'));vals.forEach(x=>{const el=els[x.i];if(!el)return;if(x.ty==='checkbox')el.checked=!!x.v;else if(!el.disabled&&!el.readOnly)el.value=x.v});if(typeof recalcDoc==='function')recalcDoc()}
  const renderBeforeV165Final=render;
  function unlockPartialInvoice(){
    if(!['sales_order_detail','purchase_order_detail'].includes(baseRoute()))return;
    const c=cfg(),tab=(c.tabs||[])[activeTabs[c.key]||0];if(tab!=='Faturalama')return;
    document.querySelectorAll('.v165-order-qty input').forEach(el=>{if(Number(el.max||0)>0){el.disabled=false;el.readOnly=false;el.tabIndex=0}});
  }
  render=function(){const v=renderBeforeV165Final();restoreVisibleDraft();unlockPartialInvoice();return v};

  function pdfAscii(v){return String(v||'').replace(/[çÇğĞıİöÖşŞüÜ]/g,ch=>({'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U'}[ch]||ch)).replace(/[^\x20-\x7E\n]/g,' ')}
  function pdfEsc(v){return pdfAscii(v).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
  function buildTextPdf(title,text){
    const raw=(pdfAscii(title)+'\n\n'+pdfAscii(text)).split(/\r?\n/),lines=[];
    raw.forEach(line=>{let s=line.trimEnd();if(!s){lines.push('');return}while(s.length>92){let cut=s.lastIndexOf(' ',92);if(cut<35)cut=92;lines.push(s.slice(0,cut));s=s.slice(cut).trimStart()}lines.push(s)});
    const pages=[];for(let i=0;i<lines.length;i+=52)pages.push(lines.slice(i,i+52));if(!pages.length)pages.push(['']);
    const pageIds=pages.map((_,i)=>4+i*2),contentIds=pages.map((_,i)=>5+i*2),objects=[];
    objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objects[2]=`<< /Type /Pages /Kids [${pageIds.map(x=>x+' 0 R').join(' ')}] /Count ${pages.length} >>`;
    objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
    pages.forEach((pg,i)=>{
      objects[pageIds[i]]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentIds[i]} 0 R >>`;
      const cmds=['BT','/F1 9 Tf','40 800 Td','12 TL'];pg.forEach((ln,j)=>{cmds.push(`(${pdfEsc(ln)}) Tj`);if(j<pg.length-1)cmds.push('T*')});cmds.push('ET');const stream=cmds.join('\n');objects[contentIds[i]]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
    });
    let pdf='%PDF-1.4\n%MarsOtomasyon\n',offsets=[0];
    for(let i=1;i<objects.length;i++){if(!objects[i])continue;offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`}
    const xref=pdf.length,max=objects.length-1;pdf+=`xref\n0 ${max+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=max;i++)pdf+=(String(offsets[i]||0).padStart(10,'0')+' 00000 n \n');
    pdf+=`trailer\n<< /Size ${max+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return new Blob([pdf],{type:'application/pdf'});
  }
  function downloadCurrentPdf(){
    const title=effectiveTitle(cfg()),text=document.getElementById('main')?.innerText||title,blob=buildTextPdf(title,text),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=title.replace(/[^\p{L}\p{N}]+/gu,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('PDF dosyası oluşturuldu');
  }
  window.marsDownloadCurrentPdf=downloadCurrentPdf;

  document.addEventListener('click',function(e){
    const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;
    if(x==='pdf'){e.preventDefault();e.stopImmediatePropagation();drawer(false);downloadCurrentPdf();return}

  if(requested==='chrome_printing'){route='chrome_printing';if(!worktabs.includes(route))worktabs.push(route);setTimeout(()=>{renderNav();renderTabs();render()},0)}
  else setTimeout(()=>{try{renderNav()}catch(e){}},0);
})();
</script>

<script id="mars-v16-10-simple-package-print-script">
(function(){

    count=Math.max(1,Math.min(200,parseInt(count||1,10)||1));
    const barcode=window.marsChromePrintV169?.code39Svg;
    let pages='';
    for(let i=1;i<=count;i++){

    toast(`${count} koli etiketi hazırlanıyor`);

  }
  function askPackageCount(product){
    modal('Barkod Yazıcıdan Yazdır',`<div class="v1610-pack-form"><label>Koli adedi</label><input id="v1610-package-count" type="number" min="1" max="200" value="1" autofocus><div class="v1610-pack-note">Örnek: 4 girersen 1/4, 2/4, 3/4 ve 4/4 olmak üzere 4 etiket hazırlanır.</div></div>`,'Barkod Yazıcıya Gönder',()=>{
      const n=document.getElementById('v1610-package-count')?.value||1;
      packageLabels(product,n);
    });
    setTimeout(()=>{const i=document.getElementById('v1610-package-count');if(i){i.focus();i.select()}},60);
  }
  window.marsPackagePrintV1610={ask:askPackageCount,print:packageLabels,current:productNow};

  function enforce(){
    if(!SCREENS.product_detail)return;
    SCREENS.product_detail.actions=(SCREENS.product_detail.actions||[]).filter(x=>![
      'Barkod Yazdır','Koli Etiketi','Barkod Yazıcıdan Yazdır','🖨 Barkod Yazıcıdan Yazdır','🖨 Barkod Yazdır'
    ].includes(x));
    const a=SCREENS.product_detail.actions;
    const tech=a.indexOf('Teknik Bilgi Föyü');
    a.splice(tech>=0?tech:Math.max(0,a.length-1),0,'🖨 Barkod Yazdır');
  }
  enforce();

  const oldBusinessV1610=marsApplyBusinessAction;
  marsApplyBusinessAction=function(action){
    if(baseRoute()==='product_detail'&&(action==='Koli Etiketi'||action==='Barkod Yazdır'||action==='Barkod Yazıcıdan Yazdır'||action==='🖨 Barkod Yazıcıdan Yazdır')){askPackageCount(productNow());return}
    return oldBusinessV1610(action);
  };

  const oldChromeRenderer=R.chrome_printing_v169;
  R.chrome_printing_v169=function(){
    const c=window.marsChromePrintV169?.config?.()||{posWidth:'80',company:'Noya Aydınlatma'};
    return `<div class="chrome-print-shell"><div class="chrome-print-note"><b>Basit Chrome baskısı.</b> Koli etiketi için yalnız koli adedini gir. Normal Chrome yazdırma penceresini açar; <b>--kiosk-printing</b> ile varsayılan yazıcıya direkt gönderir.</div><div class="v1610-simple-grid">
      <section class="v1610-simple-card"><div class="v1610-simple-head">Barkod Yazıcı · Koli Etiketi · 100 × 50 mm</div><div class="v1610-simple-body"><div class="v1610-simple-row"><label>Koli adedi</label><input id="v1610-test-count" type="number" min="1" max="200" value="4"><button class="btn primary" data-action="v1610-test-package">🖨 Barkod Yazıcıdan Test</button><button class="btn" data-route="product_detail:AVZ-2032">Ürün Kartına Git</button></div><div class="chrome-print-screen-tip"><b>Normal Chrome:</b> açılan yazdırma ekranında barkod yazıcını seç. <b>--kiosk-printing:</b> varsayılan barkod yazıcısına direkt basar. 4 girersen 1/4, 2/4, 3/4, 4/4 çıkar.</div></div></section>
      <section class="v1610-simple-card"><div class="v1610-simple-head">POS Makbuzu</div><div class="v1610-simple-body"><div class="v1610-simple-row"><label>Kağıt</label><select id="v1610-pos-width"><option value="80" ${String(c.posWidth)==='80'?'selected':''}>80 mm</option><option value="58" ${String(c.posWidth)==='58'?'selected':''}>58 mm</option></select><button class="btn primary" data-action="v1610-test-pos">Test Yazdır</button></div></div></section>
    </div><div style="margin-top:10px" class="chrome-print-code">chrome.exe --kiosk-printing</div></div>`;
  };

  document.addEventListener('click',function(e){
    const a=e.target.closest?.('[data-action]');if(!a)return;
    if(a.dataset.action==='v1610-test-package'){
      e.preventDefault();e.stopImmediatePropagation();
      packageLabels({code:'AVZ-2032',name:'Aurora 80 Gold 3 Katlı Avize',barcode:BAR['AVZ-2032']},document.getElementById('v1610-test-count')?.value||4);return;
    }
    if(a.dataset.action==='v1610-test-pos'){
      e.preventDefault();e.stopImmediatePropagation();
      const width=document.getElementById('v1610-pos-width')?.value||'80';
      window.marsChromePrintV169?.save?.({posWidth:width});
      window.marsChromePrintV169?.pos?.({kind:'Tahsilat Makbuzu',no:'TH0000182',date:'13.09.2026 21:45',contact:'Avize Park',operation:'Nakit Tahsilat',amount:'7000',currency:'TRY',account:'Kasa Merkez',note:''},{posWidth:width});return;
    }
  },true);

  document.title=document.title.replace(/V16\.\d+/,'V16.11');
})();
