<script id="mars-v11-2-master-click-router">
(function(){
  // Bu handler BODY'nin hemen başında kaydedilir.
  // Böylece yıllar içinde eklenmiş eski capture/bubble click handler'ları
  // route ve ana işlem düğmelerini engelleyemez.

  function uiSnapshot(){
    const modalWrap=document.getElementById('modalWrap');
    const drawerEl=document.getElementById('drawer');
    const toastEl=document.getElementById('toast');
    return {
      hash: location.hash,
      route: (typeof route!=='undefined'?route:''),
      modal: !!modalWrap?.classList.contains('open'),
      modalTitle: document.getElementById('modalTitle')?.textContent||'',
      drawer: !!drawerEl?.classList.contains('open'),
      toast: toastEl?.textContent||'',
      toastOpen: !!toastEl?.classList.contains('show'),
      main: document.getElementById('main')?.innerHTML?.length||0
    };
  }

  function changed(a,b){
    return a.hash!==b.hash ||
      a.route!==b.route ||
      a.modal!==b.modal ||
      a.modalTitle!==b.modalTitle ||
      a.drawer!==b.drawer ||
      a.toast!==b.toast ||
      a.toastOpen!==b.toastOpen ||
      a.main!==b.main;
  }

  function rowData(button){
    const tr=button.closest('tr');
    const table=tr?.closest('table');
    if(!tr||!table)return [];
    const heads=[...(table.tHead?.rows?.[0]?.cells||[])].map(c=>(c.innerText||'').trim());
    return [...tr.cells].map((c,i)=>[heads[i]||('Alan '+(i+1)),(c.innerText||'').trim()])
      .filter(([k])=>!/^\s*İşlem\s*$/i.test(k));
  }

  function safeFallback(button){
    const action=button.dataset.action||'';
    const label=(button.innerText||button.textContent||action||'İşlem').trim();

    // Tablo satırları
    if(action==='row-open' || action==='row-actions'){
      const rows=rowData(button);
      if(typeof modal==='function'){
        modal(
          action==='row-open'?'Kayıt Detayı':'Kayıt İşlemleri',
          `<div class="v11-row-modal">${rows.map(([k,v])=>`
            <div><small>${typeof esc==='function'?esc(k):k}</small><b>${typeof esc==='function'?esc(v||'—'):(v||'—')}</b></div>
          `).join('')}</div>`,
          'Kapat'
        );
      }
      return;
    }

    if(action==='excel' || action==='export-csv'){
      if(typeof exportCsv==='function')exportCsv();
      return;
    }
    if(action==='print' || action==='pdf'){
      if(typeof window.print==='function')window.print();
      return;
    }
    if(action==='back'){
      history.back();
      return;
    }
    if(action==='save' || action==='save-new'){
      if(typeof toast==='function')toast(action==='save'?'Kaydedildi':'Kaydedildi · yeni kayıt hazırlandı');
      return;
    }

    // Dead bir buton sessiz kalmasın. Generic FORM açılmaz;
    // yalnız hangi işlemin tasarımının eksik olduğunu açıkça gösterir.
    if(typeof modal==='function'){
      const title = (typeof effectiveTitle==='function' && typeof cfg==='function')
        ? effectiveTitle(cfg()) : 'Ekran';
      modal(
        label || 'İşlem',
        `<div class="notice">
          <b>${typeof esc==='function'?esc(title):title}</b> ekranındaki
          <b>${typeof esc==='function'?esc(label||action):label||action}</b> işlemi tetiklendi.
        </div>
        <p>Bu işlem için alakasız veya rastgele form açılmadı.</p>`,
        'Kapat'
      );
    }
  }

  document.addEventListener('click',function(e){
    // Sekme kapatma: parent data-route çalışmadan önce.
    const close=e.target.closest?.('[data-close-tab]');
    if(close){
      e.preventDefault();
      e.stopImmediatePropagation();
      if(window.marsTabState?.close) window.marsTabState.close(close.dataset.closeTab);
      return;
    }

    // Her data-route tek merkezden çalışır.
    const routeEl=e.target.closest?.('[data-route]');
    if(routeEl){
      e.preventDefault();
      e.stopImmediatePropagation();
      const r=routeEl.dataset.route;
      if(r && typeof navigate==='function')navigate(r);
      return;
    }

    // Tab
    const tab=e.target.closest?.('[data-tab]');
    if(tab){
      e.preventDefault();
      e.stopImmediatePropagation();
      if(typeof activeTabs!=='undefined' && typeof baseRoute==='function'){
        activeTabs[baseRoute()]=Number(tab.dataset.tab)||0;
        if(typeof render==='function')render();
      }
      return;
    }

    // Sol menü grup aç/kapat
    const group=e.target.closest?.('[data-group]');
    if(group){
      e.preventDefault();
      e.stopImmediatePropagation();
      if(typeof openGroups!=='undefined'){
        const k=group.dataset.group;
        openGroups.has(k)?openGroups.delete(k):openGroups.add(k);
        if(typeof renderNav==='function')renderNav();
      }
      return;
    }

    // Üst işlem barı: eski confirmation katmanı artık ilk tıklamayı yutamaz.
    const business=e.target.closest?.('[data-business-action]');
    if(business){
      e.preventDefault();
      e.stopImmediatePropagation();
      const action=business.dataset.businessAction;
      if(typeof marsApplyBusinessAction==='function')marsApplyBusinessAction(action);
      else safeFallback(business);
      return;
    }

    const button=e.target.closest?.('button');
    if(!button)return;
    // Stabilizasyon: gecikmeli ikinci UI/fallback turu kaldırıldı.
    // Görünür butonlar kendi modül handler'ları tarafından ele alınır.
    return;
  },true);
})();
</script>

 return `<aside class="filters" style="${filterVisible?'':'display:none'}"><div class="filterhead">▼ Filtreler</div><div class="filtertabs"><button class="active" data-action="filter-filter-tab">Filtreleme</button><button data-action="filter-sort-tab">Sıralama</button></div><div class="filterbody">${f.map((x,i)=>`<div class="frow"><label>${esc(x)}</label>${/Durum|Tip|Kategori|State|Yön|Onay|Scope/.test(x)?'<select><option>Hepsi</option><option>Aktif</option><option>Bekliyor</option></select>':`<input ${i===0?'data-filter-search':''}>`}</div>`).join('')}</div><div class="filterfoot"><button style="background:var(--orange)" data-action="filter-clear">▣ Temizle</button><button style="background:var(--blue)" data-action="filter-apply">▼ Filtrele</button></div></aside>`;
}
function tableHtml(cols,rows,key){
 tableRows[key]=rows;
 return `<div class="gridwrap"><table><thead><tr>${cols.map((c,i)=>`<th data-sort="${i}">${esc(c)}</th>`).join('')}<th style="width:76px">İşlem</th></tr></thead><tbody data-table-body="${esc(key)}">${rows.map((r,ri)=>`<tr data-row="${ri}" class="${ri===0?'selected':''}">${r.map(c=>`<td>${c}</td>`).join('')}<td><div class="rowactions"><button class="iconbtn" title="Detaya Git" data-action="row-open" data-key="${esc(key)}" data-row="${ri}">↗</button><button class="iconbtn" title="İşlemler" data-action="row-actions" data-key="${esc(key)}" data-row="${ri}">⋯</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function pager(n){return `<div class="pager"><span>Sayfada</span><select><option>50</option><option>100</option></select><span>kayıt göster · ${n} kayıt</span><div class="push"></div><button class="btn" data-action="prev-page">Önceki</button><button class="btn primary" data-action="page-one">1</button><button class="btn" data-action="next-page">Sonraki</button></div>`}

function semanticValue(col,i){
 let p=PRODUCTS[i%PRODUCTS.length],c=CONTACTS[i%CONTACTS.length];
 if(/Ürün Kodu|Mars Ürün/.test(col))return link(p.code,`product_detail:${p.code}`);
 if(/Ürün Adı|^Ürün$/.test(col))return link(p.name,`product_detail:${p.code}`);
 if(/Cari|Müşteri/.test(col))return link(c.company,`contact_detail:${c.code}`);
 if(/Tedarikçi|Lehtar/.test(col))return link(i%2?'Kristal Tedarik Ltd.':'MetalForm Sanayi',`contact_detail:${CONTACTS[(i+1)%CONTACTS.length].code}`);
 if(/Teklif No/.test(col))return link(`TKL-2026-${String(128+i).padStart(5,'0')}`,`quote_detail:TKL-${128+i}`);
 if(/Sipariş No|Mars Sipariş/.test(col))return link(`SIP-2026-${String(481+i).padStart(5,'0')}`,`sales_order_detail:SIP-${481+i}`);
 if(/Fatura No|Fatura$/.test(col))return link(`SF${String(218+i).padStart(7,'0')}`,`sales_invoice_detail:SF${218+i}`);
 if(/^PO No|^PO$/.test(col))return link(`PO-2026-${String(184+i).padStart(5,'0')}`,`purchase_order_detail:PO-${184+i}`);
 if(/GR No|Mal Kabul No/.test(col))return link(`GR-${String(32+i).padStart(6,'0')}`,`goods_receipt_detail:GR-${32+i}`);
 if(/^WO$|Üretim Emri/.test(col))return link(`WO-${String(128+i).padStart(5,'0')}`,`production_order_detail:WO-${128+i}`);
 if(/RMA/.test(col))return link(`RMA-${String(72+i).padStart(6,'0')}`,`rma_detail:RMA-${72+i}`);
 if(/Tutar|Fiyat|Bakiye|Maliyet|Value|Brüt|Net|Gross|Commission|Fee|Kâr|Ciro|Limit|Exposure|Değer/.test(col))return `<span class="money">${money(4200+i*1375)}</span>`;
 if(/Tarih|Vade|Termin|ETD|ETA|Başlangıç|Bitiş|Received|Sonraki|Last|Next/.test(col))return `${String((i%27)+1).padStart(2,'0')}.08.2026`;
 if(/Durum|State|QC|Onay|Sync|Mutabakat|Hold|E-Belge|Result|Dedupe|Processed|Expired/.test(col))return badge(i%4?'Aktif':'Bekliyor',i%4?'':'warn');
 if(/Miktar|Qty|Stok|Rezerve|Kalan|Good|Rework|Scrap|Fire|Output|Komponent|Package|Adedi|Queue|Run/.test(col))return String((i+1)*3);
 if(/Para Birimi/.test(col))return 'TRY';if(/Depo/.test(col))return 'Merkez Depo';if(/Lokasyon/.test(col))return 'A-03-02';if(/Şube/.test(col))return 'MERKEZ';
 return ['Standart','MERKEZ','Noya','Aktif','A-03-02','TRY'][i%6];
}
function makeRows(cols,n=18){return Array.from({length:n},(_,i)=>cols.map(c=>semanticValue(c,i)))}
function detailRouteFor(c,ri){
 if(!c.detail)return null;let d=c.detail;
 if(d==='product_detail')return `product_detail:${PRODUCTS[ri%PRODUCTS.length].code}`;
 if(d==='contact_detail')return `contact_detail:${CONTACTS[ri%CONTACTS.length].code}`;
 if(d==='quote_detail')return `quote_detail:TKL-2026-${128+ri}`;
 if(d==='sales_order_detail')return `sales_order_detail:SIP-2026-${481+ri}`;
 if(d==='sales_invoice_detail')return `sales_invoice_detail:SF${218+ri}`;
 if(d==='purchase_order_detail')return `purchase_order_detail:PO-2026-${184+ri}`;
 if(d==='goods_receipt_detail')return `goods_receipt_detail:GR-${32+ri}`;
 if(d==='supplier_invoice_detail')return `supplier_invoice_detail:AF${74+ri}`;

function renderList(c){
 let rows;
 if(c.key==='contact_list'||c.key==='balances'){
  rows=CONTACTS.map((x,i)=>c.columns.map(col=>{
   if(/Cari Kodu|Kişi\/Firma Kodu/.test(col))return link(x.code,`contact_detail:${x.code}`);
   if(/İşletme Adı/.test(col))return link(x.company,`contact_detail:${x.code}`);
   if(/^İsim$/.test(col))return link(x.name,`contact_detail:${x.code}`);
   if(/Tip/.test(col))return x.type;if(/^İl$/.test(col))return x.city;if(/Vergi/.test(col))return x.tax;if(/Telefon/.test(col))return x.phone;if(/E-Posta/.test(col))return x.mail;
   if(/Bakiye/.test(col))return `<span class="${x.balance<0?'debit':'credit'}">${money(Math.abs(x.balance))} ${x.balance<0?'B':'A'}</span>`;
   if(/Risk/.test(col))return badge(Math.abs(x.balance)>250000?'Limit Aşımı':'Normal',Math.abs(x.balance)>250000?'red':'');
   if(/Durum/.test(col))return badge('Aktif');return semanticValue(col,i)
  }));
 } else if(c.key==='product_list'||c.key==='stock_status'){
  rows=PRODUCTS.map((p,i)=>c.columns.map(col=>{
   if(/Ürün Kodu/.test(col))return link(p.code,`product_detail:${p.code}`);if(/Ürün Adı/.test(col))return link(p.name,`product_detail:${p.code}`);
   if(/Marka/.test(col))return p.brand;if(/Kategori/.test(col))return p.cat;if(/Birim/.test(col))return p.unit;if(/Satış Fiyatı/.test(col))return money(p.price);
   if(/Kullanılabilir/.test(col))return p.stock;if(/Rezerve/.test(col))return p.reserved;if(/Karantina/.test(col))return p.quarantine;if(/^Toplam$/.test(col))return p.stock+p.reserved+p.quarantine;
   if(/Durum/.test(col))return badge(p.stock<5?'Kritik':'Aktif',p.stock<5?'warn':'');return semanticValue(col,i)
  }));
 } else rows=makeRows(c.columns,24);
 let add=c.create?`<button class="btn primary" data-route="${esc(c.create)}">＋ Yeni</button>`:'';
 return pageShell(c,`<div class="listlayout">${filtersHtml(c.filters)}<div class="tablecard"><div class="toolbar"><button class="btn" data-action="filter-toggle">▼ Filtreler</button><span class="sub">${rows.length} kayıt</span><div class="grow"></div>${add}<button class="btn" data-action="excel">▧ Excel</button><button class="btn" data-action="columns">☷ Kolonlar</button></div>${tableHtml(c.columns,rows,c.key)}${pager(rows.length)}</div></div>`);
}

function entityAdjustedSections(c){
 let sections=JSON.parse(JSON.stringify(c.sections||[])),id=idParam();
 if(c.key==='product_detail'&&id){
  let p=PRODUCTS.find(x=>x.code===id);if(p){
   sections.forEach(s=>s[1].forEach(f=>{
    if(f[0]==='Ürün Kodu')f[2]=p.code;if(f[0]==='Ürün Adı')f[2]=p.name;if(f[0]==='Marka')f[2]=p.brand;
   }));
  }
 }
 if(c.key==='contact_detail'&&id){
  let x=CONTACTS.find(y=>y.code===id);if(x){
   sections.forEach(s=>s[1].forEach(f=>{
    if(f[0]==='Kişi/Firma Kodu')f[2]=x.code;if(f[0]==='İsim / Yetkili')f[2]=x.name;if(f[0]==='İşletme Adı')f[2]=x.company;

   }));
  }
 }
 return sections;
}

function recalcDoc(){
 let table=document.querySelector('[data-doc-table]');if(!table)return;
 let sub=0,disc=0,vat=0;
 [...table.tBodies[0].rows].forEach(r=>{
  let q=+r.querySelector('[data-q]')?.value||0,p=+r.querySelector('[data-p]')?.value||0,v=+r.querySelector('[data-v]')?.value||0,d=+r.querySelector('[data-d]')?.value||0;
  let gross=q*p,di=gross*d/100,net=gross-di,tax=net*v/100;sub+=gross;disc+=di;vat+=tax;r.querySelector('[data-line-total]').textContent=money(net+tax);
 });
 document.querySelector('[data-subtotal]')&&(document.querySelector('[data-subtotal]').textContent=money(sub));
 document.querySelector('[data-discount]')&&(document.querySelector('[data-discount]').textContent=money(disc));
 document.querySelector('[data-vat]')&&(document.querySelector('[data-vat]').textContent=money(vat));
 document.querySelector('[data-grand]')&&(document.querySelector('[data-grand]').textContent=money(sub-disc+vat));
}

<script id="mars-v7-interaction-hardening">
/* MarsOtomasyon UI V7.1 interaction hardening.
   This layer intentionally intercepts all previously-fallback-only buttons
   and turns top-level business actions into real prototype state transitions. */

const MARS_V71_CUSTOM_ACTIONS = new Set([
 'approve-match','copy-link','create-from-statement','filter-sort-tab','filter-filter-tab',
 'job-complete','job-pause','job-start','migration-dryrun','mrp-run','next-page','page-one','prev-page',
 'portal-approve','portal-comment','portal-revision','portal-upload','post-landed-cost','post-settlement',
 'print-label','print-picking','print-qc','reconcile-existing','recovery-open','report-filter',
 'rma-concession','rma-return-customer','rma-rework','rma-scrap','scan-command','scan-commit',
 'sim-auto','sim-reset','start-backup','start-export','start-restore','validate-config',
 'company-current','branch-switch','profile-open','twofa-open','logout-prototype'
]);

const marsProto = {
 get(name, fallback={}) {
   try { return JSON.parse(localStorage.getItem(name)||JSON.stringify(fallback)); }
   catch(e){ return fallback; }
 },
 set(name, value){ localStorage.setItem(name, JSON.stringify(value)); },
 routeState(){
   const all=this.get('mars_v71_route_state',{});
   return all[route] || null;
 },
 setRouteState(v){
   const all=this.get('mars_v71_route_state',{});
   all[route]=v; this.set('mars_v71_route_state',all);
 },
 log(action, detail=''){
   const all=this.get('mars_v71_action_log',[]);
   all.unshift({at:new Date().toISOString(),route,action,detail});
   this.set('mars_v71_action_log',all.slice(0,500));
 }
};

// close modal before route changes, so modal links never leave a dead overlay
const _marsNavigate = navigate;
navigate = function(r, replace=false){
  try{ closeModal(); }catch(e){}
  drawer(false);
  return _marsNavigate(r, replace);
};

// state chips now reflect prototype transitions rather than a fixed hard-coded state
const _marsOriginalStateLine = stateLine;
stateLine = function(c){
 const current = marsProto.routeState() || c.state;
 if(!current) return '';
 const families = {
   customer_review:['draft','internal_review','sent','customer_review','revision_requested','revising','revised_sent','approved','rejected','expired'],
   confirmed:['draft','confirmed','on_hold','closed','cancelled'],
   posted:['draft','approved','posted','reversed'],
   partially_received:['draft','issued','in_transit','partially_received','received','reconciliation_required','reconciled','closed'],
   review:['draft','counting','review','approved','posted','cancelled'],
   in_progress:['draft','planned','released','in_progress','on_hold','completed','closed','cancelled'],
   sent:['draft','approved','sent','on_hold','closed','cancelled'],
   inspecting:['requested','authorized','awaiting_shipment','received','inspecting','decided','completed','cancelled'],
   customs:['planning','ordered','in_transit','customs','receiving','cost_allocation','closed'],
   draft:['draft','posted','reversed']
 };
 let base = c.state || current;
 let arr = families[base] || [current];
 if(!arr.includes(current)) arr = [...arr,current];
 return `<div class="stateline">${arr.map(x=>`<span class="statechip ${x===current?'current':''}">${esc(x)}</span>`).join('')}</div>`;
};

function marsApplyBusinessAction(action){
 const directRoutes = {
   'Yeni Teklif':'quote_new','Yeni Sipariş':'sales_order_new','Tahsilat':'collection','Ödeme':'payment',
   'Konfigüre Et':'configurator','BOM':'bom_list','Stok Hareketleri':'stock_movements',
   'Sevkiyat Oluştur':'dispatch_new','Fatura Oluştur':'sales_invoice_new',
   'Mal Kabul Oluştur':'goods_receipt_new','Alış Faturası Oluştur':'supplier_invoice_new',
   'QC Aç':'inspection_detail','QC':'inspection_detail','Disposition':'qc_disposition',
   'Simülatörde Aç':'container_simulator','Tasarla':'report_designer'
 };
 if(directRoutes[action]){
   marsProto.log(action,'navigate');
   navigate(directRoutes[action]);
   return;
 }
 if(action==='Siparişe Dönüştür'){
   marsProto.setRouteState('approved'); marsProto.log(action,'quotation converted');
   navigate('sales_order_new'); return;
 }
 if(action==='E-Belge Gönder'){
   marsProto.log(action,'outbox queued');
   modal('E-Belge Gönderimi',
     `<div class="notice">İç fatura posted kalır. Dış gönderim Outbox üzerinden ilerler.</div>
      <div class="steps"><span class="step done">pending</span><span class="step active">queued</span><span class="step">submitted</span><span class="step">accepted / rejected / ambiguous</span></div>
      <p>Provider operasyonu: <b>QUERY_BEFORE_RETRY</b></p>
      <button class="btn" data-route="outbox">Outbox Kaydına Git</button>`,'Kapat');
   return;
 }
 if(action==='Adjustment'){
   marsProto.log(action,'adjustment form');
   modal('Financial Adjustment',
    `${formGrid([['Kaynak Belge','text',effectiveTitle(cfg()),false],['Ledger Yönü','select','Debit / Credit explicit',true],['Tutar','money','0.00',true],['Sebep','textarea','',true]])}
     <div class="notice warn">Belge etiketi ledger yönünü belirlemez; debit/credit explicit seçilir.</div>`,
     'Adjustment Oluştur',()=>{marsProto.log('Adjustment','created');toast('Adjustment taslağı oluşturuldu')});
   return;
 }
 if(action==='Hareket Düzeltme / Ters Kayıt'){
   modal('Hareket Düzeltme / Ters Kayıt',
     `<div class="notice warn">Original settlement silinmez. Ayrı reversal/compensation kaydı oluşturulur.</div>
      ${formGrid([['Reversal Of','text','SET-000184',false],['Sebep','textarea','Yanlış mahsup',true]])}`,
     'Reversal Oluştur',()=>{marsProto.log(action,'immutable reversal');toast('Bakiye Hareketi reversal oluşturuldu')});
   return;
 }
 if(action==='PDF'||action==='Ekstre PDF'){
   window.print(); return;
 }

 const map = [
   [/Reverse/i,'reversed'],[/Archive/i,'archived'],[/Suspend/i,'suspended'],
   [/Kapat|Close/i,'closed'],[/Complete|Tamamla/i,'completed'],[/Effective/i,'effective'],
   [/Authorize/i,'authorized'],[/Inspect/i,'inspecting'],[/Decide/i,'decided'],
   [/Partial Receive/i,'partially_received'],[/Receive|Received/i,'received'],
   [/Reconcile/i,'reconciled'],[/Issue/i,'issued'],[/Hold/i,'on_hold'],
   [/Release/i,'released'],[/Başlat|Start/i,'in_progress'],[/Review/i,'review'],
   [/Approve|Onayla|İç Onay/i,'approved'],[/Gönder|Sent/i,'sent'],[/Post/i,'posted'],
   [/Planla/i,'planned']
 ];
 let target=null;
 for(const [rx,val] of map){ if(rx.test(action)){target=val;break;} }
 if(target){
   marsProto.setRouteState(target); marsProto.log(action,target); render();
   toast(`${action} → ${target}`);
 } else {
   marsProto.log(action,'executed');
   toast(`${action} uygulandı`);
 }
}

<script id="mars-v10-5-product-search-stock-color">
(function(){
  // V10.4'teki sonuç satırı renderer'ını yalnız görünüm açısından güncelle.
  const oldProductResultHtml = window.productResultHtml;

  // Fonksiyon global değilse mevcut sonuç HTML'sini render sonrası düzelt.
  function applyAvailabilityColors(root=document){
    root.querySelectorAll('.product-result').forEach(row=>{
      const cells=row.children;
      if(cells.length < 5) return;

      const availableCell=cells[4];
      const raw=(availableCell.textContent||'').replace(/[^\d,.-]/g,'').replace(',','.');
      const qty=parseFloat(raw);

      availableCell.classList.add('product-result-available');
      availableCell.classList.toggle('no-stock', Number.isFinite(qty) && qty <= 0);
      availableCell.classList.toggle('low-stock', Number.isFinite(qty) && qty > 0);

      cells[2].classList.add('product-result-stock');
      cells[3].classList.add('product-result-reserved');
    });
  }

  // Sonuç listesi dinamik açıldığı için kullanıcı etkileşimi sonrası uygula.
  document.addEventListener('input',function(e){
    if(!e.target.closest?.('[data-product-search]')) return;
    requestAnimationFrame(()=>applyAvailabilityColors(document));
  },true);

  document.addEventListener('click',function(e){
    if(e.target.closest?.('[data-action="product-picker"]')){
      requestAnimationFrame(()=>applyAvailabilityColors(document));
    }
  },true);

  document.addEventListener('keydown',function(e){
    if(!e.target.closest?.('[data-product-search]')) return;
    if(['ArrowDown','ArrowUp','Enter'].includes(e.key)){
      requestAnimationFrame(()=>applyAvailabilityColors(document));
    }
  },true);

  applyAvailabilityColors(document);
})();
</script>

<script id="mars-v10-6-fast-stock-count">
(function(){
  // -----------------------------------------------------------------
  // Hızlı barkod sayımı
  // Barkod okuyucu keyboard-wedge gibi davranır ve Enter gönderir.
  // -----------------------------------------------------------------
  SCREENS.quick_stock_count={
    key:'quick_stock_count',
    title:'Hızlı Stok Sayımı',
    type:'custom',
    renderer:'quick_stock_count',
    tabs:['Sayım'],
    actions:[]
  };

  const COUNT_PRODUCTS=[
    {code:'AVZ-2032',name:'Aurora 80 Gold 3 Katlı Avize',barcode:'8690000203201',qr:'MARS:URUN:AVZ-2032',unit:'Adet',stock:18,packQty:1},
    {code:'AVZ-2032',name:'Aurora 80 Gold 3 Katlı Avize',barcode:'18690000203208',qr:'MARS:KOLI:AVZ-2032:4',unit:'Adet',stock:18,packQty:4,pack:'4’lü Koli'},
    {code:'AVZ-0805',name:'Luna 60 Krom Kristal Avize',barcode:'8690000080505',qr:'MARS:URUN:AVZ-0805',unit:'Adet',stock:11,packQty:1},
    {code:'AVZ-0990',name:'Platin 100 Oval Salon Avizesi',barcode:'8690000099002',qr:'MARS:URUN:AVZ-0990',unit:'Adet',stock:7,packQty:1},
    {code:'APL-0410',name:'Mira Gold Duvar Apliği',barcode:'8690000041001',qr:'MARS:URUN:APL-0410',unit:'Adet',stock:42,packQty:1},
    {code:'SARK-012',name:'Vega Tekli Sarkıt Füme',barcode:'8690000001203',qr:'MARS:URUN:SARK-012',unit:'Adet',stock:23,packQty:1},
    {code:'KRST-K9-14',name:'K9 Kristal 14 mm Şeffaf',barcode:'8690000914010',qr:'MARS:URUN:KRST-K9-14',unit:'Adet',stock:2400,packQty:1}
  ];

  const countState={
    started:false,
    warehouse:'Merkez Depo',
    location:'Tümü',
    rows:{},
    history:[],
    scanCount:0
  };

  function canonicalProducts(){
    const seen=new Map();
    COUNT_PRODUCTS.forEach(p=>{
      if(!seen.has(p.code)) seen.set(p.code,p);
    });
    return [...seen.values()];
  }

  function findScan(value){
    const raw=String(value||'').trim();
    const n=raw.toLocaleUpperCase('tr-TR');
    return COUNT_PRODUCTS.find(p=>
      p.barcode===raw ||
      p.qr.toLocaleUpperCase('tr-TR')===n ||
      p.code.toLocaleUpperCase('tr-TR')===n
    ) || null;
  }

  function countDiffClass(diff){
    return diff>0?'pos':diff<0?'neg':'zero';
  }

  function currentRows(){
    return Object.values(countState.rows).sort((a,b)=>b.lastAt-a.lastAt);
  }

  function renderCountTable(){
    const body=document.querySelector('#fastCountBody');
    if(!body)return;

    const rows=currentRows();
    body.innerHTML=rows.length?rows.map((r,i)=>{
      const diff=r.counted-r.system;
      return `<tr data-count-code="${esc(r.code)}">
        <td>${i+1}</td>
        <td><a class="link" data-route="product_detail:${esc(r.code)}">${esc(r.code)}</a></td>
        <td>${esc(r.name)}</td>
        <td class="count-system">${r.system} ${esc(r.unit)}</td>
        <td class="count-counted">${r.counted} ${esc(r.unit)}</td>
        <td class="count-diff ${countDiffClass(diff)}">${diff>0?'+':''}${diff} ${esc(r.unit)}</td>
        <td>${esc(r.lastBarcode)}</td>
        <td><button class="btn" data-action="fast-count-edit" data-code="${esc(r.code)}">Düzelt</button></td>
      </tr>`;
    }).join(''):`<tr><td colspan="8" style="text-align:center;padding:28px;color:#71838c">Henüz barkod okutulmadı.</td></tr>`;

    updateCountSummary();
  }

  function updateCountSummary(){
    const rows=currentRows();
    const diffRows=rows.filter(r=>r.counted!==r.system);
    const positive=diffRows.filter(r=>r.counted>r.system).length;
    const negative=diffRows.filter(r=>r.counted<r.system).length;

    const a=document.querySelector('[data-count-products]');
    const b=document.querySelector('[data-count-scans]');
    const c=document.querySelector('[data-count-diffs]');
    const d=document.querySelector('[data-count-negative]');
    if(a)a.textContent=rows.length;
    if(b)b.textContent=countState.scanCount;
    if(c)c.textContent=diffRows.length;
    if(d)d.textContent=negative;

    const last=document.querySelector('#fastCountLast');
    if(last){
      last.innerHTML=countState.history.length?countState.history.slice(0,8).map(h=>`
        <div class="fast-count-last-item">
          <time>${new Date(h.at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</time>
          <div><b>${esc(h.code)} · ${esc(h.name)}</b><br><span class="sub">${esc(h.barcode)}</span></div>
          <strong>+${h.qty}</strong>
        </div>`).join(''):'<div style="padding:16px;color:#71838c">Henüz okutma yok.</div>';
    }
  }

  function beep(ok=true){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      const ctx=new AC(), osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=ok?880:220;
      gain.gain.setValueAtTime(.035,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);
      osc.start();osc.stop(ctx.currentTime+.1);
    }catch(e){}
  }

  function setScanStatus(text,ok=true){
    const box=document.querySelector('#fastCountStatus');
    if(!box)return;
    box.className='fast-count-status '+(ok?'good':'bad');
    box.innerHTML=text;
  }

  function scanProduct(value){
    const input=document.querySelector('#fastCountInput');
    if(!countState.started){
      setScanStatus('<b>Önce sayımı başlat.</b>',false);
      beep(false);
      return;
    }

    const hit=findScan(value);
    if(!hit){
      setScanStatus(`<b>Barkod bulunamadı:</b> ${esc(value)}`,false);
      if(input){input.classList.remove('ok');input.classList.add('err');}
      beep(false);
      setTimeout(()=>input?.classList.remove('err'),300);
      return;
    }

    const manualQty=Math.max(1,Number(document.querySelector('#fastCountQty')?.value)||1);
    const qty=manualQty*(Number(hit.packQty)||1);
    const base=canonicalProducts().find(x=>x.code===hit.code)||hit;

    if(!countState.rows[hit.code]){
      countState.rows[hit.code]={
        code:hit.code,name:hit.name,unit:hit.unit,
        system:Number(base.stock)||0,counted:0,lastAt:0,lastBarcode:''
      };
    }

    const row=countState.rows[hit.code];
    row.counted+=qty;
    row.lastAt=Date.now();
    row.lastBarcode=hit.barcode;

    countState.scanCount++;
    countState.history.unshift({
      at:Date.now(),code:hit.code,name:hit.name,barcode:hit.barcode,qty
    });

    const packText=hit.packQty>1?` · ${esc(hit.pack||hit.packQty+'’lü paket')}`:'';
    setScanStatus(
      `<b>${esc(hit.code)} · ${esc(hit.name)}</b> → +${qty} ${esc(hit.unit)}${packText}`,
      true
    );
    if(input){
      input.classList.remove('err');input.classList.add('ok');
      input.value='';
      input.focus();
      setTimeout(()=>input.classList.remove('ok'),220);
    }
    beep(true);
    renderCountTable();
    if(window.marsTabState)marsTabState.markDirty(route);
  }

  function undoLast(){
    const h=countState.history.shift();
    if(!h){toast('Geri alınacak okutma yok');return;}
    const row=countState.rows[h.code];
    if(row){
      row.counted=Math.max(0,row.counted-h.qty);
      if(row.counted===0) delete countState.rows[h.code];
    }
    countState.scanCount=Math.max(0,countState.scanCount-1);
    setScanStatus(`<b>Son okutma geri alındı:</b> ${esc(h.code)} · -${h.qty}`,true);
    renderCountTable();
  }

  function finishCount(){
    if(!countState.started){toast('Sayım başlatılmadı');return;}
    const rows=currentRows();
    if(!rows.length){toast('Henüz ürün okutulmadı');return;}

    const diff=rows.filter(r=>r.counted!==r.system);
    modal('Sayımı Bitir',`
      <div class="domain-info-grid">
        <div><small>Sayılan Ürün</small><b>${rows.length}</b></div>
        <div><small>Toplam Okutma</small><b>${countState.scanCount}</b></div>
        <div><small>Farklı Ürün</small><b>${diff.length}</b></div>
        <div><small>Depo</small><b>${esc(countState.warehouse)}</b></div>
      </div>
      <div style="height:12px"></div>
      ${diff.length?`
        <div class="tablecard">
          ${tableHtml(['Ürün','Sistem','Sayılan','Fark'],diff.map(r=>{
            const d=r.counted-r.system;
            return [
              `${r.code} · ${r.name}`,
              `${r.system} ${r.unit}`,
              `${r.counted} ${r.unit}`,
              `<b class="${d<0?'credit':'debit'}">${d>0?'+':''}${d}</b>`
            ];
          }),'fast-count-finish')}
        </div>`:`<div class="notice">Sistem stoğu ile sayım arasında fark yok.</div>`}
      <div class="notice warn" style="margin-top:10px">
        Sayımı kaydetmek stok miktarını doğrudan değiştirmez. Sayım belgesi oluşturulur; farklar onaylandıktan sonra stok düzeltmesi yapılır.
      </div>
    `,'Sayımı Kaydet',()=>{
      countState.started=false;
      if(window.marsTabState)marsTabState.markClean(route);
      toast('Sayım belgesi kaydedildi');
      render();
    });
  }

  R.quick_stock_count=function(){
    return `
      <div class="fast-count-kpi">
        <div><small>Sayılan Farklı Ürün</small><strong data-count-products>0</strong></div>
        <div><small>Toplam Okutma</small><strong data-count-scans>0</strong></div>
        <div><small>Fark Bulunan</small><strong data-count-diffs>0</strong></div>
        <div><small>Eksik Sayılan</small><strong data-count-negative>0</strong></div>
      </div>

      <div class="fast-count-shell">
        <div>
          <div class="fast-count-scan" style="position:relative">
            ${!countState.started?`
              <div class="fast-count-overlay">
                <div class="box">
                  <b>Hızlı Barkod Sayımı</b>
                  <span class="sub">Depoyu seç ve sayımı başlat.</span><br><br>
                  <button class="btn primary" data-action="fast-count-start">Sayımı Başlat</button>
                </div>
              </div>`:''}

            <div class="fast-count-scan-row">
              <div>
                <label>Depo</label>
                <select class="select" id="fastCountWarehouse">
                  <option>Merkez Depo</option>
                  <option>Üretim Deposu</option>
                  <option>Mağaza</option>
                </select>
              </div>
              <div>
                <label>Lokasyon</label>
                <select class="select" id="fastCountLocation">
                  <option>Tümü</option>
                  <option>A-01</option>
                  <option>A-02</option>
                  <option>A-03</option>
                </select>
              </div>
              <div class="scan-input-wrap">
                <label>Barkod / QR / Ürün Kodu</label>
                <input id="fastCountInput" class="fast-count-input" autocomplete="off"
                  placeholder="Barkodu okut..." ${countState.started?'':'disabled'}>
              </div>
              <div>
                <label>Çarpan</label>
                <input id="fastCountQty" class="input fast-count-qty" type="number" min="1" value="1">
              </div>
            </div>

            <div id="fastCountStatus" class="fast-count-status">
              Barkod okuyucu hazır. Okuyucu Enter gönderdiğinde miktar otomatik eklenir.
            </div>

            <div style="display:flex;gap:7px;margin-top:9px">
              <button class="btn" data-action="fast-count-undo">↶ Son Okutmayı Geri Al</button>
              <div class="grow"></div>
              <button class="btn" data-action="fast-count-pause">${countState.started?'Sayımı Duraklat':'Sayımı Devam Ettir'}</button>
              <button class="btn primary" data-action="fast-count-finish">Sayımı Bitir</button>
            </div>
          </div>

          <div class="tablecard fast-count-table">
            <div class="toolbar"><b>Sayılan Ürünler</b><div class="grow"></div>
              <button class="btn" data-action="fast-count-show-diff">Sadece Farkları Göster</button>
            </div>
            <div class="gridwrap">
              <table>
                <thead><tr>
                  <th>#</th><th>Ürün Kodu</th><th>Ürün Adı</th>
                  <th>Sistem Stoğu</th><th>Sayılan</th><th>Fark</th><th>Son Barkod</th><th>İşlem</th>
                </tr></thead>
                <tbody id="fastCountBody">
                  <tr><td colspan="8" style="text-align:center;padding:28px;color:#71838c">Henüz barkod okutulmadı.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="fast-count-last">
          <div class="cardhead"><b>Son Okutmalar</b></div>
          <div class="body" id="fastCountLast">
            <div style="padding:16px;color:#71838c">Henüz okutma yok.</div>
          </div>
        </div>
      </div>`;
  };

  // Menu: Ürün/Stok altında kolay erişim.
  function addQuickCountToMenu(){
    const productGroup=MENU.find(g=>g.key==='products');
    if(!productGroup)return;
    productGroup.items=productGroup.items.filter(i=>i[0]!=='quick_stock_count');
    const countIndex=productGroup.items.findIndex(i=>i[0]==='count_list');
    const item=['quick_stock_count','Hızlı Stok Sayımı'];
    if(countIndex>=0)productGroup.items.splice(countIndex+1,0,item);
    else productGroup.items.push(item);
    renderNav();
  }
  addQuickCountToMenu();

  // Stok sayım listesine hızlı sayım butonu da ekle.
  const oldRenderListV106=renderList;
  renderList=function(c){
    let html=oldRenderListV106(c);
    if(c.key==='count_list'){
      const marker='<div class="grow"></div>';
      html=html.replace(
        marker,
        `${marker}<button class="btn primary" data-route="quick_stock_count">⚡ Hızlı Barkod Sayımı</button>`
      );
    }
    return html;
  };

  document.addEventListener('keydown',function(e){
    const input=e.target.closest?.('#fastCountInput');
    if(!input)return;
    if(e.key==='Enter'){
      e.preventDefault();
      e.stopImmediatePropagation();
      const value=input.value.trim();
      if(value)scanProduct(value);
    }
  },true);

  document.addEventListener('click',function(e){
    const a=e.target.closest('[data-action]');if(!a)return;
    const x=a.dataset.action;

    if(x==='fast-count-start'){
      e.preventDefault();e.stopImmediatePropagation();
      countState.started=true;
      countState.warehouse=document.querySelector('#fastCountWarehouse')?.value||'Merkez Depo';
      countState.location=document.querySelector('#fastCountLocation')?.value||'Tümü';
      render();
      setTimeout(()=>document.querySelector('#fastCountInput')?.focus(),0);
      toast('Sayım başladı');
      return;
    }

    if(x==='fast-count-pause'){
      e.preventDefault();e.stopImmediatePropagation();
      countState.started=!countState.started;
      render();
      if(countState.started)setTimeout(()=>document.querySelector('#fastCountInput')?.focus(),0);
      toast(countState.started?'Sayım devam ediyor':'Sayım duraklatıldı');
      return;
    }

    if(x==='fast-count-undo'){
      e.preventDefault();e.stopImmediatePropagation();
      undoLast();return;
    }

    if(x==='fast-count-finish'){
      e.preventDefault();e.stopImmediatePropagation();
      finishCount();return;
    }

    if(x==='fast-count-edit'){
      e.preventDefault();e.stopImmediatePropagation();
      const code=a.dataset.code,row=countState.rows[code];
      if(!row)return;
      modal('Sayım Miktarını Düzelt',formGrid([
        ['Ürün','text',`${row.code} · ${row.name}`,false],
        ['Sistem Stoğu','decimal',String(row.system),false],
        ['Sayılan Miktar','decimal',String(row.counted),true]
      ]),'Kaydet',()=>{
        const inputs=[...document.querySelectorAll('#modalWrap input')];
        const val=Number(inputs[inputs.length-1]?.value);
        if(Number.isFinite(val) && val>=0)row.counted=val;
        row.lastAt=Date.now();
        renderCountTable();
        toast('Sayım miktarı düzeltildi');
      });
      return;
    }

    if(x==='fast-count-show-diff'){
      e.preventDefault();e.stopImmediatePropagation();
      const btn=a;
      const active=btn.dataset.active==='1';
      btn.dataset.active=active?'0':'1';
      btn.textContent=active?'Sadece Farkları Göster':'Tüm Ürünleri Göster';
      document.querySelectorAll('#fastCountBody tr[data-count-code]').forEach(tr=>{
        const r=countState.rows[tr.dataset.countCode];
        tr.style.display=(!active && r && r.counted===r.system)?'none':'';
      });
      return;
    }
  },true);

  // Keep count input focused during active counting when screen is clicked.
  document.addEventListener('click',function(e){
    if(baseRoute()!=='quick_stock_count' || !countState.started)return;
    if(e.target.closest('button,input,select,a,[data-route]'))return;
    document.querySelector('#fastCountInput')?.focus();
  });

  if(baseRoute()==='quick_stock_count')render();
})();
</script>

  function normalizeScan(v){
    return String(v||'').trim().toLocaleUpperCase('tr-TR');

  function findRandomProduct(value){
    const n=normalizeScan(value);

  function randomBeep(ok=true){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=ok?900:220;
      gain.gain.setValueAtTime(.035,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.09);

  function scanRandom(value){
    if(!randomCount.started || randomCount.paused)return;
    const input=document.querySelector('#randomCountInput');

    if(!hit){

    // Product must belong to selected warehouse master.

      if(input){input.value='';input.focus();}
      return;
    }

    const multiplier=Math.max(1,Number(document.querySelector('#randomCountMultiplier')?.value)||1);

    if(!randomCount.rows[hit.code]){

        name:hit.name,
        unit:hit.unit,
        counted:0,
        system:Number(warehouseRow.stock)||0,

    randomCount.scanCount++;

      at:Date.now(),
      code:hit.code,
      name:hit.name,
      barcode:hit.barcode,
      qty,
      unit:hit.unit
    });

      input.classList.remove('err');
      input.classList.add('ok');
      input.value='';
      input.focus();
      setTimeout(()=>input.classList.remove('ok'),200);

  // ------------------------------------------------------------
  // Fiş listesi / ekstre
  // ------------------------------------------------------------
  let CARI_STATEMENT_MODE='simple';

  function statementHeader(){
    const x=cariCurrent();
    return `<div class="cari-topbar">
      <div><h2>${esc(x.code)} · ${esc(x.company)}</h2><div class="sub">01.08.2026 - 23.08.2026</div></div>
      <div class="grow"></div><b>${cariBalanceLabel(x.balance)}</b>

  function statementFilterV1015(){
    return `<div class="statement-filter-row">
      <div><label>Başlangıç</label><input type="date" value="2026-08-01"></div>
      <div><label>Bitiş</label><input type="date" value="2026-08-23"></div>
      <div><label>Cari</label><input type="text" value="${esc(cariCurrent().code+' · '+cariCurrent().company)}"></div>

      <button class="btn primary" data-action="cari-statement-filter">Filtrele</button>

  R.cari_voucher_complete=function(){
    const x=cariCurrent();
    return `<div class="cari-page">
      ${statementHeader()}
      ${statementFilterV1015()}
      <div class="tablecard"><div class="toolbar"><b>Düz Fiş Listesi</b><div class="grow"></div><button class="btn" data-action="print">Yazdır</button><button class="btn" data-action="cari-list-export">Excel / CSV</button></div>
        ${tableHtml(['Tarih','Fiş / Belge No','İşlem Türü','Açıklama','Borç','Alacak','Bakiye'],CARI_MOVES.map(m=>[
          m.date,link(m.doc,m.route),m.kind,m.desc,m.debit?money(m.debit):'—',m.credit?money(m.credit):'—',money(m.balance)

  function simpleStatementV1015(){
    return `<div class="tablecard"><div class="toolbar"><b>Detaysız Cari Ekstre</b><div class="grow"></div><button class="btn" data-action="print">Yazdır</button><button class="btn" data-action="cari-list-export">Excel / CSV</button></div>
      ${tableHtml(['Tarih','Belge No','İşlem','Açıklama','Borç','Alacak','Bakiye'],CARI_MOVES.map(m=>[
        m.date,link(m.doc,m.route),m.kind,m.desc,m.debit?money(m.debit):'—',m.credit?money(m.credit):'—',money(m.balance)
      ]),'cari-statement-simple-v1015')}</div>`;
  }

  function detailStatementV1015(){
    let rows='';
    CARI_MOVES.forEach(m=>{
      rows+=`<tr class="statement-detail-parent">
        <td>${m.date}</td><td><a class="link" data-route="${esc(m.route)}">${esc(m.doc)}</a></td>
        <td>${esc(m.kind)}</td><td>${esc(m.desc)}</td>
        <td>${m.debit?money(m.debit):'—'}</td><td>${m.credit?money(m.credit):'—'}</td><td>${money(m.balance)}</td>
      </tr>
      <tr class="statement-detail-line"><td></td><td colspan="6" class="indent">
        <table style="width:100%"><thead><tr><th>Ürün Kodu</th><th>Ürün / Açıklama</th><th>Miktar</th><th>Birim</th><th>Birim Fiyat</th><th>KDV</th><th>Satır Toplamı</th></tr></thead>
        <tbody>${m.lines.map(l=>`<tr>
          <td>${l[0]!=='—'?`<a class="link" data-route="product_detail:${esc(l[0])}">${esc(l[0])}</a>`:'—'}</td>
          <td>${esc(l[1])}</td><td>${esc(String(l[2]))}</td><td>${esc(l[3])}</td>
          <td>${typeof l[4]==='number'?money(l[4]):esc(String(l[4]))}</td><td>${esc(l[5])}</td><td><b>${money(l[6])}</b></td>
        </tr>`).join('')}</tbody></table>
      </td></tr>`;
    });
    return `<div class="tablecard"><div class="toolbar"><b>Detaylı Cari Ekstre</b><div class="grow"></div><button class="btn" data-action="print">Yazdır</button><button class="btn" data-action="cari-list-export">Excel / CSV</button></div>
      <div class="gridwrap"><table><thead><tr><th>Tarih</th><th>Belge No</th><th>İşlem</th><th>Açıklama</th><th>Borç</th><th>Alacak</th><th>Bakiye</th></tr></thead><tbody>${rows}</tbody></table></div>

  R.cari_statement_complete=function(){
    const debit=CARI_MOVES.reduce((a,x)=>a+x.debit,0),credit=CARI_MOVES.reduce((a,x)=>a+x.credit,0);
    return `<div class="cari-page">
      ${statementHeader()}
      ${statementFilterV1015()}
      <div class="statement-modebar">
        <button class="btn ${CARI_STATEMENT_MODE==='simple'?'active':''}" data-action="cari-statement-simple">Detaysız Ekstre</button>

        <div class="grow"></div><button class="btn" data-route="voucher_list">Fiş Listesi</button>
      </div>
      <div class="statement-summary">
        <div><small>Devir Bakiye</small><strong>${money(48500)}</strong></div>
        <div><small>Toplam Borç</small><strong>${money(debit)}</strong></div>
        <div><small>Toplam Alacak</small><strong>${money(credit)}</strong></div>
        <div><small>Hareket Sayısı</small><strong>${CARI_MOVES.length}</strong></div>
        <div><small>Son Bakiye</small><strong>${money(cariCurrent().balance)}</strong></div>
      </div>
      ${CARI_STATEMENT_MODE==='detail'?detailStatementV1015():simpleStatementV1015()}
    </div>`;
  };

  // ------------------------------------------------------------
  // Üst business actions
  // ------------------------------------------------------------
  const oldBusinessV1015=marsApplyBusinessAction;
  marsApplyBusinessAction=function(action){
    if(baseRoute()==='contact_detail'){
      const x=cariCurrent();
      if(action==='Yeni Teklif'){navigate('quote_list');toast(x.company+' için teklif listesi açıldı');return;}
      if(action==='Yeni Sipariş'){navigate('sales_order_list');toast(x.company+' için sipariş listesi açıldı');return;}
      if(action==='Satış Faturası'){navigate('sales_invoice_list');toast(x.company+' için fatura listesi açıldı');return;}
      if(action==='Tahsilat'){navigate('collection');return;}
      if(action==='Sevkiyat'){navigate('dispatch_list');return;}
      if(action==='Cari Ekstre'){CARI_STATEMENT_MODE='simple';navigate('statement:'+x.code);return;}
      if(action==='Cariyi Düzenle'){navigate('contact_edit:'+x.code);return;}
    }
    return oldBusinessV1015(action);
  };

  // ------------------------------------------------------------
  // Cari interactions
  // ------------------------------------------------------------
  document.addEventListener('click',function(e){
    const a=e.target.closest('[data-action]');if(!a)return;
    const act=a.dataset.action;

    if(act==='cari-master-save-new'){
      e.preventDefault();e.stopImmediatePropagation();
      if(window.marsTabState)marsTabState.markClean(route);
      toast('Cari kartı oluşturuldu');
      setTimeout(()=>navigate('contact_detail:CR0000037'),180);
      return;
    }
    if(act==='cari-master-save-edit'){
      e.preventDefault();e.stopImmediatePropagation();
      if(window.marsTabState)marsTabState.markClean(route);
      toast('Cari bilgileri kaydedildi');
      setTimeout(()=>navigate('contact_detail:'+cariCurrent().code),180);
      return;
    }

    if(['cari-master-add-address','cari-master-edit-address'].includes(act)){
      e.preventDefault();e.stopImmediatePropagation();
      modal(act==='cari-master-add-address'?'Adres Ekle':'Adresi Düzenle',`
        <div class="cari-fields">
          ${cariField('Adres Tipi','select',['Sevk','Fatura','Merkez','Diğer'])}
          ${cariField('Başlık','text','Merkez Depo')}
          ${cariField('İl','text','Ankara')}
          ${cariField('İlçe','text','Kahramankazan')}
          ${cariField('Posta Kodu','text','06980')}
          ${cariField('Adres','textarea','Saray Mah. 42. Sok. No:6')}
        </div>`,'Kaydet',()=>toast('Adres kaydedildi'));return;
    }

    if(['cari-master-add-person','cari-master-edit-person'].includes(act)){
      e.preventDefault();e.stopImmediatePropagation();
      modal(act==='cari-master-add-person'?'Yetkili Ekle':'Yetkiliyi Düzenle',`
        <div class="cari-fields">
          ${cariField('Ad Soyad','text','')}
          ${cariField('Görev','text','')}
          ${cariField('Telefon','tel','')}
          ${cariField('E-Posta','email','')}
        </div>`,'Kaydet',()=>toast('Yetkili kaydedildi'));return;
    }

    if(['cari-master-add-bank','cari-master-edit-bank'].includes(act)){
      e.preventDefault();e.stopImmediatePropagation();
      modal(act==='cari-master-add-bank'?'Banka Hesabı Ekle':'Banka Hesabını Düzenle',`
        <div class="cari-fields">
          ${cariField('Banka','text','')}
          ${cariField('Şube','text','')}
          ${cariField('IBAN','text','TR')}
          ${cariField('Para Birimi','select',['TRY','USD','EUR'])}
          ${cariField('Hesap Sahibi','text',cariCurrent().company)}
        </div>`,'Kaydet',()=>toast('Banka hesabı kaydedildi'));return;
    }

    if(act==='cari-action-quote'){e.preventDefault();e.stopImmediatePropagation();navigate('quote_list');toast('Yeni teklif, Teklifler listesinden oluşturulur');return;}
    if(act==='cari-action-order'){e.preventDefault();e.stopImmediatePropagation();navigate('sales_order_list');toast('Yeni sipariş, Siparişler listesinden oluşturulur');return;}
    if(act==='cari-action-invoice'){e.preventDefault();e.stopImmediatePropagation();navigate('sales_invoice_list');toast('Yeni fatura, Faturalar listesinden oluşturulur');return;}
    if(act==='cari-action-collection'){e.preventDefault();e.stopImmediatePropagation();navigate('collection');return;}
    if(act==='cari-action-dispatch'){e.preventDefault();e.stopImmediatePropagation();navigate('dispatch_list');return;}

    if(act==='cari-open-simple-statement'){e.preventDefault();e.stopImmediatePropagation();CARI_STATEMENT_MODE='simple';navigate('statement:'+cariCurrent().code);return;}
    if(act==='cari-open-detail-statement'){e.preventDefault();e.stopImmediatePropagation();CARI_STATEMENT_MODE='detail';navigate('statement:'+cariCurrent().code);return;}
    if(act==='cari-statement-simple'){e.preventDefault();e.stopImmediatePropagation();CARI_STATEMENT_MODE='simple';render();return;}
    if(act==='cari-statement-detail'){e.preventDefault();e.stopImmediatePropagation();CARI_STATEMENT_MODE='detail';render();return;}
    if(act==='cari-statement-for'){e.preventDefault();e.stopImmediatePropagation();CARI_STATEMENT_MODE='simple';navigate('statement:'+(a.dataset.code||'CR0000036'));return;}
    if(act==='cari-statement-filter'){e.preventDefault();e.stopImmediatePropagation();toast('Ekstre filtrelendi');return;}
    if(act==='cari-list-export'){e.preventDefault();e.stopImmediatePropagation();toast('Excel / CSV çıktısı hazırlandı');return;}
    if(act==='cari-open-edit-files'){
      e.preventDefault();e.stopImmediatePropagation();
      const fileTab=SCREENS.contact_edit.tabs.indexOf('Dosyalar');
      activeTabs.contact_edit=fileTab>=0?fileTab:0;
      navigate('contact_edit:'+cariCurrent().code);
      return;
    }
    if(act==='cari-master-add-file'){
      e.preventDefault();e.stopImmediatePropagation();
      modal('Cari Dosyası Ekle',`<div class="cari-fields">
        <div class="cari-field full"><label>Dosya</label><input id="cariFileInput" class="input" type="file"></div>
        ${cariField('Tür','select',['Diğer','Vergi Levhası','İmza Sirküleri','Sözleşme','Fotoğraf'])}
        ${cariField('Açıklama','text','')}
      </div>`,'Dosyayı Ekle',()=>{
        const input=document.getElementById('cariFileInput');
        const name=input?.files?.[0]?.name||'yeni_dosya.pdf';
        CARI_FILES.push({name,type:'Diğer',date:new Date().toLocaleDateString('tr-TR'),note:'Cari dosyası'});
        toast('Dosya eklendi');render();
      });return;
    }
    if(act==='cari-master-view-file'){
      e.preventDefault();e.stopImmediatePropagation();
      const f=CARI_FILES[Number(a.dataset.fileIndex)||0];
      if(!f)return;
      modal('Dosya · '+f.name,`<div class="v11-readonly-grid">
        <div><small>Dosya</small><b>${esc(f.name)}</b></div><div><small>Tür</small><b>${esc(f.type)}</b></div>
        <div><small>Tarih</small><b>${esc(f.date)}</b></div><div><small>Açıklama</small><b>${esc(f.note)}</b></div>
      </div><div style="height:220px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#f7fafb;display:grid;place-items:center;color:#71838c">Dosya Önizleme</div>`,'Kapat');return;
    }
    if(act==='cari-master-delete-file'){
      e.preventDefault();e.stopImmediatePropagation();
      const idx=Number(a.dataset.fileIndex);
      const f=CARI_FILES[idx];
      if(!f)return;
      modal('Dosyayı Sil',`<div class="notice"><b>${esc(f.name)}</b> dosyası cari kartından kaldırılacak.</div>`,'Sil',()=>{
        CARI_FILES.splice(idx,1);toast('Dosya silindi');render();
      });return;
    }
  },true);

  // ------------------------------------------------------------
  // Dirty tracking only in dedicated edit/new surfaces
  // ------------------------------------------------------------
  document.addEventListener('input',function(e){
    if(!['contact_new','contact_edit'].includes(baseRoute()))return;
    if(e.target.matches('input,select,textarea') && window.marsTabState){
      marsTabState.markDirty(route);
    }
  },true);

  // ------------------------------------------------------------
  // Generic form safety net: Cari routes cannot fall back to form renderer.
  // ------------------------------------------------------------
  const CARI_ROUTES=new Set(['contact_list','contact_new','contact_detail','contact_edit','balances','voucher_list','statement']);
  const oldRenderV1015=render;
  render=function(){
    const br=baseRoute();
    if(CARI_ROUTES.has(br)){
      const sc=SCREENS[br];
      if(sc && sc.type!=='custom')sc.type='custom';
    }
    oldRenderV1015();
    if(CARI_ROUTES.has(br)){
      setTimeout(()=>{
        // Detail/balance/list/statement must never contain editable controls except filters.
        if(br==='contact_detail'){
          const root=document.querySelector('#main');
          root?.querySelectorAll('.content input,.content select,.content textarea').forEach(el=>el.remove());
        }
        rebuildCariMenuV1015();
      },0);
    }
  };

  // Basit mod menüsü tekrar kurulursa Cari menüsünü yeniden kilitle.
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-action="preacc-simple-mode"]')){
      setTimeout(rebuildCariMenuV1015,40);
    }
  },true);

  // Cari buton/işlem katmanı ayrı script bloğunda çalıştığı için
  // canonical cari veri ve yardımcıları kontrollü olarak dışa açılır.
  Object.assign(window,{
    CARI_ROWS,CARI_MOVES,CARI_INVOICES,CARI_ORDERS,CARI_QUOTES,CARI_FILES,
    cariCurrent,cariField,cariReadonlyInfo,cariBalanceLabel
  });

  rebuildCariMenuV1015();
  if(CARI_ROUTES.has(baseRoute()))render();
})();
</script>

<script id="mars-v10-16-cari-buttons-script">
(function(){
  const CARI_BUTTON_ROUTES=new Set([
    'contact_list','contact_new','contact_detail','contact_edit',
    'balances','voucher_list','statement'

  function rowInfoGrid(rows){
    return `<div class="cari-row-detail">${rows.map(([k,v])=>`
      <div><small>${esc(k)}</small><b>${v}</b></div>`).join('')}</div>`;

  function actionMenu(buttons){
    return `<div class="cari-action-menu">${buttons.join('')}</div>`;
  }

  function go(routeValue){
    if(routeValue)navigate(routeValue);
  }

  function contactByRow(row){
    return CARI_ROWS[row]||CARI_ROWS[0];
  }

  function moveForKey(key,row){
    if(key==='cari-detail-last-moves') return CARI_MOVES.slice(-5).reverse()[row]||CARI_MOVES[0];
    return CARI_MOVES[row]||CARI_MOVES[0];
  }

  function openContactPerson(row){
    const people=[
      {name:'Sinan Öztaş',role:'Satınalma Yetkilisi',phone:'0532 555 44 33',mail:'satinalma@avizepark.com',primary:'Evet'},
      {name:'Ayşe Demir',role:'Muhasebe',phone:'0536 444 33 22',mail:'muhasebe@avizepark.com',primary:'Hayır'}
    ];
    const p=people[row]||people[0];
    modal('Yetkili Bilgisi',rowInfoGrid([
      ['Ad Soyad',esc(p.name)],['Görev',esc(p.role)],['Telefon',esc(p.phone)],
      ['E-Posta',esc(p.mail)],['Birincil',esc(p.primary)]
    ])+`<div style="height:10px"></div>`+actionMenu([
      `<button class="btn" data-action="cari-demo-phone" data-value="${esc(p.phone)}">Telefon</button>`,
      `<button class="btn" data-action="cari-demo-whatsapp" data-value="${esc(p.phone)}">WhatsApp</button>`,
      `<button class="btn" data-action="cari-demo-mail" data-value="${esc(p.mail)}">E-Posta</button>`,
      `<button class="btn primary" data-route="contact_edit:${esc(cariCurrent().code)}">Cariyi Düzenle</button>`
    ]),'Kapat');
  }

  function openWarehouse(row){
    const data=[
      ['AMB-01','Merkez Depo','Ahmet Yılmaz','0533 111 22 33','Kahramankazan / Ankara','09:00 - 17:00'],
      ['AMB-02','Mağaza Teslim','Emre Kaya','0535 222 33 44','Çankaya / Ankara','10:00 - 18:00']

      ])+`<div style="height:10px"></div>`+actionMenu([

    ]),'Kapat');
  }

  function cariRowOpen(key,row){
    switch(key){
      case 'cari-complete-list': {
        const x=contactByRow(row); go('contact_detail:'+x.code); return;
      }
      case 'cari-balance-list': {
        const x=contactByRow(row); go('contact_detail:'+x.code); return;
      }
      case 'cari-detail-last-moves':
      case 'cari-movement-detail':
      case 'cari-voucher-list':
      case 'cari-statement-simple-v1015': {
        const m=moveForKey(key,row); go(m.route); return;
      }
      case 'cari-invoices': {
        const r=CARI_INVOICES[row]||CARI_INVOICES[0];
        go(r[2]==='Satış Faturası'?'sales_invoice_detail:'+r[0]:'supplier_invoice_detail:'+r[0]); return;
      }
      case 'cari-orders': {
        const r=CARI_ORDERS[row]||CARI_ORDERS[0]; go('sales_order_detail:'+r[0]); return;
      }
      case 'cari-quotes': {
        const r=CARI_QUOTES[row]||CARI_QUOTES[0]; go('quote_detail:'+r[0]); return;
      }
      case 'cari-detail-open-work': {
        const routes=['sales_order_detail:SIP-2026-00481','quote_detail:TKL-2026-00628','dispatch_detail:IRS-2026-00318'];
        go(routes[row]||routes[0]); return;
      }
      case 'cari-product-top':
      case 'cari-product-last':
        openProductAnalysis(key,row); return;
      case 'cari-year-month':
        openYearMonth(row); return;
      case 'cari-warehouses-ro':
        openWarehouse(row); return;
      case 'cari-contacts-ro':
        openContactPerson(row); return;
      case 'cari-bank-ro':
        openBank(row); return;
      case 'cari-files-ro':
        openFile(row); return;
      case 'cari-master-addresses':
        document.querySelector('[data-action="cari-master-edit-address"]')?.click(); return;
      case 'cari-master-persons':
        document.querySelector('[data-action="cari-master-edit-person"]')?.click(); return;
      case 'cari-master-banks':
        document.querySelector('[data-action="cari-master-edit-bank"]')?.click(); return;
      default:
        modal('Satır Detayı',
          `<div class="notice">Bu satır ${esc(key)} tablosuna ait. Cari modülünde ham/generic kayıt ekranı açılmaz.</div>`,
          'Kapat'
        );
    }
  }

  function cariRowActions(key,row){
    if(key==='cari-complete-list' || key==='cari-balance-list'){
      const x=contactByRow(row);
      modal(x.company+' · İşlemler',actionMenu([
        `<button class="btn primary" data-route="contact_detail:${esc(x.code)}">Cariyi Aç</button>`,
        `<button class="btn" data-route="contact_edit:${esc(x.code)}">Cariyi Düzenle</button>`,
        `<button class="btn" data-action="cari-statement-for" data-code="${esc(x.code)}">Cari Ekstre</button>`,
        `<button class="btn" data-route="voucher_list:${esc(x.code)}">Fiş Listesi</button>`,
        `<button class="btn" data-action="cari-action-quote">Yeni Teklif</button>`,
        `<button class="btn" data-action="cari-action-order">Yeni Sipariş</button>`
      ]),'Kapat');
      return;
    }

    if(['cari-detail-last-moves','cari-movement-detail','cari-voucher-list','cari-statement-simple-v1015'].includes(key)){
      const m=moveForKey(key,row);
      modal(m.doc+' · İşlemler',rowInfoGrid([
        ['Tarih',esc(m.date)],['İşlem',esc(m.kind)],['Açıklama',esc(m.desc)],
        ['Borç',m.debit?money(m.debit):'—'],['Alacak',m.credit?money(m.credit):'—'],['Bakiye',money(m.balance)]
      ])+`<div style="height:10px"></div>`+actionMenu([
        `<button class="btn primary" data-route="${esc(m.route)}">Belgeyi Aç</button>`,
        `<button class="btn" data-action="print">Yazdır</button>`,
        `<button class="btn" data-action="cari-open-detail-statement">Detaylı Ekstre</button>`,
        `<button class="btn" data-route="contact_detail:${esc(cariCurrent().code)}">Cari Kartı</button>`
      ]),'Kapat');
      return;
    }

    if(key==='cari-invoices'){
      const r=CARI_INVOICES[row]||CARI_INVOICES[0];
      const rr=r[2]==='Satış Faturası'?'sales_invoice_detail:'+r[0]:'supplier_invoice_detail:'+r[0];
      modal(r[0]+' · Fatura İşlemleri',rowInfoGrid([
        ['Tarih',esc(r[1])],['Tür',esc(r[2])],['Vade',esc(r[3])],
        ['Matrah',money(r[4])],['KDV',money(r[5])],['Genel Toplam',money(r[6])]
      ])+`<div style="height:10px"></div>`+actionMenu([
        `<button class="btn primary" data-route="${esc(rr)}">Faturayı Aç</button>`,
        `<button class="btn" data-action="print">Yazdır</button>`,
        `<button class="btn" data-action="cari-open-detail-statement">Ekstrede Göster</button>`
      ]),'Kapat');
      return;
    }

    if(key==='cari-orders'){
      const r=CARI_ORDERS[row]||CARI_ORDERS[0];
      modal(r[0]+' · Sipariş İşlemleri',rowInfoGrid([
        ['Tarih',esc(r[1])],['Tür',esc(r[2])],['Tutar',esc(r[3])],['Durum',esc(r[4])]
      ])+`<div style="height:10px"></div>`+actionMenu([
        `<button class="btn primary" data-route="sales_order_detail:${esc(r[0])}">Siparişi Aç</button>`,
        `<button class="btn" data-route="dispatch_list">Sevkiyatlar</button>`,
        `<button class="btn" data-route="sales_invoice_list">Faturalar</button>`
      ]),'Kapat');
      return;
    }

    if(key==='cari-quotes'){
      const r=CARI_QUOTES[row]||CARI_QUOTES[0];
      modal(r[0]+' · Teklif İşlemleri',rowInfoGrid([
        ['Tarih',esc(r[1])],['Geçerlilik',esc(r[2])],['Tutar',esc(r[3])],['Durum',esc(r[4])]
      ])+`<div style="height:10px"></div>`+actionMenu([
        `<button class="btn primary" data-route="quote_detail:${esc(r[0])}">Teklifi Aç</button>`,
        `<button class="btn" data-route="sales_order_list">Siparişe Dönüşümler</button>`,
        `<button class="btn" data-action="print">Yazdır</button>`
      ]),'Kapat');
      return;
    }

    if(key==='cari-detail-open-work'){
      const data=[
        ['Sipariş','SIP-2026-00481','sales_order_detail:SIP-2026-00481'],
        ['Teklif','TKL-2026-00628','quote_detail:TKL-2026-00628'],
        ['Sevkiyat','IRS-2026-00318','dispatch_detail:IRS-2026-00318']
      ][row]||[];
      modal((data[0]||'İş')+' İşlemleri',actionMenu([
        `<button class="btn primary" data-route="${esc(data[2]||'dashboard')}">${esc(data[0]||'Kayıt')} Aç</button>`,
        `<button class="btn" data-route="contact_detail:${esc(cariCurrent().code)}">Cari Kartı</button>`
      ]),'Kapat');
      return;
    }

    if(key==='cari-product-top'||key==='cari-product-last'){openProductAnalysis(key,row);return;}
    if(key==='cari-year-month'){openYearMonth(row);return;}
    if(key==='cari-warehouses-ro'){openWarehouse(row);return;}
    if(key==='cari-contacts-ro'){openContactPerson(row);return;}
    if(key==='cari-bank-ro'){openBank(row);return;}
    if(key==='cari-files-ro'){openFile(row);return;}

    if(key==='cari-master-addresses'){
      modal('Adres İşlemleri',actionMenu([
        `<button class="btn primary" data-action="cari-master-edit-address">Adresi Düzenle</button>`,
        `<button class="btn" data-action="cari-demo-default-address">Varsayılan Yap</button>`
      ]),'Kapat');return;
    }
    if(key==='cari-master-persons'){
      modal('Yetkili İşlemleri',actionMenu([
        `<button class="btn primary" data-action="cari-master-edit-person">Yetkiliyi Düzenle</button>`,
        `<button class="btn" data-action="cari-demo-primary-person">Birincil Yap</button>`
      ]),'Kapat');return;
    }
    if(key==='cari-master-banks'){
      modal('Banka Hesabı İşlemleri',actionMenu([
        `<button class="btn primary" data-action="cari-master-edit-bank">Hesabı Düzenle</button>`,
        `<button class="btn" data-action="cari-demo-default-bank">Varsayılan Yap</button>`
      ]),'Kapat');return;
    }

    modal('Satır İşlemleri',
      `<div class="notice">Bu tablo için Cari modülünde generic işlem formu kullanılmıyor.</div>`,
      'Kapat'
    );
  }

  function wirePlainCariButtons(){
    if(!CARI_BUTTON_ROUTES.has(baseRoute()))return;
    document.querySelectorAll('#main button').forEach(btn=>{
      if(btn.dataset.action || btn.dataset.route || btn.hasAttribute('data-mie-close'))return;
      const t=(btn.textContent||'').trim();
      if(/^Filtrele$/i.test(t))btn.dataset.action='cari-filter-apply';
    });
  }

  // Generic table row actions: Cari modülünde burada kes.
  document.addEventListener('click',function(e){
    if(!CARI_BUTTON_ROUTES.has(baseRoute()))return;
    const btn=e.target.closest('button[data-action="row-open"],button[data-action="row-actions"]');
    if(!btn)return;

    const key=btn.dataset.key||'';
    if(!key.startsWith('cari-'))return;

    e.preventDefault();
    e.stopImmediatePropagation();

    const row=Number(btn.dataset.row)||0;
    if(btn.dataset.action==='row-open')cariRowOpen(key,row);
    else cariRowActions(key,row);
  },true);

  // Modal içi ve kalan Cari aksiyonları.
  document.addEventListener('click',async function(e){
    const a=e.target.closest('[data-action]');
    if(!a)return;
    const act=a.dataset.action;

    if(act==='cari-filter-apply'){
      e.preventDefault();e.stopImmediatePropagation();
      toast('Cari listesi filtrelendi');
      return;
    }

    if(act==='cari-demo-phone'){
      e.preventDefault();e.stopImmediatePropagation();
      modal('Telefon',`<div class="notice"><b>${esc(a.dataset.value||'')}</b> aranacak.</div>`,'Kapat');
      return;
    }
    if(act==='cari-demo-whatsapp'){
      e.preventDefault();e.stopImmediatePropagation();
      modal('WhatsApp',`<div class="notice"><b>${esc(a.dataset.value||'')}</b> için WhatsApp konuşması açılacak.</div>`,'Kapat');
      return;
    }
    if(act==='cari-demo-mail'){
      e.preventDefault();e.stopImmediatePropagation();
      modal('E-Posta',`<div class="cari-fields">
        ${cariField('Alıcı','email',a.dataset.value||'')}
        ${cariField('Konu','text','')}
        ${cariField('Mesaj','textarea','')}
      </div>`,'Taslak Oluştur',()=>toast('E-posta taslağı oluşturuldu'));
      return;
    }
    if(act==='copy-bank-iban'){
      e.preventDefault();e.stopImmediatePropagation();
      try{await navigator.clipboard.writeText(a.dataset.value||'');toast('IBAN kopyalandı');}
      catch(_){toast('IBAN: '+(a.dataset.value||''));}
      return;
    }
    if(act==='cari-demo-file-open'){
      e.preventDefault();e.stopImmediatePropagation();
      modal('Dosya Önizleme',`<div class="notice"><b>${esc(a.dataset.value||'Dosya')}</b> önizleme alanı burada açılacak.</div>
        <div style="height:220px;border:1px solid var(--line);border-radius:8px;background:#f7fafb;display:grid;place-items:center;color:#71838c">Dosya Önizleme</div>`,'Kapat');
      return;
    }
    if(act==='cari-demo-file-download'){
      e.preventDefault();e.stopImmediatePropagation();
      toast((a.dataset.value||'Dosya')+' indirildi');
      return;
    }
    if(act==='cari-demo-default-address'){
      e.preventDefault();e.stopImmediatePropagation();toast('Adres varsayılan olarak işaretlendi');return;
    }
    if(act==='cari-demo-primary-person'){
      e.preventDefault();e.stopImmediatePropagation();toast('Yetkili birincil kişi yapıldı');return;
    }
    if(act==='cari-demo-default-bank'){
      e.preventDefault();e.stopImmediatePropagation();toast('Banka hesabı varsayılan yapıldı');return;
    }
  },true);

  // Every Cari render gets wiring after final DOM is present.
  const renderV1016=render;
  render=function(){
    renderV1016();
    if(CARI_BUTTON_ROUTES.has(baseRoute())){
      setTimeout(wirePlainCariButtons,0);
    }
  };

  // Clicking a tab can re-create button DOM.
  document.addEventListener('click',function(e){
    if(CARI_BUTTON_ROUTES.has(baseRoute()) && e.target.closest('[data-tab]')){
      setTimeout(wirePlainCariButtons,10);
    }
  },true);

  // Debug helper: count visible Cari buttons and how many are wired.
  window.marsCariButtonAudit=function(){
    if(!CARI_BUTTON_ROUTES.has(baseRoute()))return {screen:baseRoute(),buttons:0,wired:0,unwired:[]};
    wirePlainCariButtons();
    const buttons=[...document.querySelectorAll('#main button')].filter(b=>b.offsetParent!==null);
    const unwired=buttons.filter(b=>!b.dataset.action && !b.dataset.route && !b.hasAttribute('data-mie-close'));
    return {
      screen:baseRoute(),
      buttons:buttons.length,
      wired:buttons.length-unwired.length,
      unwired:unwired.map(b=>(b.textContent||'').trim())
    };
  };

  setTimeout(wirePlainCariButtons,0);
})();
</script>

<script id="mars-v11-global-quality-script">
(function(){
  // ==========================================================
  // A. Görünür ürün: sade ön muhasebe bilgi mimarisi
  // ==========================================================
  const V11_MENU = [

        <div><h2>${esc(g.title)}</h2><div class="sub">${esc(g.no)} · ${esc(g.lang)} · ${esc(g.rev)}</div></div>

        <button class="btn" data-action="install-pdf-v136">PDF Oluştur</button>
        <button class="btn primary" data-route="product_install_guide_builder:${esc(p.code)}">Düzenle</button>

        <div>
          <div class="install-kpis">
            <div><small>Adım</small><strong>${g.steps.length}</strong></div>
            <div><small>Parça</small><strong>${g.parts.length}</strong></div>
            <div><small>Alet</small><strong>${g.tools.length}</strong></div>
            <div><small>Uyarı</small><strong>${g.warnings.length}</strong></div>
            <div><small>Durum</small><strong>${esc(g.status)}</strong></div>
          </div>
        </div>
        <div>${pagePreview(g,p)}</div>
      </div>
    </div>`;
    if(tab==='Parçalar')return `<div class="install-parts">${g.parts.map(([q,n])=>`<div class="install-part"><div class="qty">${esc(q)}</div><div><b>${esc(n)}</b></div></div>`).join('')}</div>`;
    if(tab==='Kurulum Adımları')return `<div class="install-step-list">${g.steps.map((st,i)=>`<div class="install-step"><div class="num">${i+1}</div><div><div class="title">${esc(st.title)}</div><div class="desc">${esc(st.desc)}</div></div><div class="thumb">${esc(st.image)}</div><div></div></div>`).join('')}</div>`;
    if(tab==='Görseller')return `<div class="prod-tech-photo-grid">${g.steps.slice(0,4).map((st,i)=>`<div class="prod-tech-photo"><div class="ph">${esc(st.image)}</div><div class="meta"><b>Adım ${i+1}</b><div class="sub">${esc(st.title)}</div></div></div>`).join('')}</div>`;
    return `<div class="tablecard">${tableHtml(['Dosya','Tür','Açıklama','Tarih'],[

    ],'install-files-v136')}</div>`;
  };

  // Ürün detayına Kurulum Kılavuzu sekmesi ve aksiyonu.
  if(SCREENS.product_detail){
    const tabs=SCREENS.product_detail.tabs||[];
    if(!tabs.includes('Kurulum Kılavuzu')){
      const idx=tabs.indexOf('Teknik Bilgi Föyü');
      tabs.splice(idx>=0?idx+1:tabs.length,0,'Kurulum Kılavuzu');
    }
    const acts=SCREENS.product_detail.actions||[];
    if(!acts.includes('Kurulum Kılavuzu'))acts.push('Kurulum Kılavuzu');
  }

  if(R.product_detail_readonly){
    const prev=R.product_detail_readonly;
    R.product_detail_readonly=function(c){
      const tab=c.tabs[activeTabs[c.key]||0]||'Genel Bakış';
      if(tab==='Kurulum Kılavuzu'){
        const p=guideProduct(), g=guideFor(p.code);
        return `<div class="install-shell">
          <div class="toolbar">
            <b>${esc(g.title)}</b>
            <div class="grow"></div>
            <button class="btn" data-route="product_install_guide_detail:${esc(p.code)}">Kılavuzu Aç</button>
            <button class="btn primary" data-route="product_install_guide_builder:${esc(p.code)}">PDF Oluştur / Düzenle</button>

          <div class="install-kpis">
            <div><small>Kurulum Adımı</small><strong>${g.steps.length}</strong></div>
            <div><small>Parça</small><strong>${g.parts.length}</strong></div>
            <div><small>Revizyon</small><strong>${esc(g.rev)}</strong></div>
            <div><small>Dil</small><strong>${esc(g.lang)}</strong></div>
            <div><small>Durum</small><strong>${esc(g.status)}</strong></div>
          </div>
        </div>`;
      }
      return prev(c);
    };
  }

  const prevBusiness=marsApplyBusinessAction;
  marsApplyBusinessAction=function(action){
    if(baseRoute()==='product_detail' && action==='Kurulum Kılavuzu'){
      navigate('product_install_guide_builder:'+(idParam()||'AVZ-2032'));
      return;
    }
    return prevBusiness(action);
  };

  function stepModal(index){
    const p=guideProduct(),g=guideFor(p.code);
    const st=Number.isInteger(index)&&g.steps[index]?g.steps[index]:{title:'',desc:'',image:''};
    modal(index==null?'Kurulum Adımı Ekle':'Kurulum Adımını Düzenle',
      `<div class="install-form">
        ${instField('Başlık','text',st.title,true)}
        ${instField('Açıklama','textarea',st.desc)}
        ${instField('Görsel','file','')}
        ${instField('Görsel Açıklaması','text',st.image||'')}
      </div>`,
      'Kaydet',()=>toast('Kurulum adımı kaydedildi'));
  }

  function createPrintDocument(g,p){
    const rows=g.steps.map((st,i)=>`
      <div class="pstep">
        <div class="pn">${i+1}</div>
        <div><b>${esc(st.title)}</b><div>${esc(st.desc)}</div></div>
        <div class="ppic">${esc(st.image||'Görsel')}</div>
      </div>`).join('');
    const parts=g.parts.map(([q,n])=>`<div class="part"><b>${esc(q)}×</b> ${esc(n)}</div>`).join('');
    const warnings=g.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('');
    const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(g.title)}</title>
      <style>
        @page{size:A4 portrait;margin:13mm}
        *{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172833;margin:0;font-size:10pt}
        header{display:flex;border-bottom:2px solid #253d4b;padding-bottom:8px;margin-bottom:12px}
        header .r{margin-left:auto;text-align:right}h1{font-size:21pt;margin:0 0 4px}h2{font-size:12pt;border-bottom:1px solid #b8c4cb;padding-bottom:4px;margin:13px 0 7px}
        .product{display:grid;grid-template-columns:48mm 1fr;gap:8mm}.photo{height:42mm;background:#eef3f6;border:1px solid #ccd7dd;display:grid;place-items:center}
        .meta{display:grid;grid-template-columns:1fr 1fr;gap:3px}.meta div,.part{border:1px solid #dbe3e8;padding:5px}
        .parts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.warn{border-left:3px solid #d4930a;background:#fff8e3;padding:6px 8px;margin-bottom:4px}
        .pstep{display:grid;grid-template-columns:8mm 1fr 32mm;gap:4mm;align-items:center;border-bottom:1px solid #dfe5e8;padding:5px 0;break-inside:avoid}
        .pn{width:7mm;height:7mm;border-radius:50%;background:#e8f4fa;color:#126f9a;display:grid;place-items:center;font-weight:bold}.ppic{height:18mm;background:#f3f6f8;border:1px solid #d5dfe4;display:grid;place-items:center;font-size:8pt;text-align:center}
        footer{margin-top:12px;border-top:1px solid #9eabb3;padding-top:5px;display:flex;justify-content:space-between;color:#65747c;font-size:8pt}
      </style></head><body>
      <header><div><b>Noya Aydınlatma</b><div>Ürün Kurulum Kılavuzu</div></div><div class="r">${esc(g.no)}<br>${esc(g.rev)} · ${esc(g.updated)}</div></header>
      <h1>${esc(p.name||p.code)}</h1>
      <div class="product"><div class="photo">Ürün Ana Görseli</div><div class="meta"><div><small>Ürün Kodu</small><br><b>${esc(p.code)}</b></div><div><small>Marka</small><br><b>${esc(p.brand||'Noya')}</b></div><div><small>Dil</small><br><b>${esc(g.lang)}</b></div><div><small>Revizyon</small><br><b>${esc(g.rev)}</b></div></div></div>
      <h2>Güvenlik Uyarıları</h2>${warnings}
      <h2>Kutu İçeriği</h2><div class="parts">${parts}</div>
      <h2>Kurulum Adımları</h2>${rows}
      <h2>Son Kontrol</h2><p>Tüm bağlantıları, vidaları, elektrik bağlantılarını ve dekoratif parçaları kontrol edin. Ürünü enerji verdikten sonra test edin.</p>
      <footer><span>Noya Aydınlatma</span><span>${esc(p.code)} · ${esc(g.rev)}</span></footer>
</body></html>`;
    const w=window.open('','_blank');
    if(!w){toast('PDF önizleme penceresi açılamadı');return;}
    w.document.open();w.document.write(doc);w.document.close();
    setTimeout(()=>w.print(),300);
  }

  document.addEventListener('click',function(e){
    const a=e.target.closest('[data-action]');if(!a)return;
    const act=a.dataset.action;
    if(act==='install-step-add-v136'){e.preventDefault();e.stopImmediatePropagation();stepModal(null);return}
    if(act==='install-step-edit-v136'){e.preventDefault();e.stopImmediatePropagation();stepModal(+a.dataset.step);return}
    if(act==='install-step-up-v136'||act==='install-step-down-v136'){e.preventDefault();e.stopImmediatePropagation();toast('Kurulum adımı sırası değiştirildi');return}
    if(act==='install-warning-add-v136'){e.preventDefault();e.stopImmediatePropagation();modal('Güvenlik Uyarısı Ekle',instField('Uyarı','textarea',''),'Ekle',()=>toast('Uyarı eklendi'));return}
    if(act==='install-tool-add-v136'){e.preventDefault();e.stopImmediatePropagation();modal('Alet Ekle',instField('Alet','text',''),'Ekle',()=>toast('Alet eklendi'));return}
    if(act==='install-part-add-v136'){e.preventDefault();e.stopImmediatePropagation();modal('Parça Ekle',`<div class="install-form">${instField('Parça','text','')}${instField('Miktar','number','1')}</div>`,'Ekle',()=>toast('Parça eklendi'));return}
    if(act==='install-save-v136'){e.preventDefault();e.stopImmediatePropagation();toast('Kurulum kılavuzu taslağı kaydedildi');return}
    if(act==='install-preview-v136'||act==='install-pdf-v136'){
      e.preventDefault();e.stopImmediatePropagation();
      const p=guideProduct(),g=guideFor(p.code);
      createPrintDocument(g,p);
      return;
    }
  },true);

  Object.assign(window,{INSTALL_GUIDES});
  if(['product_install_guides','product_install_guide_builder','product_install_guide_detail'].includes(baseRoute()))render();
})();
</script>
