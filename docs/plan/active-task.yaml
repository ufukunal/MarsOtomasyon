id: PARTY-IMP-003
title: Add Turkish Tax Identity
module: parties
status: ready
progress: not_started
readiness_report: docs/plan/03-cariler/p5-third-slice-readiness.md
authorization_decision: docs/plan/decisions/ADR-0005-mars-erp-permission-authority.md

phase:
  id: P5
  name: Core application implementation
  status: implementation_in_progress

predecessor:
  id: PARTY-IMP-002
  title: Activate Party Role
  status: completed
  canonical_report: docs/plan/03-cariler/party-imp-002-implementation.md

goal:
  Add one ACTIVE Turkish VKN or TCKN identity to an existing company-scoped Party with deterministic company-level collision protection and no provider/checksum claim.

scope:
  include:
    - Parties-owned Tax Identity persistence
    - TR jurisdiction only
    - VKN 10-digit structural validation
    - TCKN 11-digit structural validation
    - party.tax_identity.manage authorization
    - trusted-company Party lookup
    - deterministic active company + jurisdiction + scheme + value conflict
    - additive EF migration
    - POST /api/v1/parties/{partyPublicId}/tax-identities
    - tax identity add section on /parties/new
    - audit without raw VKN/TCKN
    - durable idempotency
    - targeted tests
    - TEST deploy/smoke when deployable
  exclude:
    - checksum validation
    - GIB/provider enrollment or verification
    - generic non-TR tax schemes
    - tax identity read/read_full/list
    - tax identity edit/deactivate
    - soft/fuzzy duplicate review
    - Contact/Address
    - Party/role lifecycle
    - Merge
    - Finance/Sales/Purchasing behavior
    - production deployment
    - Full Test Day

locked_decisions:
  jurisdiction: TR
  schemes:
    VKN:
      structural_value: exactly_10_ascii_digits
    TCKN:
      structural_value: exactly_11_ascii_digits
  company_scope:
    authority: owning Party + trusted execution context
    request_company_field: forbidden
    physical_child_company_id: required_for_company_level_collision
  authorization:
    permission: party.tax_identity.manage
    authority: Mars-owned PostgreSQL Permission Grant via ADR-0005
    handler_enforcement: required
    endpoint_policy_enforcement: required
  privacy:
    raw_value_in_audit: forbidden
    raw_value_in_success_receipt: forbidden
  collision:
    grain: active company + jurisdiction + scheme + value
    deterministic: hard_conflict
  outbox:
    required: false
    reason: no accepted PartyTaxIdentityChanged consumer in current slice

