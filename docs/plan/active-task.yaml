  id: PARTY-IMP-003
  title: Add Turkish Tax Identity
  status: completed
  canonical_report: docs/plan/03-cariler/party-imp-003-implementation.md
  test_deploy_run: 35894175558

goal:
  Complete the existing CUSTOMER/SUPPLIER Party Role ACTIVE/INACTIVE state machine without creating a second Party identity or Finance effect.

scope:
  include:
    - existing Party Role ACTIVE to INACTIVE transition
    - existing Party Role INACTIVE to ACTIVE transition
    - party.role.manage authorization
    - trusted-company Party and Role lookup
    - positive expected-version concurrency contract
    - mandatory deactivation reason
    - durable idempotency and audit
    - POST /api/v1/parties/{partyPublicId}/roles/{role}/state
    - lifecycle controls on /parties/new after role activation
    - targeted verification
    - TEST deploy/smoke
  exclude:
    - new role types
    - Party deactivate/reactivate
    - soft/fuzzy duplicate review
    - Contact/Communication/Address
    - Merge
    - Tax Identity follow-up
    - Sales/Purchasing eligibility enforcement
    - Finance posting or balance authority
    - production deployment
    - Full Test Day

physical_model:
  new_entity: none
  new_table: none
  migration_required: false
  authority: existing parties.party_roles state + version

api:
  method: POST
  route: /api/v1/parties/{partyPublicId}/roles/{role}/state
  idempotency_key_required: true
  body:
    state: ACTIVE_or_INACTIVE
    version: positive_expected_version
    reason: required_only_for_INACTIVE
  company_id_in_request: forbidden

