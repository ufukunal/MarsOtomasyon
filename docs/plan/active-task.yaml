goal:
  Implement the repository-defined Mars.Web + Mars.UI Foundation without introducing ERP business-screen semantics or selecting later platform/deployment technologies.

source_basis:
  - docs/plan/01-foundation/framework-plan.md section 42: FW-IMP-006 Mars.Web + Mars.UI foundation
  - docs/plan/master-project-plan.md frontend architecture baseline
  - docs/reference/ui/marsotomasyon_ui_v38_cari_bakiye_sadelestirildi.html as product/UI reference, not production architecture

accepted_baseline:
  frontend:
    - HTML + CSS + TypeScript + ES Modules + Vite
    - Mars.UI is the project-owned UI/component system
    - no React, Vue, Angular, Bootstrap, Tailwind or jQuery in core frontend
  api:
    - /api/v1 remains the server contract baseline
    - OpenAPI generator remains Microsoft.AspNetCore.OpenApi 10.0.12
  authentication:
    - web prefers secure HttpOnly cookie/session semantics where appropriate
    - no localStorage token baseline
    - ERP permission/company/branch semantics remain server-side and Mars-owned

scope:
  include:
    - create Mars.Web Foundation project/tooling as required
    - Vite + TypeScript baseline
    - web shell
    - client-side router boundary
    - API client boundary
    - design-token baseline
    - Mars.UI Button baseline
    - Mars.UI Field baseline
    - Mars.UI Dialog baseline
    - Mars.UI Tabs baseline
    - Mars.UI Lookup baseline
    - Mars.UI Grid baseline
    - targeted build/component/static verification
  exclude:
    - ERP business screens or business rules
    - Sales/Party/Product/etc. workflow implementation
    - Desktop shell technology selection
    - Mobile shell technology selection
    - production deployment
    - Docker/test deployment baseline
    - production secret store
    - production reverse proxy/tunnel details
    - unrelated logging/metrics, file-storage or scheduling decisions

decision_gate_review:
  fw_imp_006_specific_blocker: none_identified
  note:
    - Desktop/Mobile shell technology remains a later P10 decision and must not be selected here.
    - Deployment and production ingress decisions remain later work.
    - If implementation exposes a genuinely new FW-IMP-006-specific owner decision, mark only that narrow point BLOCKED instead of guessing.

