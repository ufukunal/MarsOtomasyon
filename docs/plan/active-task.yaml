required_start:
  - verify current main HEAD
  - read governance and master planning sources
  - read frozen Sales, Party, Product/Inventory, Purchasing, Warehouse and Finance contracts
  - inspect every existing file under docs/plan/10-cek-senet/
  - route exact primary/reviewer skills before changing files
  - use V38 repository HTML as product-flow reference before external research
  - report master-sequence and P2 planning percentages during long sessions and in final SESSION REPORT

known_dependencies:
  - Account/Cash/Bank ledgers remain Finance authority.
  - CUSTOMER and SUPPLIER role balances remain separate and balance-only; no Invoice allocation/open-item authority.
  - Collection/Payment Cash/Bank effects are Finance-owned.
  - Checks/Promissory Notes must not create a second Party balance or Cash/Bank truth.
  - instrument custody/lifecycle may change before monetary realization; recognition points must be explicit.
  - posted financial history uses reversal/compensation, not silent mutation.
  - PLAN-009 Returns/RMA must follow this task before logical database planning.

