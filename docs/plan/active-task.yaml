goal:
  Change one existing trusted-company Party from ACTIVE to INACTIVE with expected-version concurrency, mandatory reason, audit and durable idempotency.

scope:
  include:
    - Party ACTIVE to INACTIVE
    - party.deactivate authorization
    - trusted-company Party lookup
    - positive expected-version concurrency contract
    - mandatory deactivation reason
    - durable idempotency and audit
    - POST /api/v1/parties/{partyPublicId}/deactivate
    - deactivation control on /parties/new after Party creation
    - targeted verification
    - TEST deploy/smoke
  exclude:
    - Party reactivate
    - soft/fuzzy duplicate review
    - Contact/Communication/Address
    - Merge
    - Party External Mapping
    - Tax Identity follow-up
    - Sales/Purchasing eligibility enforcement
    - Finance posting or balance authority
    - production deployment
    - Full Test Day

physical_model:
  new_entity: none
  new_table: none
  migration_required: false
  authority: existing parties.parties state + version

api:
  method: POST
  route: /api/v1/parties/{partyPublicId}/deactivate
  idempotency_key_required: true
  body:
    version: positive_expected_version
    reason: required
  company_id_in_request: forbidden

