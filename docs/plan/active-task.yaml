owner_direction:
  - implement Warehouse as one broad coherent tranche
  - do not split disposition, put-away, pick-pack-stage-load, transfer, count, scrap or offline journal into micro package IDs
  - preserve Inventory Ledger authority and Sales/Purchasing posting ownership
  - ordinary technical decisions belong to active skills unless they introduce new business/legal/provider/cross-module semantics

scope:
  include:
    - PLAN-006 Warehouse permission catalog
    - Warehouse receiving/quarantine read queue over Purchasing Goods Receipt
    - physical disposition commands through Inventory authority
    - put-away and manual replenishment internal movements
    - Warehouse pick work linked to Sales Dispatch
    - FEFO/FIFO recommendation projection and controlled override
    - narrow Sales-owned pre-POST Dispatch source-binding contract
    - packing/package structures
    - staging/loading operational work
    - Warehouse Transfer ISSUE/TRANSIT/partial RECEIVE/reconciliation/reversal
    - Stock Count snapshot/intervening/review/approval workflow
    - negative Count Adjustment posting through Inventory
    - positive Count Adjustment fail-closed until Finance valuation authority exists
    - damage and scrap physical authority with approval/SoD
    - Warehouse/Location deactivation operational blocker integration
    - server-side offline/client-operation journal and conflict evidence
    - protected API, Mars.Web /warehouse and rebuildable read projections
    - additive EF migration and TEST deployment
  exclude:
    - duplicate Sales Dispatch POST
    - duplicate Purchasing Goods Receipt POST
    - Finance valuation/COGS/write-off postings
    - positive Count Adjustment physical POST before Finance valuation authority
    - full Quality inspection/result module
    - automatic replenishment/slotting optimizer
    - MRP
    - carrier/label/tracking provider implementation
    - robotics/WMS provider
    - Device Layer/mobile/Desktop shell
    - exact capacity policy administration
    - production deployment
    - Full Test Day

implementation_decisions:
  - Inventory physical authority is reused for every Warehouse movement; no second stock ledger
  - existing Inventory persistence joins ambient MarsDbContext transactions
  - TRANSIT physical position is represented in target Warehouse with null Location and TRANSIT disposition
  - pick/pack/stage/load have no Inventory movement
  - Sales owns Dispatch tables and POST; Warehouse may use a narrow Sales-owned source-binding contract only before POST
  - Purchasing owns Goods Receipt POST; Warehouse begins from posted receipt lineage
  - positive count adjustment is blocked with valuation-required outcome until Finance/Costing authority exists
  - manual capacity checks are limited to existing active/stock-bearing Location rules until capacity configuration exists

