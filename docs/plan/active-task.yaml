goal:
  Freeze Finance / Treasury workflows for account, cash, bank, settlement, transfers, reconciliation, FX and financial reversal behavior before logical database design or application implementation.

scope:
  allowed_paths:
    - docs/plan/09-finans-kasa-banka/
    - docs/plan/project-state.yaml
    - docs/plan/active-task.yaml
    - docs/plan/handoff/current.md
    - docs/plan/tasks/
  forbidden_paths:
    - src/
    - tests/
    - docs/db/schema/
  db_implementation: false
  api_implementation: false
  ui_implementation: false
  integration_implementation: false

required_start:
  - verify current main HEAD
  - read governance and master planning sources
  - read frozen Sales, Party, Product/Inventory, Purchasing and Warehouse contracts
  - inspect existing docs/plan/09-finans-kasa-banka/ before planning
  - route exact primary/reviewer skills before changing files
  - use V38 repository HTML as product-flow reference before external research
  - report master-sequence and P2 planning percentages during long sessions and in final SESSION REPORT

known_dependencies:
  - account, cash and bank ledgers are authoritative financial truth.
  - customer/supplier mutable balance fields are forbidden.
  - Sales Collection is balance-only and has no authoritative Invoice allocation/open-item model.
  - Supplier Payment is Finance-owned; Purchasing does not own settlement/allocation.
  - Sales Invoice creates receivable and financial COGS.
  - Supplier Invoice creates payable.
  - physical stock effects remain Inventory/Warehouse-owned.
  - inventory valuation/costing method and positive count/scrap value consequences require Finance ownership.
  - posted financial history uses reversal/compensation, not silent mutation.

