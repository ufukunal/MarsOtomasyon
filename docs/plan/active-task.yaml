scope:
  include:
    - Warehouse master and lifecycle without mutable stock totals
    - Location hierarchy/master/lifecycle with stock-bearing semantics
    - controlled physical dispositions AVAILABLE/QUARANTINE/QUALITY_HOLD/REWORK/DAMAGED/TRANSIT
    - Lot identity and metadata with ledger-derived quantity
    - Serial identity and ledger-derived single physical position
    - append-oriented authoritative Inventory Ledger
    - Inventory-owned non-physical Reservation authority and history
    - Product/Variant/UOM/tracking enforcement and movement snapshots
    - stock/availability/movement/reservation/lot/serial read surfaces
    - permissions/API/Mars.Web/audit/idempotency/concurrency/targeted tests
    - additive EF model/migration and TEST deployment
  exclude:
    - Sales Order/Dispatch workflow
    - Purchase Order/Goods Receipt workflow
    - Returns workflow
    - receiving/put-away/pick/pack/stage/load operational work
    - Warehouse Transfer workflow/state machine
    - Stock Count workflow/session/approval
    - replenishment/damage/scrap operational workflows
    - offline/mobile Warehouse work execution
    - arbitrary public physical movement posting
    - free-form Reservation mutation disconnected from Sales Order line/version
    - arbitrary user-created physical dispositions
    - inventory valuation/current cost/moving average/cost layers/COGS
    - Product Base UOM replacement or post-use STOCKABLE/tracking transitions
    - transaction UOM fraction/scale business policy
    - production deployment
    - Full Test Day

implementation_decisions:
  schema: inventory
  warehouse_permissions: later frozen PLAN-006 warehouse.* namespace
  stock_read_permission: inventory.stock.read
  inventory_trace_permission: inventory.trace.read
  physical_posting_surface: internal Inventory contract only until an owning source workflow exists
  reservation_mutation_surface: internal Inventory contract; externally initiated by later Sales workflow
  stock_authority: posted Inventory Ledger only
  reservation_authority: append-oriented Inventory Reservation history
  valuation_authority: Finance/Costing only

