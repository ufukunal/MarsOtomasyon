id: PARTY-IMP-002
title: Activate Party Role
module: parties
status: ready
progress: not_started
readiness_report: docs/plan/03-cariler/p5-second-slice-readiness.md
authorization_decision: docs/plan/decisions/ADR-0005-mars-erp-permission-authority.md

phase:
  id: P5
  name: Core application implementation
  status: implementation_in_progress

predecessor:
  id: PARTY-IMP-001
  title: Create Party Core Identity
  status: completed
  canonical_report: docs/plan/03-cariler/party-imp-001-implementation.md

goal:
  Activate one CUSTOMER or SUPPLIER role on an existing company-scoped Party without creating a duplicate Party identity or any Finance posting.

scope:
  include:
    - Parties-owned Party Role authoritative persistence
    - CUSTOMER and SUPPLIER activation
    - party.role.manage authorization
    - additive EF migration
    - POST /api/v1/parties/{partyPublicId}/roles
    - post-create role activation actions on /parties/new
    - audit
    - durable idempotency
    - targeted tests
    - TEST deploy/smoke when deployable
  exclude:
    - role deactivate/reactivate
    - role-specific defaults or role codes
    - Tax Identity
    - Contact Person / Communication Point
    - Address
    - soft/fuzzy duplicate review
    - External Mapping
    - Merge
    - Finance balance/risk/ledger
    - Sales/Purchasing eligibility integration
    - production deployment
    - Full Test Day

locked_decisions:
  role:
    types:
      - CUSTOMER
      - SUPPLIER
    activation_state: ACTIVE
    duplicate_master_identity: forbidden
    finance_posting_effect: none
  company_scope:
    authority: owning Party
    request_company_field: forbidden
    lookup: trusted CompanyId + Party public UUID
  authorization:
    permission: party.role.manage
    authority: Mars-owned PostgreSQL Permission Grant via ADR-0005
    handler_enforcement: required
    endpoint_policy_enforcement: required
  persistence:
    role_company_id_column: not_required
    role_public_uuid: not_required_in_this_slice
    unique: Party + RoleType
    party_fk_delete: restrict
    optimistic_version: required
  api:
    route: POST /api/v1/parties/{partyPublicId}/roles
    idempotency_key: required
  outbox:
    required: false
    reason: no accepted PartyRoleActivated consumer in current slice

planning_progress:
  master_sequence:
