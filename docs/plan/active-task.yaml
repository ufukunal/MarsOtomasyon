owner_direction:
  - broaden Party implementation scope instead of creating one work package per small capability
  - group coherent source-backed Party master capabilities into one implementation tranche
  - normal technical implementation choices are owned by active skills unless they introduce a new business rule

scope:
  include:
    - Party directory/list/detail/read surface
    - edit Party legal/display identity with optimistic concurrency
    - Contact Person and Communication Point persistence/read/manage/lifecycle
    - Address persistence/read/manage/lifecycle and source-backed purpose/default semantics
    - existing TR VKN/TCKN Tax Identity read/masking and lifecycle
    - Party External Mapping read/manage/lifecycle with deterministic scoped uniqueness
    - explicit same-company Party Merge with source-to-survivor lineage and conflict resolution
    - required permissions/API/Mars.Web/audit/idempotency/concurrency/targeted tests
    - additive EF model/migration work required by these capabilities
  exclude:
    - soft/fuzzy duplicate candidate generation/scoring/thresholds
    - Party Reactivation until duplicate/legal-identity rerun prerequisite is resolved
    - provider/GIB verification or enrollment
    - non-TR Tax Identity schemes
    - Communications consent/channel-preference policy
    - Sales/Purchasing consuming eligibility implementation
    - Finance ledger/risk/settlement behavior
    - production deployment
    - Full Test Day

scope_rules:
  - preserve PARTY-IMP-001 through PARTY-IMP-005 behavior
  - company scope applies to every Party read and mutation
  - deterministic Party Code, active Tax Identity and External Mapping collisions are hard conflicts
  - fuzzy matching never becomes authority and never auto-merges
  - live master changes and merge never rewrite historical document snapshots
  - merge creates no Finance/stock/account/cash-bank/cost posting and no automatic netting
  - MERGED is terminal for new Party selection
  - mutable master records use stale-write protection
  - retryable mutations use durable PostgreSQL idempotency
  - sensitive Tax Identity reads respect party.tax_identity.read_full
  - no provider-specific or new business semantics are invented

