id: PARTY-IMP-001
title: Create Party Core Identity
module: parties
status: ready
progress: not_started
readiness_report: docs/plan/03-cariler/p5-first-slice-readiness.md
authorization_decision: docs/plan/decisions/ADR-0005-mars-erp-permission-authority.md

phase:
  id: P5
  name: Core application implementation
  status: implementation_ready

goal:
  Implement the first real Parties vertical slice: create one company-scoped PERSON/ORGANIZATION Party identity before optional role activation.

scope:
  include:
    - Foundation Mars Permission Grant persistence/evaluator sufficient for party.create
    - Party core aggregate and persistence
    - additive EF migration
    - POST /api/v1/parties
    - /parties/new Mars.Web identity-only flow
    - audit
    - durable idempotency
    - targeted tests
    - TEST deploy/smoke when deployable
  exclude:
    - Party Role
    - Tax Identity
    - Contact Person
    - Communication Point
    - Address
    - Party External Mapping
    - Party Merge Lineage
    - soft/fuzzy duplicate candidate detection
    - Settings/Numbering allocator
    - permission administration UI/role-group model
    - Sales/Product/Inventory/Purchasing/Warehouse/Finance implementation
    - production deployment
    - Full Test Day

locked_decisions:
  permission:
    authority: Mars-owned PostgreSQL Permission Grant
    grain: ActorId + CompanyId + PermissionCode
    required_permission: party.create
    identity_or_token_claim_is_authority: false
    command_handler_enforcement: required
    endpoint_policy_enforcement: required_defense_in_depth
  party_code:
    source: required caller input
    allocator_in_scope: false
    exact_format_in_scope: false
    uniqueness: exact stored Party Code within trusted CompanyId
    leading_trailing_whitespace: reject
    case_normalization: none_invented
  duplicate_detection:
    deterministic_first_slice:
      - company-scoped Party Code uniqueness
      - public UUID uniqueness
      - idempotency uniqueness
    soft_fuzzy_warning: explicitly_deferred
  company_reference:
    source: trusted IExecutionContext CompanyId
    request_company_field: forbidden
    physical_company_fk: not_in_this_slice

candidate_contract:
  db:
    internal_key: BIGINT-style
    public_id: UUID
    company_id: UUID_required_no_fk
    party_code: required_company_scoped_unique
    kind: PERSON_OR_ORGANIZATION
    legal_name: required
    display_name: optional
    initial_state: ACTIVE
    optimistic_version: required
  api:
    route: POST /api/v1/parties
    authentication: required
    permission: party.create
    idempotency_key: required
  ui:
    route: /parties/new
    fields:
      - Party Code
      - Kind
      - Legal Name
      - Display Name optional

planning_progress:
  master_sequence:
    completed: 9
    total: 30
    percent: 30.0
  p2_core_commercial:
    completed: 8
    total: 8
    percent: 100.0

test_policy:
  normal_development:
    - release-build
    - targeted-party-tests
    - targeted-authorization-tests
    - migration-model-check
    - frontend-typecheck-test-build
    - small-api-smoke
    - test-deploy-smoke-when-deployable
  heavy_tests: FULL_TEST_DAY_ONLY
