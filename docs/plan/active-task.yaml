locked_contracts:
  - Quote does not post reservation, stock, account or cash/bank effects.
  - Sales Order is commercial demand and is not physical stock-out or receivable posting.
  - Reservation is a non-physical commitment linked to Sales Order lines.
  - Dispatch POST/finalization is the normal physical stock-out point.
  - Dispatch consumes/releases related reservation quantity.
  - Sales Invoice POST/finalization creates customer receivable.
  - Dispatch-sourced invoice cannot post stock a second time.
  - Collection is a separate Finance event.
  - Physical return and financial credit/refund are separate.
  - Partial shipment/invoicing use line-level source-target traceability.
  - Posted history is reversed/compensated, never silently overwritten.

blocked_by:
  - SALES-B001: Collection allocation model
  - SALES-B002: Source-less/direct Sales Invoice stock behavior
  - SALES-B003: Quote full vs partial conversion
  - SALES-B004: Reservation trigger policy
  - SALES-B005: Cost/COGS recognition point
  - SALES-B006: Sales tax/discount/rounding/FX calculation policy
  - SALES-B007: Quote/Order approval policy and thresholds
  - SALES-B008: Confirmed-order amendment policy

