owner_direction:
  - broad coherent implementation tranches
  - do not split Purchase Order, Goods Receipt, matching and Supplier Invoice preparation into micro package IDs
  - preserve Inventory, Quality and Finance ownership boundaries
  - ordinary technical decisions belong to active skills unless they introduce new business/legal/provider/cross-module semantics

scope:
  include:
    - Purchase Order commercial authority and controlled versions/amendments
    - supplier and Product/UOM eligibility
    - Goods Receipt physical STOCK IN through Inventory authority
    - stockable receipt initial QUARANTINE disposition
    - partial receipt and source quantity caps
    - lot/serial receipt lineage
    - 2-way and 3-way matching evidence
    - over-receipt and over-invoice fail-closed behavior
    - explicit exception approval evidence when policy later permits tolerance
    - Supplier Invoice DRAFT/source/calculation authority
    - Finance-dependent Supplier Invoice POST remains fail-closed until Finance authority exists
    - Purchase Return source preparation/lineage without duplicating Returns/Finance authority
    - protected API/Mars.Web/read projections
    - additive EF migration and TEST deployment
  exclude:
    - Finance Supplier Payable posting
    - Supplier Payment/settlement/allocation
    - Inventory Valuation/landed-cost accounting
    - Quality implementation itself
    - Warehouse operational put-away
    - provider/tax/e-document integrations
    - production deployment
    - Full Test Day

