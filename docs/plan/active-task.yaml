id: P5
title: Parties first vertical slice — Create Party Core Identity
module: parties
status: blocked_decision_required
progress: scope_defined_implementation_not_started
work_package_id: not_assigned
readiness_report: docs/plan/03-cariler/p5-first-slice-readiness.md

phase:
  id: P5
  name: Core application implementation
  status: blocked_decision_required

selected_slice:
  name: Create Party Core Identity
  purpose: create one company-scoped PERSON/ORGANIZATION Party before optional commercial role activation
  authoritative_entities:
    - Party
  deferred_entities:
    - Party Role
    - Tax Identity
    - Contact Person
    - Communication Point
    - Address
    - Party External Mapping
    - Party Merge Lineage
  effects:
    master: CREATE
    reservation: NONE
    stock: NONE
    account: NONE
    cash_bank: NONE
    cost: NONE
    audit: REQUIRED
    outbox: OPTIONAL_NOT_REQUIRED_WITHOUT_ACCEPTED_CONSUMER

candidate_contract:
  db:
    internal_key: BIGINT-style
    public_id: UUID
    company_scope: trusted execution context CompanyId
    party_code: required_company_scoped_unique
    kind: PERSON_OR_ORGANIZATION
    legal_name: required
    display_name: optional
    initial_state: ACTIVE
    optimistic_version: required
  api:
    candidate_route: POST /api/v1/parties
    authentication: required
    permission: party.create
    client_company_authority: forbidden
    idempotency_key: required_candidate
  ui:
    candidate_route: /parties/new
    scope: identity-only create form using Mars.UI

blockers:
  - id: PARTY-BLK-001
    area: authorization
    status: BLOCKED
    decision: define Mars-owned permission authority/evaluation/grant contract for server-side party.create
    reason: current Foundation source has authentication and trusted scope but no accepted permission evaluator/grant/claim implementation
  - id: PARTY-BLK-002
    area: numbering
    status: BLOCKED
    decision: define initial Party Code assignment authority
    reason: Party Code is mandatory and Settings/Numbering-owned, but repository does not say manual vs allocated runtime assignment
  - id: PARTY-BLK-003
    area: duplicate_detection
    status: BLOCKED
    decision: freeze minimum soft duplicate-warning contract or explicitly approve first-slice deferral
    reason: Create Party requires candidate warnings but matching/normalization/threshold/query contract is absent
  - id: PARTY-BLK-004
    area: company_reference
    status: DECISION_REQUIRED
    decision: state whether first Party physical model uses trusted company UUID without FK until Company persistence exists, or requires Foundation Company persistence first
    reason: logical Company 1->N Party exists but current physical model has no Company table

implementation_gate:
  allowed_now:
    - blocker-resolution documentation/decision records
    - state/handoff updates
  forbidden_now:
    - Party domain implementation
    - Party EF mapping/migration
    - Party API endpoint
    - Party Web screen
    - dedicated implementation work-package ID
  unblock_when:
    - PARTY-BLK-001 resolved
    - PARTY-BLK-002 resolved
    - PARTY-BLK-003 resolved
    - PARTY-BLK-004 resolved or explicitly documented as non-blocking physical strategy

planning_progress:
  master_sequence:
    completed: 9
    total: 30
    percent: 30.0
  p2_core_commercial:
    completed: 8
    total: 8
    percent: 100.0

test_policy:
  normal_development:
    - build
    - targeted-unit-or-invariant
    - small-smoke-when-needed
    - migration-contract-check
  heavy_tests: FULL_TEST_DAY_ONLY
