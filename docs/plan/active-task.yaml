id: PLAN-006
title: Detail Warehouse operational contract
module: 06-ambar-depo
status: ready
progress: not_started

predecessor:
  id: PLAN-005
  status: completed_frozen
  evidence_commit: a8ef551310d910bcc38c8a383f2a5d86839621d1
  purchasing_plan: docs/plan/07-satinalma/

goal:
  Freeze Warehouse operational workflows for receiving, put-away, reservation execution, picking, packing, transfer, transit, counts and shipping verification before logical database design or application implementation.

scope:
  allowed_paths:
    - docs/plan/06-ambar-depo/
    - docs/plan/project-state.yaml
    - docs/plan/active-task.yaml
    - docs/plan/handoff/current.md
    - docs/plan/tasks/
  forbidden_paths:
    - src/
    - tests/
    - docs/db/schema/
  db_implementation: false
  api_implementation: false
  ui_implementation: false
  integration_implementation: false

required_start:
  - verify current main HEAD
  - read governance and master planning sources
  - read frozen Sales, Party, Product/Inventory and Purchasing contracts
  - inspect existing docs/plan/06-ambar-depo/ before planning
  - route exact primary/reviewer skills before changing files
  - use V38 repository HTML as product-flow reference before external research

known_dependencies:
  - Inventory Ledger remains authoritative physical quantity truth.
  - Reservation is non-physical and separate from physical disposition.
  - Sales Dispatch POST is physical STOCK OUT.
  - Purchasing Goods Receipt POST is physical STOCK IN to QUARANTINE.
  - Goods Receipt release to AVAILABLE is a separate disposition effect.
  - Supplier Invoice and Sales Invoice do not post physical stock.
  - lot/serial/location/status semantics follow frozen PLAN-004.
  - negative-stock, FEFO override and operational tolerance policy belong Warehouse planning.

next_action:
  id: PLAN-006
  title: Detail Warehouse operational contract

test_policy:
  heavy_tests: FULL_TEST_DAY_ONLY
  normal_session: documentation consistency checks only
