scope:
  include:
    - Finance transaction authority plus Account, Cash, Bank and Inventory Valuation ledgers
    - Collection, Supplier Payment, explicit advances/refunds and approved same-Party role netting
    - Cash/Bank masters, Cash Count and same-currency treasury transfers
    - posting periods, durable idempotency and compensating reversal
    - normalized bank statement evidence and reconciliation
    - customer credit limit, manual hold and risk exposure projection consumed by Sales
    - moving weighted-average valuation and exact Dispatch cost bridge
    - Goods Receipt provisional valuation integrated atomically with physical receipt
    - Sales Invoice POST/REVERSE with receivable and eligible bridge-to-COGS recognition
    - Supplier Invoice POST/REVERSE with payable and receipt-linked late price-cost allocation
    - Warehouse Count/Scrap valuation handoff including controlled positive Count valuation
    - protected Finance API and Mars.Web finance workspace
  exclude:
    - non-TRY authoritative posting, FX transfer, realized FX and unrealized revaluation until base-currency/rate authority exists
    - provider-specific bank/file adapters and outbound provider payment
    - standalone landed-cost document/custom allocation-policy administration
    - RMA-based refund entitlement until Returns authority exists
    - statutory General Ledger, Chart of Accounts, e-ledger and production tax filing
    - Checks/Promissory Notes implementation
    - production deployment
    - Full Test Day

