locked_decisions:
  - Only main branch is allowed.
  - No PR-based development workflow.
  - PostgreSQL is the authoritative source of truth.
  - Valkey is cache/session/lock only, not accounting truth.
  - Ledger-based stock and financial truth.
  - Posted records are corrected by reversal, not silent mutation.
  - Heavy test suites are deferred to Full Test Day.
  - No React, Vue, Angular, Bootstrap, Tailwind or jQuery in core frontend.
  - Mars uses its own UI/component system.
  - Web, Desktop and Mobile share a common client core with thin platform shells.
  - Architecture starts as modular monolith, not microservices.
  - Transactional module planning follows workflow -> effects -> state -> data -> API/UI order.
  - V38 is preserved as product/UI reference but its patch architecture is not production architecture.
  - Framework is shared infrastructure only; domain rules remain module-owned.
  - Every session ends with SESSION REPORT and standalone NEXT PROMPT.
  - Sales Quote has no reservation, stock, account or cash/bank posting effect.
  - Sales Order is not physical stock-out and does not create receivable.
  - Reservation is a non-physical inventory commitment linked to Sales Order lines.
  - Dispatch POST/finalization is the normal physical Sales stock-out point.
  - Dispatch consumes/releases related reservation quantity.
  - Sales Invoice POST/finalization creates customer receivable.
  - Dispatch-sourced Sales Invoice cannot post stock a second time.
  - Collection is a separate Finance event from Sales Invoice posting.
  - Physical sales return and financial credit/refund are separate concerns.
  - Sales partial shipment and partial invoicing require line-level source/target traceability.
  - Sales Collection uses balance-only current-account settlement; no Invoice allocation/open-item authority.
  - Direct/source-less Sales Invoice is financial-only and never posts STOCK OUT.
  - Quote conversion is partial/repeated at line/quantity level; all-zero remaining conversion marks Quote CONVERTED.
  - Sales Reservation is manually initiated from eligible Order context.
  - Sales financial COGS recognition occurs at Sales Invoice POST; physical STOCK OUT remains Dispatch POST.
  - Sales prices are KDV-exclusive; line discount -> document discount -> taxable base; posted monetary rounding follows currency minor unit and midpoint-away-from-zero.
  - Sales Invoice default FX source is TCMB doviz alis by invoice/tax-event date with prior-business-day fallback; controlled manual override is audited and approval-triggering.
  - Sales approval is conditional on commercial-policy exceptions; creator cannot approve own document/amendment.
  - Confirmed Sales Order amendments use audited controlled delta/versioning over unprocessed scope only.
  - Party is the company-scoped authoritative live counterparty master.
  - Party kind is PERSON or ORGANIZATION; CUSTOMER and SUPPLIER are roles and may coexist on one Party.
  - Party Code is company-scoped and role-neutral; exact numbering format remains Settings/Numbering-owned.
  - Party current balance, credit/risk/hold and settlement are not Party authority; Finance owns them.
  - Live Party edits/deactivation/merge never rewrite historical document snapshots.
  - Party duplicate fuzzy matching never auto-merges; deterministic identity collisions are conflicts.
  - Party merge is logical/audited with survivor/source lineage; merged history is retained.
  - INACTIVE and MERGED Parties are unavailable for new selection by default while history remains readable.
  - Party is company-scoped; silent cross-company Party sharing is forbidden.
  - Product is the company-scoped authoritative live item/service master; silent cross-company Product sharing is forbidden.
  - Product kind is GOODS or SERVICE; capabilities SELLABLE/PURCHASABLE/STOCKABLE are explicit and SERVICE cannot be STOCKABLE.
  - Variant is optional and represents an operationally meaningful Product-specific trade/stock identity.
  - Product Base UOM is the quantity normalization basis; alternate UOM conversions are positive decimal and historically snapshotted.
  - Active barcode mappings must resolve unambiguously to one Product/Variant/UOM trade identity; GS1 GTIN remains an external trade-item identifier.
  - Inventory Ledger is authoritative physical stock truth; Product/Warehouse/Location mutable stock totals are not authoritative.
  - Reservation remains a separate non-physical commitment; RESERVED is not a physical stock disposition.
  - Inventory Location and physical disposition/status are separate dimensions.
  - Physical statuses currently frozen are AVAILABLE, QUARANTINE, QUALITY_HOLD, REWORK, DAMAGED and TRANSIT.
  - Product tracking strategies are NONE, LOT, SERIAL and LOT_SERIAL; lot/serial quantity/position derives from posted Inventory Ledger history.
  - Live Product/Variant/UOM/barcode changes never rewrite frozen commercial or inventory document snapshots.
  - Product master does not own authoritative inventory valuation/current cost/COGS truth; Finance/Costing owns valuation policy.
  - Purchase Order is commercial commitment only and creates no physical stock or supplier payable.
  - Goods Receipt POST is Purchasing physical STOCK IN for stockable quantity and initially places it in QUARANTINE.
  - Goods Receipt alone creates no supplier payable; usable release is a separate disposition action.
  - Supplier Invoice POST creates supplier payable and never posts physical stock.
  - Stockable Supplier Invoice requires posted Goods Receipt evidence and 3-way PO/Receipt/Invoice match.
  - Service/non-stock PO invoice uses 2-way match; controlled direct source-less invoice is financial-only and cannot acquire stockable goods.
  - Over-receipt and over-invoice default to BLOCK; configured tolerance use requires explicit exception approval.
  - Purchase price variance defaults to zero tolerance unless Purchasing Match Policy defines a maximum; non-zero accepted variance requires approval.
  - Purchasing calculation/FX policy mirrors frozen Mars central KDV-exclusive/minor-unit/TCMB-doviz-alis convention.
  - Purchase physical return STOCK OUT and financial supplier adjustment are separate linked effects.
  - Supplier Payment is Finance-owned; Purchasing does not own settlement/allocation.
  - Normal Warehouse operations cannot create negative authoritative physical stock.
  - Warehouse pick eligibility requires AVAILABLE stock, valid source scope and valid lot/serial; expired stock is not normal-pick eligible.
  - Expiry-tracked stock uses FEFO recommendation; other stock uses FIFO; override requires permission, reason and eligible stock.
  - Pick, pack, stage and load are operational work states and do not post Sales stock out.
  - Sales Dispatch POST remains the single authoritative Sales STOCK OUT point and consumes/releases related Reservation.
  - Goods Receipt POST remains the single Purchasing inbound STOCK IN point; put-away cannot duplicate it.
  - Put-away/replenishment are internal location movements with zero company net quantity effect.
  - Warehouse Transfer ISSUE moves AVAILABLE source quantity to TRANSIT; RECEIVE moves TRANSIT to target; unresolved partial quantity remains TRANSIT.
  - Transfer loss/shortage requires explicit approved adjustment; received damage remains on-hand in a non-available disposition.
  - Stock Count uses a ledger snapshot plus intervening movements; approved discrepancy posts COUNT_ADJUSTMENT and never direct stock overwrite.
  - Lot/serial/barcode mismatch is a hard Warehouse block; no generic accept-anyway override.
  - Warehouse/Location deactivation is blocked while stock, Reservation, Transit or open work remains.
  - Scrap/disposal is explicit approved STOCK OUT from eligible non-available quantity; financial value/write-off remains Finance-owned.
  - Offline Warehouse mutations use durable client operation identity; retries are idempotent and stale conflicts never silently overwrite server truth.
  - Account Ledger is authoritative Party financial-balance truth with separate CUSTOMER_RECEIVABLE and SUPPLIER_PAYABLE roles.
  - Customer receivable uses debit-increase/credit-decrease semantics; supplier payable uses credit-increase/debit-decrease semantics.
  - Customer and Supplier role balances never auto-net; explicit same-Party role netting requires permission, reason, approval and SoD.
  - Collection is balance-only CUSTOMER credit plus Cash/Bank IN; no Invoice allocation/open-item authority.
  - Supplier Payment is balance-only SUPPLIER debit plus Cash/Bank OUT; no Supplier Invoice allocation authority.
  - Customer/Supplier advances are explicit opposite-sign role positions, not Invoice allocations.
  - Cash Ledger and Bank Ledger are authoritative money truth; mutable account balance fields are forbidden as authority.
  - Same-currency treasury transfer posts paired source OUT and target IN atomically; fees are explicit.
  - FX transfer snapshots exact source/target amounts, actual executed rate/base values and fees; manual override is permissioned/audited/approved.
  - Realized FX uses weighted carrying base for balance-only foreign-currency positions; original commercial FX snapshots remain immutable.
  - Unrealized FX is a separate period-end revaluation workflow controlled by versioned Finance revaluation policy.
  - Bank statement import is evidence/staging only and never directly changes Bank Ledger.
  - Bank reconciliation links statement evidence to posted Bank Ledger; suggestions/confidence are non-authoritative and overmatch is forbidden.
  - Finance Posting Period states are OPEN, FROZEN and CLOSED; historical corrections use linked reversal/correction rather than silent back-edit.
  - Inventory valuation uses perpetual moving weighted average at company + Product/Variant valuation-pool grain.
  - Internal Warehouse transfer does not revalue inventory; Goods Receipt increases provisional carrying value.
  - Sales Dispatch removes inventory carrying value and creates a dispatched-not-invoiced cost bridge; Sales Invoice recognizes COGS from that bridge without second stock/value reduction.
  - Supplier Invoice/landed-cost late deltas are source-linked and apportioned across on-hand valuation, dispatch cost bridge and recognized COGS as applicable.
  - Positive Count Adjustment without a valid moving-average basis requires explicit approved unit valuation; silent zero-cost inventory is forbidden.
  - Scrap/write-off physical effect remains Warehouse-owned while Finance owns carrying-value removal/write-off classification.
  - Finance owns customer credit limit/risk/hold signal; Sales consumes but does not author it.

