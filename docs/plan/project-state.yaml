known_constraints:
  - Application core is not yet implemented.
  - Database logical/schema design is intentionally deferred until core workflows are sufficiently frozen.
  - Most module folders still require detailed plans.
  - Business rules must not be inferred from generic ERP conventions when project sources are silent.
  - Runner VM and test server are separate machines; never conflate runner-local results with test-server results.
  - Test infrastructure details beyond verified topology, test hostname, local runner and Dockerized PostgreSQL must remain UNKNOWN until checked.

