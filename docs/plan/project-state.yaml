known_constraints:
  - Application core is not yet implemented.
  - Framework contract is planned but not implemented.
  - Database logical/schema design is intentionally deferred until core workflows are sufficiently frozen.
  - Business rules must not be inferred from generic ERP conventions when project sources are silent.
  - Runner VM and test server are separate machines; never conflate runner-local results with test-server results.
  - PLAN-002 Sales planning is frozen; Sales implementation/DB work must still follow the master sequence and P3/P4 gates.
  - PLAN-003 Party / Customer / Supplier planning is frozen.
  - PLAN-004 Product / Inventory master planning is frozen.
  - PLAN-005 Purchasing workflow planning is frozen.
  - PLAN-006 Warehouse operational planning is frozen.
  - PLAN-007 Finance / Treasury workflow planning is frozen.
  - PLAN-008 Checks / Promissory Notes workflow planning is frozen.
  - Incoming receipt settles Customer role into a Finance-owned instrument receivable position; Cash/Bank waits for actual settlement.
  - Outgoing delivery settles Supplier role into a Finance-owned instrument payable obligation; Cash/Bank waits for actual clearing.
  - Instrument custody and financial state are separate; bank handoff is custody-only; partial endorsement is forbidden in core PLAN-008.
  - PLAN-009 Returns / RMA workflow planning is frozen.
  - Customer return physical receipt posts STOCK IN to QUARANTINE; financial credit/refund is separate.
  - Supplier return shipment posts STOCK OUT; supplier financial adjustment/refund is separate.
  - Source-linked return is normal; source-less return is an approved exception with no fabricated source.
  - Returns preserves source/lot/serial/UOM lineage; Inventory and Finance remain authoritative.
  - P2 Core Commercial Workflow Planning is complete; logical database planning is now dependency-eligible.

