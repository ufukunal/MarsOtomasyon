  status: active
  file: docs/plan/active-task.yaml

completed_planning_tasks:
  - PLAN-001
  - FRAMEWORK-001

locked_decisions:
  - Only main branch is allowed.
  - No PR-based development workflow.
  - PostgreSQL is the authoritative source of truth.
  - Valkey is cache/session/lock only, not accounting truth.
  - Ledger-based stock and financial truth.
  - Posted records are corrected by reversal, not silent mutation.
  - Heavy test suites are deferred to Full Test Day.
  - No React, Vue, Angular, Bootstrap, Tailwind or jQuery in core frontend.
  - Mars uses its own UI/component system.
  - Web, Desktop and Mobile share a common client core with thin platform shells.
  - Architecture starts as modular monolith, not microservices.
  - Transactional module planning follows workflow -> effects -> state -> data -> API/UI order.
  - V38 is preserved as product/UI reference but its patch architecture is not production architecture.
  - Framework is shared infrastructure only; domain rules remain module-owned.
  - Every session ends with SESSION REPORT and standalone NEXT PROMPT.

framework_decision_gates:
  - exact .NET SDK/runtime version
  - exact ORM/data-access library
  - exact auth/identity provider
  - exact OpenAPI tooling
  - exact logging/metrics stack
  - exact object/file storage backend
  - exact Desktop shell technology
  - exact Mobile shell technology
  - optional scheduling library
  - production secret store
  - production reverse proxy/tunnel details

